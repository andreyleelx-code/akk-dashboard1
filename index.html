<title>Задачи и контакты АКК</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- Interactive, zoomable/pannable timeline for "Хронология" (vis-timeline: free, CDN, no key). -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vis-timeline@7.7.3/styles/vis-timeline-graph2d.min.css">
<script src="https://cdn.jsdelivr.net/npm/vis-timeline@7.7.3/standalone/umd/vis-timeline-graph2d.min.js"></script>
<!-- "Add to Home Screen" support: a manifest + touch icons let a phone pin this
     page as a standalone, full-screen app icon (Android reads the manifest,
     iOS reads the apple-touch-icon/meta tags — belt and suspenders). -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16213E">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="apple-touch-icon" sizes="167x167" href="icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="icon-152.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="АКК">
<style>
  /* Layout concept: one shared office binder — a tab for each person's own
     calendar/tasks, a summary tab that reads like a status board, and a
     card-index tab (the visitnitsa) at the end. */
  :root{
    /* Palette matched to the АКК press-monitoring dashboard (navy + blue accent) so both tools read as one brand. */
    --bg:#F4F5F7; --surface:#FFFFFF; --surface-2:#ECEEF2;
    --ink:#14192B; --ink-dim:#59617A; --line:#DDE1E8;
    --navy:#16213E; --navy-ink:#0D1428;
    --accent:#2A78D6; --accent-ink:#FFFFFF;
    --good:#0CA30C; --good-bg:#E2F6E2;
    --warn:#B8790A; --warn-bg:#FDF1D9;
    --gold:#C9A14A;
    --shadow-1:0 1px 2px rgba(20,25,43,.05), 0 2px 8px rgba(20,25,43,.06);
    --shadow-2:0 2px 4px rgba(20,25,43,.07), 0 6px 18px rgba(20,25,43,.09);
    --font-ui:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
    --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14161C; --surface:#1B1E26; --surface-2:#23272F;
      --ink:#F2F3F6; --ink-dim:#AAB0C0; --line:#323744;
      --navy:#1D2B4F; --navy-ink:#101A33;
      --accent:#5B9CE8; --accent-ink:#0D1428;
      --good:#3FC93F; --good-bg:#17301A;
      --warn:#F0B23A; --warn-bg:#3A2F14;
      --gold:#D9B968;
      --shadow-1:0 1px 2px rgba(0,0,0,.25), 0 2px 10px rgba(0,0,0,.28);
      --shadow-2:0 2px 6px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.34);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14161C; --surface:#1B1E26; --surface-2:#23272F;
    --ink:#F2F3F6; --ink-dim:#AAB0C0; --line:#323744;
    --navy:#1D2B4F; --navy-ink:#101A33;
    --accent:#5B9CE8; --accent-ink:#0D1428;
    --good:#3FC93F; --good-bg:#17301A;
    --warn:#F0B23A; --warn-bg:#3A2F14;
    --gold:#D9B968;
    --shadow-1:0 1px 2px rgba(0,0,0,.25), 0 2px 10px rgba(0,0,0,.28);
    --shadow-2:0 2px 6px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.34);
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--font-ui); font-size:14px; line-height:1.4;
    padding-inline:12px; padding-block:0;
    display:flex; flex-direction:column;
  }
  .tabular{font-variant-numeric:tabular-nums;}
  [hidden]{display:none!important;}
  button{font:inherit;}

  header.top{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:6;
    background:var(--bg); padding-block:0 0; display:flex; flex-direction:column; gap:7px;
  }
  /* Letterhead brand band — full-bleed navy card with gold hairlines, echoing the
     org's own printed card (emblem centered, name centered, gold rules top/bottom). */
  .brand-row{
    display:flex; flex-direction:column; align-items:center; text-align:center; gap:4px;
    width:calc(100% + 24px); margin-inline:-12px;
    padding:14px 14px 11px;
    background:linear-gradient(170deg,var(--navy),var(--navy-ink));
    border-top:3px solid var(--gold); border-bottom:2px solid var(--gold);
    box-shadow:0 4px 14px rgba(13,20,40,.22);
  }
  .brand-logo{
    flex:none; width:46px; height:46px; border-radius:50%;
    background:#fff; box-shadow:0 2px 10px rgba(0,0,0,.28);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    margin-bottom:2px;
  }
  .brand-logo img{width:100%; height:100%; object-fit:contain; display:block; padding:3px; box-sizing:border-box;}
  h1{margin:0; font-size:16px; font-weight:700; letter-spacing:.01em; color:#fff; line-height:1.3;}
  .brand-sub{display:block; font-size:11px; font-weight:600; letter-spacing:.03em; color:var(--gold); text-transform:uppercase;}

  /* Hero cover for the summary tab — a park scene echoing the org's own card. */
  .hero-cover{position:relative; width:100%; aspect-ratio:21/9; max-height:150px; border-radius:14px; overflow:hidden; background:var(--navy); border:1px solid var(--line);}
  .hero-cover svg{position:absolute; inset:0; width:100%; height:100%; display:block;}
  .hero-caption{margin-top:5px; font-size:11px; color:var(--ink-dim); text-align:center; font-style:italic;}

  .tabbar{display:flex; flex-wrap:wrap; gap:6px; padding-bottom:4px;}
  .tab-btn{
    flex:none; border:1px solid var(--line); background:var(--surface); color:var(--ink-dim);
    border-radius:999px; padding:6px 11px; cursor:pointer; white-space:nowrap; font-weight:500; font-size:13px;
  }
  .tab-btn.active{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600; box-shadow:0 2px 7px rgba(42,120,214,.35);}
  .tab-btn.ghost-add{color:var(--ink-dim); border-style:dashed;}

  main{flex:1; padding-block:4px 56px;}
  .panel{display:flex; flex-direction:column; gap:10px;}

  /* --- sub nav (per employee) --- */
  .subnav{display:flex; gap:6px;}
  .subnav button{
    flex:1; border:1px solid var(--line); background:var(--surface); color:var(--ink-dim);
    border-radius:9px; padding:8px 6px; cursor:pointer; font-weight:500; font-size:13px;
  }
  .subnav button.active{background:var(--surface-2); color:var(--ink); font-weight:700; border-color:var(--ink-dim);}
  .emp-head{display:flex; justify-content:space-between; align-items:baseline;}
  .emp-head h2{margin:0; font-size:16px; font-weight:700;}
  .emp-head .pos{color:var(--ink-dim); font-size:12.5px;}

  /* --- cards / rows --- */
  .box{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 11px; box-shadow:var(--shadow-1);}
  .task-row{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    background:var(--surface); border:1px solid var(--line); border-radius:11px; padding:10px 12px; cursor:pointer;
    box-shadow:var(--shadow-1); transition:box-shadow .15s, transform .15s;
  }
  .task-row:active{transform:scale(.99); box-shadow:none;}
  .task-row.done{opacity:.6;}
  .task-dot{flex:none; width:9px; height:9px; border-radius:50%; background:var(--ink-dim);}
  .task-dot.open{background:var(--accent);}
  .task-dot.done{background:var(--good);}
  .task-row .t-body{flex:1; min-width:0;}
  .task-row .t-title{font-weight:600; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .task-row.done .t-title{text-decoration:line-through;}
  .task-row .t-meta{color:var(--ink-dim); font-size:12px;}
  .task-row .t-date{flex:none; font-family:var(--font-mono); font-size:12px; color:var(--ink-dim);}
  .t-date.overdue{color:var(--accent); font-weight:600;}

  .filters{display:flex; gap:6px;}
  .filters button{
    border:1px solid var(--line); background:var(--surface); color:var(--ink-dim);
    border-radius:8px; padding:6px 10px; cursor:pointer; font-size:12.5px;
  }
  .filters button.active{background:var(--surface-2); color:var(--ink); font-weight:600;}

  .quickadd{display:flex; gap:8px;}
  .quickadd input{
    flex:1; min-width:0; font:inherit; background:var(--surface); border:1px solid var(--line);
    border-radius:9px; padding:9px 11px; color:var(--ink); outline:none;
  }
  .quickadd input:focus{border-color:var(--accent);}
  .quickadd button{
    flex:none; background:var(--accent); color:var(--accent-ink); border:0; border-radius:9px; padding:0 14px; cursor:pointer; font-weight:600;
  }

  /* --- kanban board --- */
  .board-wrap{display:flex; gap:9px; overflow-x:auto; padding-bottom:8px; -webkit-overflow-scrolling:touch; scroll-snap-type:x proximity;}
  .board-col{
    flex:none; width:76%; max-width:230px; scroll-snap-align:start;
    background:var(--surface-2); border-radius:13px; padding:9px; border-top:3px solid var(--stage-c, var(--line));
    display:flex; flex-direction:column; gap:7px; min-width:0;
  }
  @media (min-width:480px){ .board-col{width:220px;} }
  .board-col-head{
    display:flex; align-items:center; gap:6px;
    font-size:11.5px; font-weight:700; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.03em; padding:0 2px;
  }
  .board-col-head .dot{width:7px; height:7px; border-radius:50%; background:var(--stage-c, var(--ink-dim)); flex:none;}
  .board-col-head .lbl{flex:1;}
  .board-col-head .cnt{background:var(--surface); border-radius:999px; padding:1px 7px; font-family:var(--font-mono); font-size:11px; color:var(--ink);}
  .board-empty{font-size:11.5px; color:var(--ink-dim); padding:10px 2px; text-align:center;}
  .board-card{
    background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:9px 10px;
    text-align:left; cursor:pointer; display:flex; flex-direction:column; gap:5px; width:100%;
    box-shadow:var(--shadow-1); transition:box-shadow .15s, transform .15s;
  }
  .board-card:active{transform:scale(.99); box-shadow:none;}
  .board-card .bc-title{font-size:13px; font-weight:600; line-height:1.3; word-break:break-word;}
  .board-card .bc-meta{font-size:11px; color:var(--ink-dim);}
  .board-card .bc-meta.overdue{color:var(--accent); font-weight:600;}
  .bc-nav{display:flex; justify-content:space-between; margin-top:1px;}
  .bc-move{border:0; background:var(--surface-2); color:var(--ink-dim); font-size:12px; padding:3px 8px; border-radius:7px; cursor:pointer;}
  .bc-move:hover{background:var(--line); color:var(--ink);}

  /* --- stage segmented control (task modal) --- */
  .stage-seg{display:flex; gap:5px;}
  .stage-btn{
    flex:1; border:1px solid var(--line); background:var(--surface); color:var(--ink-dim);
    border-radius:9px; padding:8px 4px; cursor:pointer; font-size:12px; font-weight:600; text-align:center;
  }
  .stage-btn.active{background:var(--stage-c, var(--navy)); border-color:var(--stage-c, var(--navy)); color:#fff; box-shadow:0 2px 7px color-mix(in srgb, var(--stage-c, var(--navy)) 45%, transparent);}

  /* --- CRM block (visitnitsa contact detail) --- */
  .stage-pill{display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:700; padding:3px 10px; border-radius:999px; color:#fff; text-transform:uppercase; letter-spacing:.03em; background:var(--pill-c, var(--ink-dim));}
  .crm-box{display:flex; flex-direction:column; gap:7px; padding:10px 11px; background:var(--surface-2); border-radius:12px; margin-bottom:2px;}
  .crm-line{display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:12.5px; color:var(--ink-dim);}
  .crm-line b{color:var(--ink); font-weight:600;}
  .crm-line.overdue b{color:var(--accent);}
  .crm-touch-btn{border:0; background:var(--surface); color:var(--accent); font:inherit; font-size:11.5px; font-weight:600; padding:5px 9px; border-radius:7px; cursor:pointer; flex:none;}

  /* --- calendar --- */
  .cal-nav{display:flex; align-items:center; justify-content:space-between;}
  .cal-nav button{background:var(--surface); border:1px solid var(--line); border-radius:8px; width:28px; height:28px; cursor:pointer; color:var(--ink);}
  .cal-nav .cal-title{font-weight:700; font-size:14px; text-transform:capitalize;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:3px;}
  .cal-dow{text-align:center; font-size:10px; color:var(--ink-dim); font-weight:600; text-transform:uppercase; letter-spacing:.03em;}
  .cal-cell{
    min-height:42px; border:1px solid var(--line); border-radius:8px; background:var(--surface);
    padding:3px; display:flex; flex-direction:column; gap:1px; cursor:pointer; position:relative; min-width:0;
  }
  .cal-cell.outside{opacity:.35;}
  .cal-cell.today{border-color:var(--accent); border-width:1.5px;}
  .cal-daynum{font-size:10.5px; color:var(--ink-dim); font-family:var(--font-mono);}
  .cal-cell.today .cal-daynum{color:var(--accent); font-weight:700;}
  .cal-chip{
    font-size:8.5px; background:var(--surface-2); border-radius:4px; padding:0 3px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer;
  }
  .cal-chip.done{opacity:.55; text-decoration:line-through;}
  .cal-note-dot{position:absolute; top:4px; right:5px; width:5px; height:5px; border-radius:50%; background:var(--warn);}

  /* --- dashboard bars --- */
  .bar-wrap{display:flex; flex-direction:column; gap:6px;}
  .bar-label{display:flex; justify-content:space-between; font-size:12.5px; color:var(--ink-dim);}
  .bar-track{height:9px; border-radius:5px; overflow:hidden; background:var(--surface-2); display:flex;}
  .bar-seg{height:100%;}
  .legend{display:flex; gap:12px; font-size:11.5px; color:var(--ink-dim); flex-wrap:wrap;}
  .legend span{display:inline-flex; align-items:center; gap:4px;}
  .legend i{width:8px; height:8px; border-radius:2px; display:inline-block;}

  .stat-row{display:grid; grid-template-columns:repeat(4,1fr); gap:6px;}
  @media (max-width:360px){ .stat-row{grid-template-columns:repeat(2,1fr);} }
  .stat-tile{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:8px; text-align:center; min-width:0; box-shadow:var(--shadow-1);}
  .stat-tile b{display:block; font-size:18px; font-family:var(--font-mono);}
  .stat-tile span{font-size:10px; color:var(--ink-dim);}

  /* --- summary tab --- */
  .sum-row{
    display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line);
    border-radius:12px; padding:10px 12px; cursor:pointer; width:100%; text-align:left;
    box-shadow:var(--shadow-1); transition:box-shadow .15s, transform .15s;
  }
  .sum-row:active{transform:scale(.99); box-shadow:none;}
  .sum-avatar{flex:none; width:30px; height:30px; border-radius:50%; background:var(--surface-2); color:var(--ink-dim); display:flex; align-items:center; justify-content:center; font-weight:600; font-size:11.5px; overflow:hidden;}
  .sum-avatar img{width:100%; height:100%; object-fit:cover;}
  .sum-name{flex:0 0 96px; min-width:0;}
  .sum-name b{display:block; font-size:13.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .sum-name span{font-size:11px; color:var(--ink-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block;}
  .sum-bars{flex:1; min-width:0; display:flex; flex-direction:column; gap:4px;}
  .sum-nums{flex:none; display:flex; gap:10px; font-family:var(--font-mono); font-size:12px;}
  .sum-nums .bad{color:var(--accent); font-weight:700;}

  /* --- sheets / modals (shared) --- */
  .sheet-overlay{position:fixed; inset:0; background:rgba(10,12,20,.5); display:flex; align-items:flex-end; justify-content:center; z-index:30;}
  .sheet-overlay[hidden]{display:none;}
  .sheet{width:100%; max-width:480px; max-height:92vh; overflow-y:auto; background:var(--surface); border-radius:18px 18px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:14px; box-shadow:var(--shadow-2);}
  .sheet-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .sheet-head h2{margin:0; font-size:17px; font-weight:700; flex:1;}
  .sheet-close{background:none; border:0; color:var(--ink-dim); cursor:pointer; padding:4px; flex:none;}
  .field{display:flex; flex-direction:column; gap:5px;}
  .field label{font-size:12px; color:var(--ink-dim); font-weight:500;}
  .field input, .field textarea{font:inherit; color:var(--ink); background:var(--surface-2); border:1px solid var(--line); border-radius:9px; padding:9px 11px; outline:none; width:100%;}
  .field input:focus, .field textarea:focus{border-color:var(--accent);}
  .field textarea{resize:vertical; min-height:52px;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  @media (max-width:360px){.grid2{grid-template-columns:1fr;}}
  .btn{font:inherit; font-weight:600; border-radius:10px; padding:10px 16px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink); cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;}
  .btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
  .btn.ghost{background:none;}
  .btn.danger{color:var(--accent); background:none;}
  .btn.block{width:100%;}
  .btn.sm{padding:7px 12px; font-size:12.5px;}
  .row2{display:flex; gap:10px;}

  .choice-grid{display:flex; flex-direction:column; gap:8px;}
  .choice-btn{display:flex; align-items:center; justify-content:center; gap:8px; padding:16px; border-radius:12px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink); font-weight:600; cursor:pointer;}

  .log-list{display:flex; flex-direction:column; gap:6px; max-height:160px; overflow-y:auto;}
  .log-item{background:var(--surface-2); border-radius:8px; padding:7px 9px; font-size:13px;}
  .log-item time{display:block; font-size:10.5px; color:var(--ink-dim); font-family:var(--font-mono); margin-top:2px;}
  .log-add{display:flex; gap:8px;}
  .log-add input{flex:1; min-width:0; font:inherit; background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:7px 9px; color:var(--ink); outline:none;}
  .log-add button{flex:none; background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:0 11px; cursor:pointer; color:var(--ink);}

  .check-list{display:flex; flex-direction:column; gap:6px;}
  .check-item{display:flex; align-items:center; gap:8px; font-size:13.5px;}
  .check-item input[type=checkbox]{flex:none; width:17px; height:17px;}
  .check-item.done span{text-decoration:line-through; color:var(--ink-dim);}

  .day-task-mini{display:flex; align-items:center; gap:8px; background:var(--surface-2); border-radius:8px; padding:8px 10px; cursor:pointer; font-size:13px;}

  /* --- visitnitsa (shared styles reused from the standalone app) --- */
  .search{display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:9px 12px; box-shadow:var(--shadow-1);}
  .search svg{flex:none; opacity:.55;}
  .search input{flex:1; min-width:0; border:0; background:transparent; color:var(--ink); font:inherit; outline:none;}
  .search input::placeholder{color:var(--ink-dim);}
  .contact-card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px; display:flex; gap:12px; align-items:center; cursor:pointer; text-align:left; width:100%; font:inherit; color:inherit; box-shadow:var(--shadow-1); transition:box-shadow .15s, transform .15s, border-color .15s;}
  .contact-card:hover{border-color:var(--accent);}
  .contact-card:active{transform:scale(.99); box-shadow:none;}
  .avatar{flex:none; width:42px; height:42px; border-radius:50%; background:var(--surface-2); color:var(--ink-dim); display:flex; align-items:center; justify-content:center; font-weight:600; font-size:15px; overflow:hidden;}
  .avatar img{width:100%; height:100%; object-fit:cover;}
  .cc-body{flex:1; min-width:0;}
  .cc-name{font-weight:600; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .cc-meta{color:var(--ink-dim); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .cc-phone{flex:none; font-family:var(--font-mono); font-size:12.5px; color:var(--ink-dim);}
  .cc-stage-dot{flex:none; width:8px; height:8px; border-radius:50%; background:var(--stage-c, var(--ink-dim));}
  .cc-event{display:inline-block; margin-top:3px; max-width:100%; font-size:10.5px; font-weight:600; color:var(--gold); background:rgba(201,161,74,.14); border:1px solid rgba(201,161,74,.4); border-radius:999px; padding:1px 8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

      }).then(function(json){
        var cand = json.candidates && json.candidates[0];
        var parts2 = (cand && cand.content && cand.content.parts) || [];
        var txt = parts2.map(function(p){return p.text||'';}).join('');
        try { return JSON.parse(txt); } catch(e){ var er = new Error('bad json from model'); er.code='bad_json'; throw er; }
      });
    };
    // Best-effort cross-check of recognised card data against the open
    // internet, via Gemini's own Google Search grounding tool. Not JSON
    // mode (grounding + forced-JSON output don't combine reliably), so
    // this returns a short human-readable line instead of structured data.
    sampleFn.verify = function(fields){
      var who = [fields && fields.name, fields && fields.company].filter(Boolean).join(', ');
      if(!who) return Promise.resolve('');
      var prompt = 'Проверь через поиск в интернете (открытые источники), существуют ли следующие данные с визитки: '
        + 'имя "'+(fields.name||'')+'", должность "'+(fields.position||'')+'", компания/организация "'+(fields.company||'')+'". '
        + 'Ответь ОДНОЙ короткой строкой на русском (до 160 символов): что подтвердилось, а что не удалось найти. '
        + 'Если ничего по теме не нашлось — так и напиши, не выдумывай факты.';
      var body = {contents:[{role:'user', parts:[{text:prompt}]}], tools:[{google_search:{}}]};
      return callGemini(body).then(function(json){
        var cand = json.candidates && json.candidates[0];
        var parts2 = (cand && cand.content && cand.content.parts) || [];
        var txt = parts2.filter(function(p){ return typeof p.text==='string'; }).map(function(p){ return p.text; }).join(' ').trim();
        return txt ? ('🔎 Сверка с интернетом: '+txt) : '';
      }).catch(function(){ return ''; });
    };
    return sampleFn;
  }

  window.claude = {
    use: function(name){
      if(name==='db') return Promise.resolve(dbInstance);
      if(name==='assets') return Promise.resolve({upload: uploadToCloudinary});
      if(name==='sample') return Promise.resolve(makeSample());
      if(name==='user') return Promise.resolve({ id: function(){
        try {
          var k='akk_uid'; var v = localStorage.getItem(k);
          if(!v){ v = 'u_'+Math.random().toString(36).slice(2)+Date.now().toString(36); localStorage.setItem(k,v); }
          return Promise.resolve(v);
        } catch(e){ return Promise.resolve('u_anon'); }
      }});
      return Promise.reject(new Error('capability not available: '+name));
    }
  };
})();
</script>

<script>
(function(){

  // ---------- hero cover art (summary tab) ----------

  // photo+navy+gold look, drawn as vector shapes rather than a photo.

      '<path d="M97,232 C94,205 92,178 97,150" fill="none" stroke="#4A3626" stroke-width="5" stroke-linecap="round"/>' +

        '<path d="M97,147 C90,170 85,192 83,216"/>' +
        '<path d="M97,147 C97,172 96,195 98,218"/>' +
        '<path d="M97,147 C104,170 109,192 111,215"/>' +
        '<path d="M97,148 C112,166 123,185 130,208"/>' +
        '<path d="M97,150 C118,163 134,178 144,200"/>' +
        '<path d="M97,152 C116,160 130,172 140,188"/>' +
        '<path d="M97,152 C80,160 66,170 56,185"/>' +
      '</g>' +
      // right willow, smaller
      '<ellipse cx="549" cy="188" rx="40" ry="28" fill="#44602F" opacity=".75" filter="url(#akkBlurSoft)"/>' +
      '<path d="M549,250 C547,222 546,202 549,188" fill="none" stroke="#4A3626" stroke-width="4" stroke-linecap="round"/>' +
      '<g stroke="#2E4324" stroke-width="1.5" stroke-linecap="round" opacity=".8" fill="none">' +
        '<path d="M549,188 C535,200 525,213 519,230"/>' +
        '<path d="M549,187 C540,201 533,215 530,232"/>' +
        '<path d="M549,187 C549,203 549,218 550,233"/>' +
        '<path d="M549,187 C558,201 565,214 568,230"/>' +
        '<path d="M549,188 C563,198 573,210 579,224"/>' +
      '</g>' +
    '</svg>';

  // ---------- state ----------
  var employees = [];              // [{id,name,position,order}]
  var tasksBySlug = {};            // id -> [task,...]
  var dayNotesBySlug = {};         // id -> {iso: entries[]}
  var subscribed = {};             // id -> true
  var contacts = [];
  var uiState = {};                // id -> {view, calY, calM, filter}
  var activeTab = 'summary';
  var dayModal = null;             // {slug, iso, mode}
  var taskModal = null;            // {slug, id}
  var selectedContactFile = null;
  var editingContactId = null;
  var contactsView = 'list';       // 'list' | 'assistant'
  var chatHistory = [];            // [{role:'user'|'assistant', text, actions?}]
  var chatBusy = false;

  var todayISO = isoDate(new Date());

  // ---------- helpers ----------
  function pad2(n){ return n<10 ? '0'+n : ''+n; }
  function isoDate(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
  function parseISO(s){ var p=s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
  function fmtHuman(iso){ if(!iso) return ''; var p=iso.split('-'); return p[2]+'.'+p[1]; }
  function fmtAtHuman(at){
    if(!at) return '';
    var d = new Date(at);
    return pad2(d.getDate())+'.'+pad2(d.getMonth()+1)+', '+pad2(d.getHours())+':'+pad2(d.getMinutes());
  }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function initials(name){
    var parts = String(name||'').trim().split(/\s+/).filter(Boolean);
    if(!parts.length) return '?';
    return (parts[0][0] + (parts[1]?parts[1][0]:'')).toUpperCase();
  }
  function pluralTasks(n){
    var n10=n%10, n100=n%100;
    if(n10===1 && n100!==11) return 'а';
    if(n10>=2 && n10<=4 && (n100<10||n100>=20)) return 'и';
    return '';
  }
  function uiFor(slug){
    if(!uiState[slug]) uiState[slug] = {view:'profile', calY:new Date().getFullYear(), calM:new Date().getMonth(), filter:'active'};
    return uiState[slug];
  }
  function isOverdue(t){
    if(t.status==='done') return false;
    var d = t.type==='range' ? t.end_date : t.date;
    return d && d < todayISO;
  }
  function empName(slug){ var e=employees.find(function(x){return x.id===slug;}); return e?e.name:slug; }
  function givenName(full){
    // Roster is "Фамилия Имя[ Отчество]" — the given name is the 2nd word; falls back to the full string.
    var parts = String(full||'').trim().split(/\s+/);
    return parts[1] || parts[0] || full;
  }
  function avatarHtml(e, sizeClass){
    if(e && e.photo_id) return '<img src="'+esc(e.photo_id)+'" alt="">';
    return esc(initials(e?e.name:''));
  }

  // ===================================================================
  // TAB BAR
  // ===================================================================
  function renderTabbar(){
    var bar = document.getElementById('tabbar');
    var html = '<button class="tab-btn'+(activeTab==='summary'?' active':'')+'" data-tab="summary">Сводка</button>';
    employees.slice().sort(function(a,b){return (a.order||0)-(b.order||0);}).forEach(function(e){
      html += '<button class="tab-btn'+(activeTab===e.id?' active':'')+'" data-tab="'+esc(e.id)+'" title="'+esc(e.name)+'">'+esc(givenName(e.name))+'</button>';
    });
    html += '<button class="tab-btn'+(activeTab==='contacts'?' active':'')+'" data-tab="contacts">Визитница</button>';
    if(canWrite) html += '<button class="tab-btn ghost-add" id="addEmpTabBtn" title="Добавить сотрудника">+</button>';
    bar.innerHTML = html;
    bar.querySelectorAll('.tab-btn[data-tab]').forEach(function(b){
      b.addEventListener('click', function(){ activeTab = b.getAttribute('data-tab'); renderAll(); });
    });
    var addBtn = document.getElementById('addEmpTabBtn');
    if(addBtn) addBtn.addEventListener('click', function(){ openEmpSheet(null); });
  }

  function renderAll(){
    renderTabbar();
    var main = document.getElementById('main');
    if(activeTab==='summary'){ main.innerHTML=''; main.appendChild(renderSummary()); }
    else if(activeTab==='contacts'){ main.innerHTML=''; main.appendChild(renderContactsTab()); }
    else { main.innerHTML=''; main.appendChild(renderEmployeeTab(activeTab)); }
  }

  // ===================================================================
  // SUMMARY TAB
  // ===================================================================
  function empCounts(slug){
    var list = tasksBySlug[slug]||[];
    var open=0, done=0, overdue=0;
    list.forEach(function(t){
      if(t.status==='done') done++; else open++;
      if(isOverdue(t)) overdue++;
    });
    return {open:open, done:done, overdue:overdue, total:list.length};
  }

  function renderHeroCover(){
    var box = document.createElement('div');
    var div = document.createElement('div');
    div.className = 'hero-cover';
    div.innerHTML = HERO_SVG;
    box.appendChild(div);
    var cap = document.createElement('div');
    cap.className = 'hero-caption';
    cap.textContent = 'K-Park · культурно-деловой центр АКК в Алатау';
    box.appendChild(cap);
    return box;
  }

  function renderSummary(){
    var wrap = document.createElement('div');
    wrap.className = 'panel';
    wrap.appendChild(renderHeroCover());
    if(!employees.length){
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'Сотрудники пока не добавлены. Нажмите «+» в строке вкладок.';
      wrap.appendChild(empty);
      return wrap;
    }
    var intro = document.createElement('p');
    intro.style.cssText = 'margin:0;color:var(--ink-dim);font-size:12.5px;';
    intro.textContent = 'Открыто / выполнено / просрочено — по каждому сотруднику. Нажмите на строку, чтобы открыть его дашборд.';
    wrap.appendChild(intro);

    employees.slice().sort(function(a,b){return (a.order||0)-(b.order||0);}).forEach(function(e){
      var c = empCounts(e.id);
      var total = c.open + c.done;
      var openPct = total ? Math.round(c.open/total*100) : 0;
      var row = document.createElement('button');
      row.className = 'sum-row';
      row.innerHTML =
        '<div class="sum-avatar">'+avatarHtml(e)+'</div>' +
        '<div class="sum-name"><b>'+esc(e.name)+'</b><span>'+esc(e.position||'')+'</span></div>' +
        '<div class="sum-bars"><div class="bar-track"><div class="bar-seg" style="width:'+openPct+'%;background:var(--accent)"></div><div class="bar-seg" style="width:'+(100-openPct)+'%;background:var(--good)"></div></div></div>' +
        '<div class="sum-nums"><span>'+c.open+' откр.</span><span class="'+(c.overdue?'bad':'')+'">'+c.overdue+' просроч.</span></div>';
      row.addEventListener('click', function(){ activeTab = e.id; renderAll(); });
      wrap.appendChild(row);
    });
    return wrap;
  }

  // ===================================================================
  // EMPLOYEE TAB (calendar / list / dashboard)
  // ===================================================================
  function renderEmployeeTab(slug){
    var e = employees.find(function(x){return x.id===slug;});
    var ui = uiFor(slug);
    var wrap = document.createElement('div');
    wrap.className = 'panel';
    if(!e){ wrap.innerHTML = '<div class="empty">Сотрудник не найден.</div>'; return wrap; }

    var head = document.createElement('div');
    head.className = 'emp-head';
    head.innerHTML = '<div style="display:flex;align-items:center;gap:10px;">' +
        '<div class="avatar" style="width:38px;height:38px;font-size:13px;">'+avatarHtml(e)+'</div>' +
        '<div><h2>'+esc(e.name)+'</h2><span class="pos">'+esc(e.position||'')+'</span></div>' +
      '</div>' +
      (canWrite ? '<button class="btn sm ghost" id="empEditBtn" title="Изменить сотрудника">✎</button>' : '');
    wrap.appendChild(head);
    var empEditBtn = head.querySelector('#empEditBtn');
    if(empEditBtn) empEditBtn.addEventListener('click', function(){ openEmpSheet(e); });

    var subnav = document.createElement('div');
    subnav.className = 'subnav';
    [['profile','Профиль'],['calendar','Календарь'],['list','Список'],['board','Доска']].forEach(function(pair){
      var b = document.createElement('button');
      b.textContent = pair[1];
      if(ui.view===pair[0]) b.className='active';
      b.addEventListener('click', function(){ ui.view=pair[0]; renderAll(); });
      subnav.appendChild(b);
    });
    wrap.appendChild(subnav);

    if(ui.view==='calendar') wrap.appendChild(renderCalendar(slug));
    else if(ui.view==='list') wrap.appendChild(renderList(slug));
    else if(ui.view==='board') wrap.appendChild(renderBoard(slug));
    else wrap.appendChild(renderProfile(slug));

    return wrap;
  }

  // ===================================================================
  // PROFILE (mini-profile per person — separate from tasks)
  // ===================================================================
  function renderProfile(slug){
    var e = employees.find(function(x){return x.id===slug;});
    var wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;flex-direction:column;gap:14px;';
    if(!e) return wrap;

    var top = document.createElement('div');
    top.style.cssText = 'display:flex;gap:14px;align-items:center;';
    var photoBig = document.createElement('div');
    photoBig.style.cssText = 'flex:none;width:84px;height:84px;border-radius:18px;overflow:hidden;background:var(--surface-2);color:var(--ink-dim);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:26px;';
    photoBig.innerHTML = e.photo_id ? '<img src="'+esc(e.photo_id)+'" alt="" style="width:100%;height:100%;object-fit:cover;display:block;">' : esc(initials(e.name));
    var info = document.createElement('div');
    info.style.cssText = 'flex:1;min-width:0;';
    info.innerHTML = '<div style="font-size:17px;font-weight:700;line-height:1.25;">'+esc(e.name)+'</div>' +
      '<div style="color:var(--ink-dim);font-size:13px;margin-top:3px;">'+esc(e.position||'')+'</div>';
    top.appendChild(photoBig); top.appendChild(info);
    wrap.appendChild(top);

    var hasContact = e.phone || e.email || e.telegram;
    var contactBox = document.createElement('div');
    contactBox.className = 'box';
    if(hasContact){
      var tgValue = e.telegram ? e.telegram.replace(/^@/,'') : '';
      var tgHref = tgValue ? 'https://t.me/'+encodeURIComponent(tgValue) : '';
      contactBox.innerHTML =
        detailRow('Телефон', e.phone) +
        detailRow('Email', e.email, true) +
        (e.telegram ? '<div class="detail-row"><span class="detail-label">Telegram</span><span class="detail-value-wrap"><span class="detail-value">'+esc(e.telegram)+'</span><a href="'+esc(tgHref)+'" class="copy-btn" style="text-decoration:none;">открыть</a></span></div>' : '') +
        (e.email ? '<p class="mailto-note">Ссылка «написать» открывает вашу почтовую программу — работает не в каждом браузере, адрес выше можно скопировать вручную.</p>' : '');
    } else {
      contactBox.innerHTML = '<div class="empty" style="padding:4px 0;">Контакты пока не заполнены'+(canWrite?' — нажмите ✎ наверху.':'.')+'</div>';
    }
    wrap.appendChild(contactBox);

    if(e.bio){
      var bioBox = document.createElement('div');
      bioBox.className = 'box';
      bioBox.innerHTML = '<div class="detail-label" style="margin-bottom:5px;">О себе</div><div style="font-size:13.5px;line-height:1.45;white-space:pre-wrap;">'+esc(e.bio)+'</div>';
      wrap.appendChild(bioBox);
    }

    var c = empCounts(slug);
    var statsHead = document.createElement('div');
    statsHead.style.cssText = 'color:var(--ink-dim);font-size:12.5px;';
    statsHead.textContent = 'Задачи';
    wrap.appendChild(statsHead);
    var stats = document.createElement('div');
    stats.className = 'stat-row';
    stats.innerHTML =
      '<div class="stat-tile"><b>'+c.total+'</b><span>всего</span></div>' +
      '<div class="stat-tile"><b>'+c.open+'</b><span>открыто</span></div>' +
      '<div class="stat-tile"><b>'+c.done+'</b><span>выполнено</span></div>' +
      '<div class="stat-tile"><b style="color:'+(c.overdue?'var(--accent)':'inherit')+'">'+c.overdue+'</b><span>просрочено</span></div>';
    wrap.appendChild(stats);

    var list = tasksBySlug[slug]||[];
    if(list.length){
      var total = list.length;
      function bar(title, segs){
        var b = document.createElement('div'); b.className='bar-wrap';
        var track = segs.map(function(s){ return '<div class="bar-seg" style="width:'+(s.pct)+'%;background:'+s.color+'"></div>'; }).join('');
        var legend = segs.map(function(s){ return '<span><i style="background:'+s.color+'"></i>'+s.label+' ('+s.n+')</span>'; }).join('');
        b.innerHTML = '<div class="bar-label"><span>'+title+'</span></div><div class="bar-track">'+track+'</div><div class="legend">'+legend+'</div>';
        return b;
      }
      var stageCounts = {todo:0, doing:0, done:0};
      list.forEach(function(t){ stageCounts[stageOf(t)]++; });
      wrap.appendChild(bar('По этапу', [
        {pct: stageCounts.todo/total*100, color:'var(--ink-dim)', label:'новое', n:stageCounts.todo},
        {pct: stageCounts.doing/total*100, color:'var(--accent)', label:'в работе', n:stageCounts.doing},
        {pct: stageCounts.done/total*100, color:'var(--good)', label:'готово', n:stageCounts.done}
      ]));
    }

    var goRow = document.createElement('div');
    goRow.style.cssText = 'display:flex; gap:8px;';
    var goBoard = document.createElement('button');
    goBoard.className = 'btn sm ghost'; goBoard.style.flex = '1';
    goBoard.textContent = 'Доска →';
    goBoard.addEventListener('click', function(){ uiFor(slug).view = 'board'; renderAll(); });
    var goList = document.createElement('button');
    goList.className = 'btn sm ghost'; goList.style.flex = '1';
    goList.textContent = 'Список →';
    goList.addEventListener('click', function(){ uiFor(slug).view = 'list'; renderAll(); });
    goRow.appendChild(goBoard); goRow.appendChild(goList);
    wrap.appendChild(goRow);

    return wrap;
  }

  // ===================================================================
  // BOARD (Kanban view — Новое / В работе / Готово)
  //   `stage` is a lightweight extra field layered on top of the existing
  //   status:'open'|'done' so Calendar/List/Dashboard keep working unchanged.
  //   Missing stage is inferred from status for tasks created before this.
  // ===================================================================
  var TASK_STAGES = [['todo','Новое'],['doing','В работе'],['done','Готово']];
  var STAGE_COLOR = {todo:'var(--ink-dim)', doing:'var(--accent)', done:'var(--good)'};
  function stageOf(t){
    if(t.stage && TASK_STAGES.some(function(c){return c[0]===t.stage;})) return t.stage;
    return t.status==='done' ? 'done' : 'todo';
  }
  function moveStage(slug, t, newStage){
    if(!dbNs || !canWrite) return;
    dbNs.doc('employees/'+slug+'/tasks/'+t.id).update({
      stage:newStage, status: newStage==='done'?'done':'open', updated_at:new Date().toISOString()
    });
  }

  function renderBoard(slug){
    var ui = uiFor(slug);
    if(!ui.boardStage || !TASK_STAGES.some(function(c){return c[0]===ui.boardStage;})) ui.boardStage = 'todo';
    var outer = document.createElement('div');
    var tasks = (tasksBySlug[slug]||[]).slice();
    tasks.sort(function(a,b){ return (a.date||a.start_date||a.created_at||'').localeCompare(b.date||b.start_date||b.created_at||''); });

    var hint = document.createElement('p');
    hint.style.cssText = 'margin:0 0 9px;color:var(--ink-dim);font-size:12px;';
    hint.textContent = 'Переключайте этап кнопками ниже. Стрелки на карточке передвигают задачу между этапами.';
    outer.appendChild(hint);

    // Stage switcher replaces side-scrolling columns — one full-width list at a time, nothing to swipe.
    var seg = document.createElement('div');
    seg.className = 'stage-seg';
    TASK_STAGES.forEach(function(c){
      var n = tasks.filter(function(t){ return stageOf(t)===c[0]; }).length;
      var b = document.createElement('button');
      b.className = 'stage-btn'+(ui.boardStage===c[0]?' active':'');
      b.style.setProperty('--stage-c', STAGE_COLOR[c[0]]);
      b.textContent = c[1]+' ('+n+')';
      b.addEventListener('click', function(){ ui.boardStage = c[0]; renderAll(); });
      seg.appendChild(b);
    });
    outer.appendChild(seg);

    var ci = TASK_STAGES.findIndex(function(c){ return c[0]===ui.boardStage; });
    var col = document.createElement('div');
    col.className = 'board-col';
    col.style.cssText = 'width:100%; max-width:none; margin-top:10px;';
    col.style.setProperty('--stage-c', STAGE_COLOR[ui.boardStage]);
    var colTasks = tasks.filter(function(t){ return stageOf(t)===ui.boardStage; });
    if(!colTasks.length){
      var emp = document.createElement('div'); emp.className='board-empty'; emp.style.padding='22px 2px'; emp.textContent='Пусто';
      col.appendChild(emp);
    }
    colTasks.forEach(function(t){
      var card = document.createElement('div');
      card.className = 'board-card';
      var dateLabel = t.type==='point' ? (t.date?fmtHuman(t.date)+(t.time?' '+t.time:''):'') :
                      t.type==='range' ? (fmtHuman(t.start_date)+'–'+fmtHuman(t.end_date)) : '';
      var overdue = isOverdue(t);
      var navHtml = canWrite ? (
        '<div class="bc-nav">' +
          (ci>0 ? '<button class="bc-move" data-dir="-1" title="Назад">← '+esc(TASK_STAGES[ci-1][1])+'</button>' : '<span></span>') +
          (ci<TASK_STAGES.length-1 ? '<button class="bc-move" data-dir="1" title="Дальше">'+esc(TASK_STAGES[ci+1][1])+' →</button>' : '<span></span>') +
        '</div>'
      ) : '';
      card.innerHTML =
        '<span class="bc-title">'+esc(t.title)+'</span>' +
        '<span class="bc-meta'+(overdue?' overdue':'')+'">'+(dateLabel?esc(dateLabel):'без срока')+(t.from_person?' · '+esc(t.from_person):'')+'</span>' +
        navHtml;
      card.addEventListener('click', function(ev){
        if(ev.target.closest('.bc-move')) return;
        openTaskModal(slug, t.id);
      });
      card.querySelectorAll('.bc-move').forEach(function(btn){
        btn.addEventListener('click', function(ev){
          ev.stopPropagation();
          var dir = +btn.getAttribute('data-dir');
          var dest = TASK_STAGES[ci+dir][0];
          moveStage(slug, t, dest);
          ui.boardStage = dest; // follow the card so it doesn't just vanish from view
          renderAll();
        });
      });
      col.appendChild(card);
    });
    outer.appendChild(col);
    return outer;
  }

  var DOW = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  var MONTHS = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];

  function renderCalendar(slug){
    var ui = uiFor(slug);
    var box = document.createElement('div');
    box.className = 'box';
    var nav = document.createElement('div');
    nav.className = 'cal-nav';
    nav.innerHTML = '<button id="calPrev">‹</button><span class="cal-title">'+MONTHS[ui.calM]+' '+ui.calY+'</span><button id="calNext">›</button>';
    box.appendChild(nav);
    nav.querySelector('#calPrev').addEventListener('click', function(){ ui.calM--; if(ui.calM<0){ui.calM=11; ui.calY--;} renderAll(); });
    nav.querySelector('#calNext').addEventListener('click', function(){ ui.calM++; if(ui.calM>11){ui.calM=0; ui.calY++;} renderAll(); });

    var grid = document.createElement('div');
    grid.className = 'cal-grid';
    grid.style.marginTop = '8px';
    DOW.forEach(function(d){ var el=document.createElement('div'); el.className='cal-dow'; el.textContent=d; grid.appendChild(el); });

    var first = new Date(ui.calY, ui.calM, 1);
    var startOffset = (first.getDay()+6)%7; // Monday=0
    var startCell = new Date(ui.calY, ui.calM, 1-startOffset);
    var tasks = tasksBySlug[slug]||[];
    var notes = dayNotesBySlug[slug]||{};

    for(var i=0;i<42;i++){
      var d = new Date(startCell.getFullYear(), startCell.getMonth(), startCell.getDate()+i);
      var iso = isoDate(d);
      var cell = document.createElement('div');
      cell.className = 'cal-cell' + (d.getMonth()!==ui.calM?' outside':'') + (iso===todayISO?' today':'');
      var dayTasks = tasks.filter(function(t){
        if(t.type==='point') return t.date===iso;
        if(t.type==='range') return t.start_date<=iso && iso<=t.end_date;
        return false;
      });
      var html = '<span class="cal-daynum">'+d.getDate()+'</span>';
      dayTasks.slice(0,3).forEach(function(t){
        html += '<div class="cal-chip'+(t.status==='done'?' done':'')+'" data-task="'+esc(t.id)+'">'+esc(t.title)+'</div>';
      });
      if(dayTasks.length>3) html += '<div class="cal-chip">+'+(dayTasks.length-3)+'</div>';
      if(notes[iso] && notes[iso].length) html += '<span class="cal-note-dot"></span>';
      cell.innerHTML = html;
      cell.addEventListener('click', function(ev){
        var chip = ev.target.closest('[data-task]');
        if(chip){ ev.stopPropagation(); openTaskModal(slug, chip.getAttribute('data-task')); return; }
      });
      cell.addEventListener('click', (function(iso){ return function(ev){
        if(ev.target.closest('[data-task]')) return;
        openDayModal(slug, iso);
      };})(iso));
      grid.appendChild(cell);
    }
    box.appendChild(grid);
    return box;
  }

  function renderList(slug){
    var ui = uiFor(slug);
    var wrap = document.createElement('div');
    wrap.style.cssText='display:flex;flex-direction:column;gap:10px;';

    var filters = document.createElement('div');
    filters.className = 'filters';
    [['active','Активные'],['all','Все'],['done','Выполненные']].forEach(function(p){
      var b=document.createElement('button');
      b.textContent=p[1];
      if(ui.filter===p[0]) b.className='active';
      b.addEventListener('click', function(){ ui.filter=p[0]; renderAll(); });
      filters.appendChild(b);
    });
    wrap.appendChild(filters);

    var tasks = (tasksBySlug[slug]||[]).slice();
    var dated = tasks.filter(function(t){ return t.type!=='ongoing'; });
    var ongoing = tasks.filter(function(t){ return t.type==='ongoing'; });
    dated.sort(function(a,b){ return (a.date||a.start_date||'').localeCompare(b.date||b.start_date||''); });

    function applyFilter(list){
      if(ui.filter==='active') return list.filter(function(t){return t.status!=='done';});
      if(ui.filter==='done') return list.filter(function(t){return t.status==='done';});
      return list;
    }

    var listEl = document.createElement('div');
    listEl.style.cssText='display:flex;flex-direction:column;gap:7px;';
    var shown = applyFilter(dated);
    if(!shown.length){
      var e1=document.createElement('div'); e1.className='empty'; e1.style.marginTop='10px';
      e1.textContent='Нет задач по этому фильтру.'; listEl.appendChild(e1);
    }
    shown.forEach(function(t){ listEl.appendChild(taskRow(slug,t)); });
    wrap.appendChild(listEl);

    var ongoingShown = applyFilter(ongoing);
    if(ongoingShown.length){
      var h = document.createElement('div');
      h.style.cssText='font-size:12px;color:var(--ink-dim);font-weight:600;margin-top:6px;';
      h.textContent = 'БЕЗ СРОКА';
      wrap.appendChild(h);
      var ol = document.createElement('div');
      ol.style.cssText='display:flex;flex-direction:column;gap:7px;';
      ongoingShown.forEach(function(t){ ol.appendChild(taskRow(slug,t)); });
      wrap.appendChild(ol);
    }

    var qa = document.createElement('div');
    qa.className = 'quickadd';
    qa.innerHTML = '<input type="text" placeholder="Добавить заметку-задачу без срока…" id="qaInput"><button id="qaBtn">+</button>';
    wrap.appendChild(qa);
    function submitQa(){
      var inp = qa.querySelector('#qaInput');
      var v = inp.value.trim();
      if(!v || !dbNs || !canWrite) return;
      dbNs.collection('employees/'+slug+'/tasks').add({
        title:v, type:'ongoing', status:'open', date:'', time:'', start_date:'', end_date:'',
        from_person:'', location:'', description:'', notes:'', notes_log:[], checklist:[], attachments:[],
        created_at:new Date().toISOString(), updated_at:new Date().toISOString()
      }).then(function(){ inp.value=''; });
    }
    qa.querySelector('#qaBtn').addEventListener('click', submitQa);
    qa.querySelector('#qaInput').addEventListener('keydown', function(ev){ if(ev.key==='Enter') submitQa(); });

    return wrap;
  }

  function taskRow(slug, t){
    var row = document.createElement('button');
    row.className = 'task-row'+(t.status==='done'?' done':'');
    var dateLabel = t.type==='point' ? (t.date?fmtHuman(t.date)+(t.time?' '+t.time:''):'') :
                    t.type==='range' ? (fmtHuman(t.start_date)+'–'+fmtHuman(t.end_date)) : '';
    var overdue = isOverdue(t);
    row.innerHTML =
      '<span class="task-dot '+(t.status==='done'?'done':'open')+'"></span>' +
      '<span class="t-body"><span class="t-title">'+esc(t.title)+'</span>' +
      (t.from_person?'<span class="t-meta"> от '+esc(t.from_person)+'</span>':'') + '</span>' +
      '<span class="t-date tabular'+(overdue?' overdue':'')+'">'+esc(dateLabel)+'</span>';
    row.addEventListener('click', function(){ openTaskModal(slug, t.id); });
    return row;
  }

  // ===================================================================
  // DAY MODAL
  // ===================================================================
  function openDayModal(slug, iso){
    dayModal = {slug:slug, iso:iso, mode:null};
    renderDayModal();
    document.getElementById('dayOverlay').hidden = false;
  }
  function closeDayModal(){ document.getElementById('dayOverlay').hidden = true; dayModal=null; }
  document.getElementById('dayClose').addEventListener('click', closeDayModal);
  document.getElementById('dayOverlay').addEventListener('click', function(e){ if(e.target===this) closeDayModal(); });

  function renderDayModal(){
    if(!dayModal) return;
    var slug=dayModal.slug, iso=dayModal.iso;
    document.getElementById('dayTitle').textContent = fmtHuman(iso)+'.'+iso.slice(0,4)+' · '+empName(slug);
    var body = document.getElementById('dayBody');
    var tasks = (tasksBySlug[slug]||[]).filter(function(t){
      if(t.type==='point') return t.date===iso;
      if(t.type==='range') return t.start_date<=iso && iso<=t.end_date;
      return false;
    });
    var noteEntries = ((dayNotesBySlug[slug]||{})[iso]) || [];

    if(dayModal.mode===null){
      var html = '';
      if(tasks.length || noteEntries.length){
        html += '<div style="display:flex;flex-direction:column;gap:8px;">';
        tasks.forEach(function(t){
          html += '<div class="day-task-mini" data-task="'+esc(t.id)+'"><span class="task-dot '+(t.status==='done'?'done':'open')+'"></span>'+esc(t.title)+'</div>';
        });
        noteEntries.forEach(function(n){
          html += '<div class="log-item">'+esc(n.text)+'<time>'+fmtAtHuman(n.at)+'</time></div>';
        });
        html += '</div>';
      }
      html += '<div class="choice-grid" style="margin-top:12px;">' +
        '<button class="choice-btn" id="toNote">📝 Добавить заметку</button>' +
        '<button class="choice-btn" id="toTask">✓ Добавить задачу</button></div>';
      body.innerHTML = html;
      body.querySelectorAll('[data-task]').forEach(function(el){
        el.addEventListener('click', function(){ closeDayModal(); openTaskModal(slug, el.getAttribute('data-task')); });
      });
      var tb = body.querySelector('#toTask'), nb = body.querySelector('#toNote');
      if(tb) tb.addEventListener('click', function(){ dayModal.mode='task'; renderDayModal(); });
      if(nb) nb.addEventListener('click', function(){ dayModal.mode='note'; renderDayModal(); });
      return;
    }

    if(dayModal.mode==='note'){
      var h = '<p style="margin:0 0 4px;"><a href="#" id="backChoice" style="color:var(--ink-dim);text-decoration:none;">‹ назад</a></p>';
      h += '<div class="log-list">' + noteEntries.map(function(n){ return '<div class="log-item">'+esc(n.text)+'<time>'+fmtAtHuman(n.at)+'</time></div>'; }).join('') + '</div>';
      h += '<div class="log-add"><input type="text" id="noteInput" placeholder="Мысль на этот день…"><button id="noteAddBtn">+</button></div>';
      body.innerHTML = h;
      body.querySelector('#backChoice').addEventListener('click', function(e){ e.preventDefault(); dayModal.mode=null; renderDayModal(); });
      function submitNote(){
        var inp = body.querySelector('#noteInput');
        var v = inp.value.trim();
        if(!v || !dbNs || !canWrite) return;
        var ref = dbNs.doc('employees/'+slug+'/day_notes/'+iso);
        var entries = noteEntries.concat([{text:v, at:new Date().toISOString()}]);
        ref.set({entries:entries}).then(function(){ inp.value=''; });
      }
      body.querySelector('#noteAddBtn').addEventListener('click', submitNote);
      body.querySelector('#noteInput').addEventListener('keydown', function(ev){ if(ev.key==='Enter') submitNote(); });
      return;
    }

    if(dayModal.mode==='task'){
      var h2 = '<p style="margin:0 0 4px;"><a href="#" id="backChoice2" style="color:var(--ink-dim);text-decoration:none;">‹ назад</a></p>';
      h2 += '<div class="field"><label>Название</label><input type="text" id="qtTitle"></div>';
      h2 += '<div class="field"><label>Время (необязательно)</label><input type="text" id="qtTime" placeholder="напр. 15:00"></div>';
      h2 += '<button class="btn primary block" id="qtSave" style="margin-top:4px;">Добавить задачу на '+fmtHuman(iso)+'</button>';
      body.innerHTML = h2;
      body.querySelector('#backChoice2').addEventListener('click', function(e){ e.preventDefault(); dayModal.mode=null; renderDayModal(); });
      body.querySelector('#qtSave').addEventListener('click', function(){
        var title = body.querySelector('#qtTitle').value.trim();
        if(!title || !dbNs || !canWrite) return;
        dbNs.collection('employees/'+slug+'/tasks').add({
          title:title, type:'point', status:'open', date:iso, time:body.querySelector('#qtTime').value.trim(),
          start_date:'', end_date:'', from_person:'', location:'', description:'', notes:'', notes_log:[],
          checklist:[], attachments:[], created_at:new Date().toISOString(), updated_at:new Date().toISOString()
        }).then(closeDayModal);
      });
      return;
    }
  }

  // ===================================================================
  // TASK MODAL
  // ===================================================================
  var taskEditMode = false;
  function openTaskModal(slug, id){
    taskModal = {slug:slug, id:id};
    taskEditMode = false;
    renderTaskModal();
    document.getElementById('taskOverlay').hidden = false;
  }
  function closeTaskModal(){ document.getElementById('taskOverlay').hidden = true; taskModal = null; taskEditMode = false; }
  document.getElementById('taskClose').addEventListener('click', closeTaskModal);
  document.getElementById('taskOverlay').addEventListener('click', function(e){ if(e.target===this) closeTaskModal(); });

  function renderTaskModal(){
    if(!taskModal) return;
    var slug=taskModal.slug, id=taskModal.id;
    var t = (tasksBySlug[slug]||[]).find(function(x){return x.id===id;});
    if(!t){ closeTaskModal(); return; }
    var ref = dbNs ? dbNs.doc('employees/'+slug+'/tasks/'+id) : null;

    if(taskEditMode){
      document.getElementById('taskTitle').textContent = 'Изменить задачу';
      renderTaskEditForm(t, ref);
      return;
    }
    document.getElementById('taskTitle').textContent = t.title;

    var dateLabel = t.type==='point' ? (t.date?fmtHuman(t.date)+(t.time?', '+t.time:''):'без даты') :
                    t.type==='range' ? (fmtHuman(t.start_date)+' – '+fmtHuman(t.end_date)) : 'без срока';

    var html = '';
    if(canWrite) html += '<div style="display:flex;justify-content:flex-end;"><button class="btn sm ghost" id="editTaskBtn">✎ Изменить</button></div>';
    html += '<div class="status-line'+(t.status==='done'?' good':'')+'">'+esc(dateLabel)+(t.from_person?' · от '+esc(t.from_person):'')+'</div>';
    if(t.description) html += '<p style="margin:0;font-size:13.5px;">'+esc(t.description)+'</p>';
    if(t.location) html += '<p style="margin:0;font-size:12.5px;color:var(--ink-dim);">📍 '+esc(t.location)+'</p>';

    var curStage = stageOf(t);
    html += '<div><div style="font-size:12px;color:var(--ink-dim);font-weight:600;margin-bottom:6px;">ЭТАП</div><div class="stage-seg" id="stageSeg">' +
      TASK_STAGES.map(function(c){ return '<button class="stage-btn'+(curStage===c[0]?' active':'')+'" style="--stage-c:'+STAGE_COLOR[c[0]]+'" data-stage="'+c[0]+'">'+esc(c[1])+'</button>'; }).join('') +
      '</div></div>';

    // checklist
    html += '<div><div style="font-size:12px;color:var(--ink-dim);font-weight:600;margin-bottom:6px;">ЧЕК-ЛИСТ</div><div class="check-list">';
    (t.checklist||[]).forEach(function(ci,idx){
      html += '<label class="check-item'+(ci.done?' done':'')+'"><input type="checkbox" data-idx="'+idx+'" '+(ci.done?'checked':'')+'><span>'+esc(ci.text)+'</span></label>';
    });
    html += '</div></div>';

    // notes log
    html += '<div><div style="font-size:12px;color:var(--ink-dim);font-weight:600;margin-bottom:6px;">ЗАМЕТКИ</div>';
    html += '<div class="log-list">' + (t.notes_log||[]).map(function(n){ return '<div class="log-item">'+esc(n.text)+'<time>'+fmtAtHuman(n.at)+'</time></div>'; }).join('') + '</div>';
    html += '<div class="log-add" style="margin-top:6px;"><input type="text" id="noteLogInput" placeholder="Добавить заметку…"><button id="noteLogBtn">+</button></div></div>';

    document.getElementById('taskBody').innerHTML = html;

    var body = document.getElementById('taskBody');
    var editTaskBtn = body.querySelector('#editTaskBtn');
    if(editTaskBtn) editTaskBtn.addEventListener('click', function(){ taskEditMode = true; renderTaskModal(); });

    if(!canWrite || !ref){
      body.querySelectorAll('input,button').forEach(function(el){ el.disabled = true; });
      return;
    }

    body.querySelectorAll('#stageSeg .stage-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        var newStage = btn.getAttribute('data-stage');
        body.querySelectorAll('#stageSeg .stage-btn').forEach(function(b){ b.classList.toggle('active', b===btn); });
        moveStage(slug, t, newStage);
      });
    });
    body.querySelectorAll('.check-item input').forEach(function(cb){
      cb.addEventListener('change', function(){
        var idx = +cb.getAttribute('data-idx');
        var list = (t.checklist||[]).slice();
        list[idx] = Object.assign({}, list[idx], {done:cb.checked});
        ref.update({checklist:list, updated_at:new Date().toISOString()});
      });
    });
    function submitNoteLog(){
      var inp = body.querySelector('#noteLogInput');
      var v = inp.value.trim();
      if(!v) return;
      var list = (t.notes_log||[]).concat([{text:v, at:new Date().toISOString()}]);
      ref.update({notes_log:list, updated_at:new Date().toISOString()}).then(function(){ inp.value=''; });
    }
    body.querySelector('#noteLogBtn').addEventListener('click', submitNoteLog);
    body.querySelector('#noteLogInput').addEventListener('keydown', function(ev){ if(ev.key==='Enter') submitNoteLog(); });
  }

  function renderTaskEditForm(t, ref){
    var body = document.getElementById('taskBody');
    var html = '';
    html += '<div class="field"><label>Название</label><input type="text" id="etTitle" value="'+esc(t.title)+'"></div>';
    if(t.type==='point'){
      html += '<div class="grid2"><div class="field"><label>Дата</label><input type="text" id="etDate" value="'+esc(t.date||'')+'" placeholder="ГГГГ-ММ-ДД"></div><div class="field"><label>Время</label><input type="text" id="etTime" value="'+esc(t.time||'')+'" placeholder="напр. 15:00"></div></div>';
    } else if(t.type==='range'){
      html += '<div class="grid2"><div class="field"><label>Начало</label><input type="text" id="etStart" value="'+esc(t.start_date||'')+'" placeholder="ГГГГ-ММ-ДД"></div><div class="field"><label>Конец</label><input type="text" id="etEnd" value="'+esc(t.end_date||'')+'" placeholder="ГГГГ-ММ-ДД"></div></div>';
    }
    html += '<div class="field"><label>Место</label><input type="text" id="etLoc" value="'+esc(t.location||'')+'"></div>';
    html += '<div class="field"><label>От кого</label><input type="text" id="etFrom" value="'+esc(t.from_person||'')+'"></div>';
    html += '<div class="field"><label>Описание</label><textarea id="etDesc">'+esc(t.description||'')+'</textarea></div>';
    html += '<div class="row2"><button class="btn ghost" style="flex:1" id="etCancel">Отмена</button><button class="btn primary" style="flex:2" id="etSave">Сохранить</button></div>';
    body.innerHTML = html;
    if(!canWrite || !ref){ body.querySelectorAll('input,textarea,button').forEach(function(el){ el.disabled = true; }); return; }
    body.querySelector('#etCancel').addEventListener('click', function(){ taskEditMode = false; renderTaskModal(); });
    body.querySelector('#etSave').addEventListener('click', function(){
      var patch = {
        title: body.querySelector('#etTitle').value.trim() || t.title,
        location: body.querySelector('#etLoc').value.trim(),
        from_person: body.querySelector('#etFrom').value.trim(),
        description: body.querySelector('#etDesc').value.trim(),
        updated_at: new Date().toISOString()
      };
      if(t.type==='point'){
        patch.date = body.querySelector('#etDate').value.trim();
        patch.time = body.querySelector('#etTime').value.trim();
      } else if(t.type==='range'){
        patch.start_date = body.querySelector('#etStart').value.trim();
        patch.end_date = body.querySelector('#etEnd').value.trim();
      }
      ref.update(patch).then(function(){ taskEditMode = false; renderTaskModal(); });
    });
  }

  function contactPlural(n){
    var n10=n%10, n100=n%100;
    if(n10===1 && n100!==11) return '';
    if(n10>=2 && n10<=4 && (n100<10||n100>=20)) return 'а';
    return 'ов';
  }

  // ===================================================================
  // CONTACTS TIMELINE (Хронология) — who/where/when a card was added,
  //   grouped by day, with the "Мероприятие" tag highlighted per contact.
  // ===================================================================
  var DOW_FULL = ['понедельник','вторник','среда','четверг','пятница','суббота','воскресенье'];
  // Interactive, zoomable/pannable timeline (vis-timeline): scroll to zoom,
  // drag to pan, click a card to open it — same gestures as a map, applied
  // to time instead of geography (contacts carry no geo-coordinates, so a
  // literal world map has nothing to place pins on; this is the map-like
  // interaction the request asked for, mapped onto "when a card came in").
  function renderContactsTimeline(){
    var wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;flex-direction:column;gap:10px;';
    if(!contacts.length){
      var e = document.createElement('div'); e.className = 'empty';
      e.textContent = 'Пока пусто. Хронология заполнится по мере добавления визиток.';
      wrap.appendChild(e);
      return wrap;
    }
    var intro = document.createElement('p');
    intro.style.cssText = 'margin:0;color:var(--ink-dim);font-size:12.5px;';
    intro.textContent = 'Кто, когда и с какого мероприятия появился в визитнице. Колесом мыши/щипком — приблизить, перетаскиванием — сдвинуть, нажмите на карточку — чтобы открыть.';
    wrap.appendChild(intro);

    if(!(window.vis && window.vis.Timeline)){
      // CDN didn't load (offline etc.) — fall back to the flat grouped list.
      wrap.appendChild(renderContactsTimelineFallback());
      return wrap;
    }

    var vizWrap = document.createElement('div');
    vizWrap.className = 'tl-viz-wrap';
    var viz = document.createElement('div');
    viz.className = 'tl-viz';
    vizWrap.appendChild(viz);
    wrap.appendChild(vizWrap);
    var hint = document.createElement('p');
    hint.className = 'tl-hint';
    hint.textContent = 'Прокрутка — масштаб · перетаскивание — сдвиг · нажатие — открыть контакт';
    wrap.appendChild(hint);

    var items = contacts.filter(function(c){ return !!c.created_at; }).map(function(c){
      var cStage = contactStageOf(c);
      return {
        id: c.id,
        start: new Date(c.created_at),
        content: esc(c.name || 'Без имени') + (c.company ? ' <span style="opacity:.75;font-weight:500;">· '+esc(c.company)+'</span>' : ''),
        style: 'background:'+CONTACT_STAGE_COLOR[cStage]+';border-color:'+CONTACT_STAGE_COLOR[cStage]+';'
      };
    });
    var noDate = contacts.filter(function(c){ return !c.created_at; });

    var ds = new vis.DataSet(items);
    var opts = {
      stack: true, zoomMin: 1000*60*60*24, zoomMax: 1000*60*60*24*365*6,
      horizontalScroll: true, zoomKey: 'ctrlKey', selectable: true,
      margin: {item: 10, axis: 8},
      locale: 'ru', tooltip: {followMouse:true}
    };
    try{ vis.Timeline.prototype && (opts.locales = {ru:{current:'текущее',time:'время'}}); }catch(_e){}
    // Build the Timeline only after `viz` is attached to the live document —
    // this function returns a detached DOM subtree that the caller appends
    // right after, and vis-timeline measures pixel width at construction
    // time, so building it synchronously here (while still detached, width
    // 0) makes fit()/zoom land on a bogus range. A macrotask delay is enough
    // since the append happens synchronously in the same tick.
    setTimeout(function(){
      if(!document.body.contains(viz)) return; // tab was switched away before mount
      var timeline = new vis.Timeline(viz, ds, opts);
      timeline.on('select', function(sel){
        if(sel.items && sel.items[0]) openContactDetail(sel.items[0]);
      });
      if(items.length) timeline.fit();
    }, 0);

    if(noDate.length){
      var ndWrap = document.createElement('div');
      ndWrap.style.cssText = 'display:flex;flex-direction:column;gap:6px;margin-top:4px;';
      var ndHead = document.createElement('div');
      ndHead.className = 'tl-date-head';
      ndHead.innerHTML = '<b>Без даты</b>';
      ndWrap.appendChild(ndHead);
      var ndGroup = document.createElement('div'); ndGroup.className = 'tl-group';
      noDate.forEach(function(c){
        var btn = document.createElement('button');
        btn.className = 'contact-card';
        btn.innerHTML = '<div class="avatar">'+(c.photo_id?'<img src="'+esc(c.photo_id)+'" alt="">':esc(initials(c.name)))+'</div>' +
          '<div class="cc-body"><div class="cc-name">'+esc(c.name||'Без имени')+'</div></div>';
        btn.addEventListener('click', function(){ openContactDetail(c.id); });
        ndGroup.appendChild(btn);
      });
      ndWrap.appendChild(ndGroup);
      wrap.appendChild(ndWrap);
    }
    return wrap;
  }
  function renderContactsTimelineFallback(){
    var wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;flex-direction:column;gap:14px;';
    var groups = {};
    contacts.forEach(function(c){
      var key = c.created_at ? c.created_at.slice(0,10) : '—';
      (groups[key] = groups[key] || []).push(c);
    });
    var keys = Object.keys(groups).sort(function(a,b){
      if(a==='—') return 1;
      if(b==='—') return -1;
      return b.localeCompare(a);
    });
    keys.forEach(function(key){
      var head = document.createElement('div');
      head.className = 'tl-date-head';
      if(key==='—'){
        head.innerHTML = '<b>Без даты</b>';
      } else {
        var d = parseISO(key);
        head.innerHTML = '<b>'+d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear()+'</b><span>'+esc(DOW_FULL[(d.getDay()+6)%7])+'</span>';
      }
      wrap.appendChild(head);

      var group = document.createElement('div');
      group.className = 'tl-group';
      var list = groups[key].slice().sort(function(a,b){ return (b.created_at||'').localeCompare(a.created_at||''); });
      list.forEach(function(c){
        var btn = document.createElement('button');
        btn.className = 'contact-card';
        var cStage = contactStageOf(c);
        var timeLabel = c.created_at ? fmtAtHuman(c.created_at).split(', ')[1] : '';
        btn.innerHTML =
          '<div class="avatar">'+(c.photo_id?'<img src="'+esc(c.photo_id)+'" alt="">':esc(initials(c.name)))+'</div>' +
          '<div class="cc-body"><div class="cc-name">'+esc(c.name||'Без имени')+'</div><div class="cc-meta">'+esc([c.position,c.company].filter(Boolean).join(' · '))+'</div>' +
          (c.event ? '<div class="cc-event">📌 '+esc(c.event)+'</div>' : '') +
          '</div>' +
          '<span class="cc-stage-dot" style="--stage-c:'+CONTACT_STAGE_COLOR[cStage]+'" title="'+esc(CONTACT_STAGE_LABEL[cStage])+'"></span>' +
          (timeLabel ? '<div class="cc-phone tabular">'+esc(timeLabel)+'</div>' : '');
        btn.addEventListener('click', function(){ openContactDetail(c.id); });
        group.appendChild(btn);
      });
      wrap.appendChild(group);
    });
    return wrap;
  }

  // ===================================================================
  // VOICE ASSISTANT (dictation-driven chat with tool calls)
  //   True in-page microphone capture is not available here — the artifact
  //   sandbox blocks getUserMedia and there is no microphone capability to
  //   grant it. Instead the input is built for the DEVICE's own dictation
  //   (phone keyboard mic icon, Win+H, Fn Fn on Mac), which types text into
  //   the field without any page permission, then an assistant (via the
  //   `sample` capability's tool-calling) acts on it.
  // ===================================================================
  function getWhoAmIId(){ try{ return localStorage.getItem('akk_whoami_id') || null; }catch(e){ return null; } }
  function setWhoAmIId(id){ try{ localStorage.setItem('akk_whoami_id', id); }catch(e){} }
  function whoAmIEmployee(){
    var id = getWhoAmIId();
    if(!id) return null;
    return employees.find(function(e){ return e.id===id; }) || null;
  }

  var whoOverlay = document.getElementById('whoOverlay');
  document.getElementById('whoClose').addEventListener('click', function(){ whoOverlay.hidden = true; });

    var list = document.getElementById('whoList');

      var empty = document.createElement('div'); empty.className='empty'; empty.style.marginTop='6px';
      empty.textContent = 'Пока пусто. Продиктуйте или напишите первую команду.'; log.appendChild(empty);
    }
    chatHistory.forEach(function(m){ log.appendChild(chatBubble(m)); });
    if(chatBusy){

      thinking.style.cssText = 'align-self:flex-start;display:flex;align-items:center;gap:6px;color:var(--ink-dim);font-size:13px;';
      thinking.innerHTML = '<span class="spinner"></span> Думаю…';
      log.appendChild(thinking);

    box.appendChild(inputRow);

    var inputEl = inputRow.querySelector('#chatInput');

    inputEl.addEventListener('keydown', function(ev){ if(ev.key==='Enter') submitChat(); });

  function chatBubble(m){
    var isUser = m.role==='user';
    var row = document.createElement('div');
    row.style.cssText = 'display:flex;flex-direction:column;gap:4px;max-width:88%;align-self:'+(isUser?'flex-end':'flex-start')+';';
    var bubble = document.createElement('div');
    bubble.style.cssText = 'background:'+(isUser?'var(--accent)':'var(--surface-2)')+';color:'+(isUser?'var(--accent-ink)':'var(--ink)')+';border-radius:12px;padding:9px 12px;font-size:13.5px;white-space:pre-wrap;word-break:break-word;';
    bubble.textContent = m.text;
    row.appendChild(bubble);
    (m.actions||[]).forEach(function(a){
      if(a.type==='mailto'){
        var link = document.createElement('a');
        link.href = a.href;
        link.textContent = '✉ Открыть письмо для '+a.name;
        link.className = 'btn sm';
        link.style.cssText = 'text-decoration:none;display:inline-flex;width:fit-content;';
        row.appendChild(link);
        var note = document.createElement('div');
        note.className = 'mailto-note';
        note.textContent = 'Откроет вашу почтовую программу с готовым письмом — отправить нужно будет самому, работает не в каждом браузере.';
        row.appendChild(note);
      } else if(a.type==='task'){
        var chip = document.createElement('div');
        chip.className = 'status-line good';
        chip.style.fontSize = '12px';
        chip.textContent = '✓ Задача «'+a.title+'» добавлена'+(a.employee?' ('+a.employee+')':'')+(a.date?' на '+fmtHuman(a.date):' без срока');
        row.appendChild(chip);
      } else if(a.type==='event'){
        var chip2 = document.createElement('div');
        chip2.className = 'status-line good';
        chip2.style.fontSize = '12px';
        chip2.textContent = '📌 «'+a.contact+'» отмечен мероприятием «'+a.event+'»';
        row.appendChild(chip2);
      }
    });
    return row;
  }

  function submitChat(){
    var inputEl = document.getElementById('chatInput');
    if(!inputEl) return;
    var text = inputEl.value.trim();
    if(!text || chatBusy) return;
    if(!sampleNs){
      chatHistory.push({role:'user', text:text});
      chatHistory.push({role:'assistant', text:'Голосовой помощник недоступен в этом окне.'});
      renderAll();
      return;
    }
    chatHistory.push({role:'user', text:text});
    chatBusy = true;
    renderAll();
    runAssistant(text).then(function(reply){
      chatHistory.push(reply);
    }).catch(function(e){
      chatHistory.push({role:'assistant', text: assistantErrorCopy(e)});
    }).then(function(){
      chatBusy = false;
      renderAll();
    });
  }

  function assistantErrorCopy(e){
    var code = e && e.code;
    if(code==='not_granted') return 'Доступ к помощнику не разрешён для этого окна.';
    if(code==='rate_limited') return 'Сейчас перегружено — попробуйте через минуту.';
    if(code==='tools_unavailable' || code==='images_unavailable') return 'В этом окне помощник не может выполнять действия.';
    if(code==='session_expired') return 'Нужно войти заново, чтобы пользоваться помощником.';
    return 'Не получилось обработать команду. Попробуйте переформулировать.';
  }

  function runAssistant(text){
    var me = whoAmIEmployee();
    var pendingActions = [];
    var empList = employees.map(function(e){ return e.name; }).join('; ');

    var tools = [
      {
        name: 'create_task',
        description: 'Создаёт задачу в календаре указанного сотрудника АКК. Возвращает подтверждение с именем сотрудника, названием и датой.',
        inputSchema: {
          type:'object',
          properties:{
            employee_name:{type:'string', description:'Имя сотрудника как упомянуто, или "me" если это сам собеседник'},
            title:{type:'string', description:'Короткое название задачи'},
            date:{type:'string', description:'Дата в формате YYYY-MM-DD, или пустая строка если без срока'},
            time:{type:'string', description:'Время, например 15:00, или пустая строка'},
            location:{type:'string'},
            description:{type:'string'}
          },
          required:['employee_name','title']
        },
        execute: function(input){
          var empName = String(input.employee_name||'').trim().toLowerCase();
          var target = null;
          if(!empName || empName==='me' || empName==='я' || empName==='мне' || empName==='мной'){
            target = me;
          } else {
            target = employees.find(function(e){
              var n = e.name.toLowerCase();
              return n.indexOf(empName)!==-1 || empName.indexOf(n)!==-1;
            });
          }
          if(!target) throw new Error('Сотрудник не найден. Доступные: '+(empList||'нет сотрудников')+'.');
          if(!dbNs || !canWrite) throw new Error('Нет прав на запись в этом окне.');
          var title = String(input.title||'').trim();
          if(!title) throw new Error('Не указано название задачи.');
          var date = String(input.date||'').trim();
          var doc = {
            title:title, type: date?'point':'ongoing', status:'open',
            date:date, time:String(input.time||'').trim(), start_date:'', end_date:'',
            from_person:'', location:String(input.location||'').trim(),

  function renderEventChips(){
    var counts = {};
    contacts.forEach(function(c){
      var v = (c.event||'').trim();
      if(!v) return;
      var key = v.toLowerCase();
      if(!counts[key]) counts[key] = {label:v, n:0, last:c.created_at||''};
      counts[key].n++;
      if((c.created_at||'') > counts[key].last) counts[key].last = c.created_at||'';
    });
    var list = Object.keys(counts).map(function(k){ return counts[k]; });
    list.sort(function(a,b){ return b.n-a.n || (b.last||'').localeCompare(a.last||''); });
    list = list.slice(0,6);
    fEventChips.innerHTML = '';
    list.forEach(function(item){
      var chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'event-chip';
      chip.textContent = item.label;
      chip.addEventListener('click', function(){ document.getElementById('fEvent').value = item.label; });
      fEventChips.appendChild(chip);
    });
  }
