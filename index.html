  function openDayModal(slug, iso){
    dayModal = {slug:slug, iso:iso, mode:null};
    renderDayModal();
    document.getElementById('dayOverlay').hidden = false;
  }
  function closeDayModal(){ document.getElementById('dayOverlay').hidden = true; dayModal=null; }
  document.getElementById('dayClose').addEventListener('click', closeDayModal);
  document.getElementById('dayOverlay').addEventListener('click', function(e){ if(e.target===this) closeDayModal(); });

  function renderDayModal(){
    if(!dayModal) return;
    var slug=dayModal.slug, iso=dayModal.iso;
    document.getElementById('dayTitle').textContent = fmtHuman(iso)+'.'+iso.slice(0,4)+' · '+empName(slug);
    var body = document.getElementById('dayBody');
    var tasks = (tasksBySlug[slug]||[]).filter(function(t){
      if(t.type==='point') return t.date===iso;
      if(t.type==='range') return t.start_date<=iso && iso<=t.end_date;
      return false;
    });
    var noteEntries = ((dayNotesBySlug[slug]||{})[iso]) || [];

    if(dayModal.mode===null){
      var html = '';
      if(tasks.length || noteEntries.length){
        html += '<div style="display:flex;flex-direction:column;gap:8px;">';
        tasks.forEach(function(t){
          html += '<div class="day-task-mini" data-task="'+esc(t.id)+'"><span class="task-dot '+(t.status==='done'?'done':'open')+'"></span>'+esc(t.title)+'</div>';
        });
        noteEntries.forEach(function(n){
          html += '<div class="log-item">'+esc(n.text)+'<time>'+fmtAtHuman(n.at)+'</time></div>';
        });
        html += '</div>';
      }
      html += '<div class="choice-grid" style="margin-top:12px;">' +
        '<button class="choice-btn" id="toNote">📝 Добавить заметку</button>' +
        '<button class="choice-btn" id="toTask">✓ Добавить задачу</button></div>';
      body.innerHTML = html;
      body.querySelectorAll('[data-task]').forEach(function(el){
        el.addEventListener('click', function(){ closeDayModal(); openTaskModal(slug, el.getAttribute('data-task')); });
      });
      var tb = body.querySelector('#toTask'), nb = body.querySelector('#toNote');
      if(tb) tb.addEventListener('click', function(){ dayModal.mode='task'; renderDayModal(); });
      if(nb) nb.addEventListener('click', function(){ dayModal.mode='note'; renderDayModal(); });
      return;
    }

    if(dayModal.mode==='note'){
      var h = '<p style="margin:0 0 4px;"><a href="#" id="backChoice" style="color:var(--ink-dim);text-decoration:none;">‹ назад</a></p>';
      h += '<div class="log-list">' + noteEntries.map(function(n){ return '<div class="log-item">'+esc(n.text)+'<time>'+fmtAtHuman(n.at)+'</time></div>'; }).join('') + '</div>';
      h += '<div class="log-add"><input type="text" id="noteInput" placeholder="Мысль на этот день…"><button id="noteAddBtn">+</button></div>';
      body.innerHTML = h;
      body.querySelector('#backChoice').addEventListener('click', function(e){ e.preventDefault(); dayModal.mode=null; renderDayModal(); });
      function submitNote(){
        var inp = body.querySelector('#noteInput');
        var v = inp.value.trim();
        if(!v || !dbNs || !canWrite) return;
        var ref = dbNs.doc('employees/'+slug+'/day_notes/'+iso);
        var entries = noteEntries.concat([{text:v, at:new Date().toISOString()}]);
        ref.set({entries:entries}).then(function(){ inp.value=''; });
      }
      body.querySelector('#noteAddBtn').addEventListener('click', submitNote);
      body.querySelector('#noteInput').addEventListener('keydown', function(ev){ if(ev.key==='Enter') submitNote(); });
      return;
    }

    if(dayModal.mode==='task'){
      var h2 = '<p style="margin:0 0 4px;"><a href="#" id="backChoice2" style="color:var(--ink-dim);text-decoration:none;">‹ назад</a></p>';
      h2 += '<div class="field"><label>Название</label><input type="text" id="qtTitle"></div>';
      h2 += '<div class="field"><label>Время (необязательно)</label><input type="text" id="qtTime" placeholder="напр. 15:00"></div>';
      h2 += '<button class="btn primary block" id="qtSave" style="margin-top:4px;">Добавить задачу на '+fmtHuman(iso)+'</button>';
      body.innerHTML = h2;
      body.querySelector('#backChoice2').addEventListener('click', function(e){ e.preventDefault(); dayModal.mode=null; renderDayModal(); });
      body.querySelector('#qtSave').addEventListener('click', function(){
        var title = body.querySelector('#qtTitle').value.trim();
        if(!title || !dbNs || !canWrite) return;
        dbNs.collection('employees/'+slug+'/tasks').add({
          title:title, type:'point', status:'open', date:iso, time:body.querySelector('#qtTime').value.trim(),
          start_date:'', end_date:'', from_person:'', location:'', description:'', notes:'', notes_log:[],
          checklist:[], attachments:[], created_at:new Date().toISOString(), updated_at:new Date().toISOString()
        }).then(closeDayModal);
      });
      return;
    }
  }

  // ===================================================================
  // TASK MODAL
  // ===================================================================
  var taskEditMode = false;
  function openTaskModal(slug, id){
    taskModal = {slug:slug, id:id};
    taskEditMode = false;
    renderTaskModal();
    document.getElementById('taskOverlay').hidden = false;
  }
  function closeTaskModal(){ document.getElementById('taskOverlay').hidden = true; taskModal = null; taskEditMode = false; }
  document.getElementById('taskClose').addEventListener('click', closeTaskModal);
  document.getElementById('taskOverlay').addEventListener('click', function(e){ if(e.target===this) closeTaskModal(); });

  function renderTaskModal(){
    if(!taskModal) return;
    var slug=taskModal.slug, id=taskModal.id;
    var t = (tasksBySlug[slug]||[]).find(function(x){return x.id===id;});
    if(!t){ closeTaskModal(); return; }
    var ref = dbNs ? dbNs.doc('employees/'+slug+'/tasks/'+id) : null;

    if(taskEditMode){
      document.getElementById('taskTitle').textContent = 'Изменить задачу';
      renderTaskEditForm(t, ref);
      return;
    }
    document.getElementById('taskTitle').textContent = t.title;

    var dateLabel = t.type==='point' ? (t.date?fmtHuman(t.date)+(t.time?', '+t.time:''):'без даты') :
                    t.type==='range' ? (fmtHuman(t.start_date)+' – '+fmtHuman(t.end_date)) : 'без срока';

    var html = '';
    if(canWrite) html += '<div style="display:flex;justify-content:flex-end;"><button class="btn sm ghost" id="editTaskBtn">✎ Изменить</button></div>';
    html += '<div class="status-line'+(t.status==='done'?' good':'')+'">'+esc(dateLabel)+(t.from_person?' · от '+esc(t.from_person):'')+'</div>';
    if(t.description) html += '<p style="margin:0;font-size:13.5px;">'+esc(t.description)+'</p>';
    if(t.location) html += '<p style="margin:0;font-size:12.5px;color:var(--ink-dim);">📍 '+esc(t.location)+'</p>';

    var curStage = stageOf(t);
    html += '<div><div style="font-size:12px;color:var(--ink-dim);font-weight:600;margin-bottom:6px;">ЭТАП</div><div class="stage-seg" id="stageSeg">' +
      TASK_STAGES.map(function(c){ return '<button class="stage-btn'+(curStage===c[0]?' active':'')+'" style="--stage-c:'+STAGE_COLOR[c[0]]+'" data-stage="'+c[0]+'">'+esc(c[1])+'</button>'; }).join('') +
      '</div></div>';

    // checklist
    html += '<div><div style="font-size:12px;color:var(--ink-dim);font-weight:600;margin-bottom:6px;">ЧЕК-ЛИСТ</div><div class="check-list">';
    (t.checklist||[]).forEach(function(ci,idx){
      html += '<label class="check-item'+(ci.done?' done':'')+'"><input type="checkbox" data-idx="'+idx+'" '+(ci.done?'checked':'')+'><span>'+esc(ci.text)+'</span></label>';
    });
    html += '</div></div>';

    // notes log
    html += '<div><div style="font-size:12px;color:var(--ink-dim);font-weight:600;margin-bottom:6px;">ЗАМЕТКИ</div>';
    html += '<div class="log-list">' + (t.notes_log||[]).map(function(n){ return '<div class="log-item">'+esc(n.text)+'<time>'+fmtAtHuman(n.at)+'</time></div>'; }).join('') + '</div>';
    html += '<div class="log-add" style="margin-top:6px;"><input type="text" id="noteLogInput" placeholder="Добавить заметку…"><button id="noteLogBtn">+</button></div></div>';

    document.getElementById('taskBody').innerHTML = html;

    var body = document.getElementById('taskBody');
    var editTaskBtn = body.querySelector('#editTaskBtn');
    if(editTaskBtn) editTaskBtn.addEventListener('click', function(){ taskEditMode = true; renderTaskModal(); });

    if(!canWrite || !ref){
      body.querySelectorAll('input,button').forEach(function(el){ el.disabled = true; });
      return;
    }

    body.querySelectorAll('#stageSeg .stage-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        var newStage = btn.getAttribute('data-stage');
        body.querySelectorAll('#stageSeg .stage-btn').forEach(function(b){ b.classList.toggle('active', b===btn); });
        moveStage(slug, t, newStage);
      });
    });
    body.querySelectorAll('.check-item input').forEach(function(cb){
      cb.addEventListener('change', function(){
        var idx = +cb.getAttribute('data-idx');
        var list = (t.checklist||[]).slice();
        list[idx] = Object.assign({}, list[idx], {done:cb.checked});
        ref.update({checklist:list, updated_at:new Date().toISOString()});
      });
    });
    function submitNoteLog(){
      var inp = body.querySelector('#noteLogInput');
      var v = inp.value.trim();
      if(!v) return;
      var list = (t.notes_log||[]).concat([{text:v, at:new Date().toISOString()}]);
      ref.update({notes_log:list, updated_at:new Date().toISOString()}).then(function(){ inp.value=''; });
    }
    body.querySelector('#noteLogBtn').addEventListener('click', submitNoteLog);
    body.querySelector('#noteLogInput').addEventListener('keydown', function(ev){ if(ev.key==='Enter') submitNoteLog(); });
  }

  function renderTaskEditForm(t, ref){
    var body = document.getElementById('taskBody');
    var html = '';
    html += '<div class="field"><label>Название</label><input type="text" id="etTitle" value="'+esc(t.title)+'"></div>';
    if(t.type==='point'){
      html += '<div class="grid2"><div class="field"><label>Дата</label><input type="text" id="etDate" value="'+esc(t.date||'')+'" placeholder="ГГГГ-ММ-ДД"></div><div class="field"><label>Время</label><input type="text" id="etTime" value="'+esc(t.time||'')+'" placeholder="напр. 15:00"></div></div>';
    } else if(t.type==='range'){
      html += '<div class="grid2"><div class="field"><label>Начало</label><input type="text" id="etStart" value="'+esc(t.start_date||'')+'" placeholder="ГГГГ-ММ-ДД"></div><div class="field"><label>Конец</label><input type="text" id="etEnd" value="'+esc(t.end_date||'')+'" placeholder="ГГГГ-ММ-ДД"></div></div>';
    }
    html += '<div class="field"><label>Место</label><input type="text" id="etLoc" value="'+esc(t.location||'')+'"></div>';
    html += '<div class="field"><label>От кого</label><input type="text" id="etFrom" value="'+esc(t.from_person||'')+'"></div>';
    html += '<div class="field"><label>Описание</label><textarea id="etDesc">'+esc(t.description||'')+'</textarea></div>';
    html += '<div class="row2"><button class="btn ghost" style="flex:1" id="etCancel">Отмена</button><button class="btn primary" style="flex:2" id="etSave">Сохранить</button></div>';
    body.innerHTML = html;
    if(!canWrite || !ref){ body.querySelectorAll('input,textarea,button').forEach(function(el){ el.disabled = true; }); return; }
    body.querySelector('#etCancel').addEventListener('click', function(){ taskEditMode = false; renderTaskModal(); });
    body.querySelector('#etSave').addEventListener('click', function(){
      var patch = {
        title: body.querySelector('#etTitle').value.trim() || t.title,
        location: body.querySelector('#etLoc').value.trim(),
        from_person: body.querySelector('#etFrom').value.trim(),
        description: body.querySelector('#etDesc').value.trim(),
        updated_at: new Date().toISOString()
      };
      if(t.type==='point'){
        patch.date = body.querySelector('#etDate').value.trim();
        patch.time = body.querySelector('#etTime').value.trim();
      } else if(t.type==='range'){
        patch.start_date = body.querySelector('#etStart').value.trim();
        patch.end_date = body.querySelector('#etEnd').value.trim();
      }
      ref.update(patch).then(function(){ taskEditMode = false; renderTaskModal(); });
    });
  }

  function renderContactsTab(){
    var wrap = document.createElement('div');
    wrap.className = 'panel';
    wrap.style.paddingBottom = '70px';

    var subnav = document.createElement('div');
    subnav.className = 'subnav';
    [['list','Контакты'],['timeline','Хронология'],['assistant','Голосовой помощник']].forEach(function(p){
      var b = document.createElement('button');
      b.textContent = p[1];
      if(contactsView===p[0]) b.className = 'active';
      b.addEventListener('click', function(){ contactsView = p[0]; renderAll(); });
      subnav.appendChild(b);
    });
    wrap.appendChild(subnav);

    if(contactsView === 'assistant'){ wrap.appendChild(renderAssistantPanel()); return wrap; }
    if(contactsView === 'timeline'){ wrap.appendChild(renderContactsTimeline()); return wrap; }

    var search = document.createElement('div');
    search.className = 'search';
    search.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input id="contactSearch" type="text" placeholder="Имя, компания или должность">';
    wrap.appendChild(search);

    var countLine = document.createElement('p');
    countLine.style.cssText = 'margin:0;color:var(--ink-dim);font-size:12.5px;';
    wrap.appendChild(countLine);

    var listEl = document.createElement('div');
    listEl.style.cssText = 'display:flex;flex-direction:column;gap:10px;';
    wrap.appendChild(listEl);

    function draw(){
      var q = search.querySelector('input').value.trim().toLowerCase();
      var filtered = contacts.filter(function(c){
        if(!q) return true;
        return [c.name,c.company,c.position,c.phone].some(function(v){ return v && String(v).toLowerCase().indexOf(q)!==-1; });
      });
      filtered.sort(function(a,b){ return (a.name||'').localeCompare(b.name||'', 'ru'); });
      countLine.textContent = contacts.length===0 ? 'Пока пусто' : contacts.length+' контакт'+contactPlural(contacts.length)+(q?' · показано '+filtered.length:'');

      listEl.innerHTML = '';
      if(!filtered.length){
        var msg = contacts.length===0 ? 'Контактов пока нет. Сфотографируйте первую визитку кнопкой внизу справа.' : 'Ничего не найдено.';
        var e = document.createElement('div'); e.className='empty'; e.textContent = msg; listEl.appendChild(e); return;
      }
      filtered.forEach(function(c){
        var btn = document.createElement('button');
        btn.className = 'contact-card';
        var cStage = contactStageOf(c);
        btn.innerHTML =
          '<div class="avatar">'+(c.photo_id?'<img src="'+esc(c.photo_id)+'" alt="">':esc(initials(c.name)))+'</div>' +
          '<div class="cc-body"><div class="cc-name">'+esc(c.name||'Без имени')+'</div><div class="cc-meta">'+esc([c.position,c.company].filter(Boolean).join(' · '))+'</div>' +
          (c.event ? '<div class="cc-event">📌 '+esc(c.event)+'</div>' : '') +
          '</div>' +
          '<span class="cc-stage-dot" style="--stage-c:'+CONTACT_STAGE_COLOR[cStage]+'" title="'+esc(CONTACT_STAGE_LABEL[cStage])+'"></span>' +
          '<div class="cc-phone tabular">'+esc(c.phone||'')+'</div>';
        btn.addEventListener('click', function(){ openContactDetail(c.id); });
        listEl.appendChild(btn);
      });
    }
    search.querySelector('input').addEventListener('input', draw);
    draw();

    var fab = document.createElement('button');
    fab.className = 'fab'; fab.setAttribute('aria-label','Добавить контакт');
    fab.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>';
    fab.hidden = !canWrite;
    fab.addEventListener('click', openAddContact);
    wrap.appendChild(fab);

    return wrap;
  }
  function contactPlural(n){
    var n10=n%10, n100=n%100;
    if(n10===1 && n100!==11) return '';
    if(n10>=2 && n10<=4 && (n100<10||n100>=20)) return 'а';
    return 'ов';
  }

  // ===================================================================
  // CONTACTS TIMELINE (Хронология) — who/where/when a card was added,
  //   grouped by day, with the "Мероприятие" tag highlighted per contact.
  // ===================================================================
  var DOW_FULL = ['понедельник','вторник','среда','четверг','пятница','суббота','воскресенье'];
  function renderContactsTimeline(){
    var wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;flex-direction:column;gap:14px;';
    if(!contacts.length){
      var e = document.createElement('div'); e.className = 'empty';
      e.textContent = 'Пока пусто. Хронология заполнится по мере добавления визиток.';
      wrap.appendChild(e);
      return wrap;
    }
    var intro = document.createElement('p');
    intro.style.cssText = 'margin:0;color:var(--ink-dim);font-size:12.5px;';
    intro.textContent = 'Кто, когда и с какого мероприятия появился в визитнице — по дням добавления.';
    wrap.appendChild(intro);

    var groups = {};
    contacts.forEach(function(c){
      var key = c.created_at ? c.created_at.slice(0,10) : '—';
      (groups[key] = groups[key] || []).push(c);
    });
    var keys = Object.keys(groups).sort(function(a,b){
      if(a==='—') return 1;
      if(b==='—') return -1;
      return b.localeCompare(a);
    });
    keys.forEach(function(key){
      var head = document.createElement('div');
      head.className = 'tl-date-head';
      if(key==='—'){
        head.innerHTML = '<b>Без даты</b>';
      } else {
        var d = parseISO(key);
        head.innerHTML = '<b>'+d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear()+'</b><span>'+esc(DOW_FULL[(d.getDay()+6)%7])+'</span>';
      }
      wrap.appendChild(head);

      var group = document.createElement('div');
      group.className = 'tl-group';
      var list = groups[key].slice().sort(function(a,b){ return (b.created_at||'').localeCompare(a.created_at||''); });
      list.forEach(function(c){
        var btn = document.createElement('button');
        btn.className = 'contact-card';
        var cStage = contactStageOf(c);
        var timeLabel = c.created_at ? fmtAtHuman(c.created_at).split(', ')[1] : '';
        btn.innerHTML =
          '<div class="avatar">'+(c.photo_id?'<img src="'+esc(c.photo_id)+'" alt="">':esc(initials(c.name)))+'</div>' +
          '<div class="cc-body"><div class="cc-name">'+esc(c.name||'Без имени')+'</div><div class="cc-meta">'+esc([c.position,c.company].filter(Boolean).join(' · '))+'</div>' +
          (c.event ? '<div class="cc-event">📌 '+esc(c.event)+'</div>' : '') +
          '</div>' +
          '<span class="cc-stage-dot" style="--stage-c:'+CONTACT_STAGE_COLOR[cStage]+'" title="'+esc(CONTACT_STAGE_LABEL[cStage])+'"></span>' +
          (timeLabel ? '<div class="cc-phone tabular">'+esc(timeLabel)+'</div>' : '');
        btn.addEventListener('click', function(){ openContactDetail(c.id); });
        group.appendChild(btn);
      });
      wrap.appendChild(group);
    });
    return wrap;
  }

  //   sandbox blocks getUserMedia and there is no microphone capability to

  //   (phone keyboard mic icon, Win+H, Fn Fn on Mac), which types text into

  //   `sample` capability's tool-calling) acts on it.
  // ===================================================================
  function getWhoAmIId(){ try{ return localStorage.getItem('akk_whoami_id') || null; }catch(e){ return null; } }
  function setWhoAmIId(id){ try{ localStorage.setItem('akk_whoami_id', id); }catch(e){} }
  function whoAmIEmployee(){
    var id = getWhoAmIId();
    if(!id) return null;
    return employees.find(function(e){ return e.id===id; }) || null;
  }

  var whoOverlay = document.getElementById('whoOverlay');
  document.getElementById('whoClose').addEventListener('click', function(){ whoOverlay.hidden = true; });
  whoOverlay.addEventListener('click', function(e){ if(e.target===whoOverlay) whoOverlay.hidden = true; });
  function openWhoAmIPicker(){
    var list = document.getElementById('whoList');
    list.innerHTML = '';
    if(!employees.length){
      var e = document.createElement('div'); e.className='empty'; e.textContent='Сначала добавьте сотрудников.'; list.appendChild(e);
    }
    employees.slice().sort(function(a,b){return (a.order||0)-(b.order||0);}).forEach(function(emp){
      var b = document.createElement('button');
      b.className = 'choice-btn';
      b.textContent = emp.name + (emp.position?' — '+emp.position:'');
      b.addEventListener('click', function(){ setWhoAmIId(emp.id); whoOverlay.hidden = true; renderAll(); });
      list.appendChild(b);
    });

  }

  function renderAssistantPanel(){
    var box = document.createElement('div');
    box.style.cssText = 'display:flex;flex-direction:column;gap:10px;';

    var me = whoAmIEmployee();
    var whoLine = document.createElement('div');
    whoLine.style.cssText = 'display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--ink-dim);';
    whoLine.innerHTML = '<span>'+(me ? 'Вы: <b style="color:var(--ink)">'+esc(me.name)+'</b>' : 'Профиль не выбран')+'</span>' +
      '<button class="btn sm ghost" id="whoAmIBtn">'+(me?'Сменить':'Выбрать себя')+'</button>';
    box.appendChild(whoLine);
    whoLine.querySelector('#whoAmIBtn').addEventListener('click', openWhoAmIPicker);

    var hint = document.createElement('p');
    hint.style.cssText = 'margin:0;font-size:12px;color:var(--ink-dim);';
    hint.textContent = 'Голос — через диктовку устройства (значок микрофона на клавиатуре телефона, Win+H на Windows, дважды Fn на Mac): надиктуйте в поле ниже, при необходимости поправьте текст и отправьте. Например: «поставь Джульетте задачу на пятницу — отвезти документы», «найди контакт Иван», «отметь, что Светлана Ким — с форума Digital Bridge 2026», «напиши письмо Ивану, что встреча переносится на завтра».';
    box.appendChild(hint);

    var log = document.createElement('div');
    log.id = 'chatLog';
    log.style.cssText = 'display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow-y:auto;';
    if(!chatHistory.length){
      var empty = document.createElement('div'); empty.className='empty'; empty.style.marginTop='6px';
      empty.textContent = 'Пока пусто. Продиктуйте или напишите первую команду.'; log.appendChild(empty);
    }
    chatHistory.forEach(function(m){ log.appendChild(chatBubble(m)); });
    if(chatBusy){
      var thinking = document.createElement('div');
      thinking.style.cssText = 'align-self:flex-start;display:flex;align-items:center;gap:6px;color:var(--ink-dim);font-size:13px;';
      thinking.innerHTML = '<span class="spinner"></span> Думаю…';
      log.appendChild(thinking);
    }
    box.appendChild(log);

    var inputRow = document.createElement('div');
    inputRow.className = 'quickadd';
    inputRow.innerHTML = '<input type="text" id="chatInput" placeholder="Нажмите и продиктуйте или напишите команду…"><button id="chatSendBtn">➤</button>';
    box.appendChild(inputRow);

    var sendBtn = inputRow.querySelector('#chatSendBtn');
    var inputEl = inputRow.querySelector('#chatInput');
    if(chatBusy){ sendBtn.disabled = true; inputEl.disabled = true; }
    sendBtn.addEventListener('click', submitChat);
    inputEl.addEventListener('keydown', function(ev){ if(ev.key==='Enter') submitChat(); });
    if(!chatBusy) setTimeout(function(){ inputEl.focus(); }, 0);
    setTimeout(function(){ log.scrollTop = log.scrollHeight; }, 0);

    return box;

  function chatBubble(m){
    var isUser = m.role==='user';
    var row = document.createElement('div');
    row.style.cssText = 'display:flex;flex-direction:column;gap:4px;max-width:88%;align-self:'+(isUser?'flex-end':'flex-start')+';';
    var bubble = document.createElement('div');
    bubble.style.cssText = 'background:'+(isUser?'var(--accent)':'var(--surface-2)')+';color:'+(isUser?'var(--accent-ink)':'var(--ink)')+';border-radius:12px;padding:9px 12px;font-size:13.5px;white-space:pre-wrap;word-break:break-word;';
    bubble.textContent = m.text;
    row.appendChild(bubble);
    (m.actions||[]).forEach(function(a){
      if(a.type==='mailto'){
        var link = document.createElement('a');
        link.href = a.href;
        link.textContent = '✉ Открыть письмо для '+a.name;
        link.className = 'btn sm';
        link.style.cssText = 'text-decoration:none;display:inline-flex;width:fit-content;';
        row.appendChild(link);
        var note = document.createElement('div');
        note.className = 'mailto-note';
        note.textContent = 'Откроет вашу почтовую программу с готовым письмом — отправить нужно будет самому, работает не в каждом браузере.';
        row.appendChild(note);
      } else if(a.type==='task'){
        var chip = document.createElement('div');
        chip.className = 'status-line good';
        chip.style.fontSize = '12px';
        chip.textContent = '✓ Задача «'+a.title+'» добавлена'+(a.employee?' ('+a.employee+')':'')+(a.date?' на '+fmtHuman(a.date):' без срока');
        row.appendChild(chip);
      } else if(a.type==='event'){
        var chip2 = document.createElement('div');
        chip2.className = 'status-line good';
        chip2.style.fontSize = '12px';
        chip2.textContent = '📌 «'+a.contact+'» отмечен мероприятием «'+a.event+'»';
        row.appendChild(chip2);
      }
    });
    return row;
  }

  function submitChat(){
    var inputEl = document.getElementById('chatInput');
    if(!inputEl) return;
    var text = inputEl.value.trim();
    if(!text || chatBusy) return;
    if(!sampleNs){
      chatHistory.push({role:'user', text:text});
      chatHistory.push({role:'assistant', text:'Голосовой помощник недоступен в этом окне.'});
      renderAll();
      return;
    }
    chatHistory.push({role:'user', text:text});
    chatBusy = true;
    renderAll();
    runAssistant(text).then(function(reply){
      chatHistory.push(reply);
    }).catch(function(e){
      chatHistory.push({role:'assistant', text: assistantErrorCopy(e)});
    }).then(function(){
      chatBusy = false;
      renderAll();
    });
  }

  function assistantErrorCopy(e){
    var code = e && e.code;
    if(code==='not_granted') return 'Доступ к помощнику не разрешён для этого окна.';
    if(code==='rate_limited') return 'Сейчас перегружено — попробуйте через минуту.';
    if(code==='tools_unavailable' || code==='images_unavailable') return 'В этом окне помощник не может выполнять действия.';
    if(code==='session_expired') return 'Нужно войти заново, чтобы пользоваться помощником.';
    return 'Не получилось обработать команду. Попробуйте переформулировать.';
  }

  function runAssistant(text){
    var me = whoAmIEmployee();
    var pendingActions = [];
    var empList = employees.map(function(e){ return e.name; }).join('; ');

    var tools = [
      {
        name: 'create_task',
        description: 'Создаёт задачу в календаре указанного сотрудника АКК. Возвращает подтверждение с именем сотрудника, названием и датой.',
        inputSchema: {
          type:'object',
          properties:{
            employee_name:{type:'string', description:'Имя сотрудника как упомянуто, или "me" если это сам собеседник'},
            title:{type:'string', description:'Короткое название задачи'},
            date:{type:'string', description:'Дата в формате YYYY-MM-DD, или пустая строка если без срока'},
            time:{type:'string', description:'Время, например 15:00, или пустая строка'},
            location:{type:'string'},
            description:{type:'string'}
          },
          required:['employee_name','title']
        },
        execute: function(input){
          var empName = String(input.employee_name||'').trim().toLowerCase();
          var target = null;
          if(!empName || empName==='me' || empName==='я' || empName==='мне' || empName==='мной'){
            target = me;
          } else {
            target = employees.find(function(e){
              var n = e.name.toLowerCase();
              return n.indexOf(empName)!==-1 || empName.indexOf(n)!==-1;
            });
          }
          if(!target) throw new Error('Сотрудник не найден. Доступные: '+(empList||'нет сотрудников')+'.');
          if(!dbNs || !canWrite) throw new Error('Нет прав на запись в этом окне.');
          var title = String(input.title||'').trim();
          if(!title) throw new Error('Не указано название задачи.');
          var date = String(input.date||'').trim();
          var doc = {
            title:title, type: date?'point':'ongoing', status:'open',
            date:date, time:String(input.time||'').trim(), start_date:'', end_date:'',
            from_person:'', location:String(input.location||'').trim(),
            description:String(input.description||'').trim(), notes:'', notes_log:[], checklist:[], attachments:[],
            created_at:new Date().toISOString(), updated_at:new Date().toISOString()
          };
          return dbNs.collection('employees/'+target.id+'/tasks').add(doc).then(function(){
            pendingActions.push({type:'task', title:title, employee:target.name, date:date});
            return {ok:true, employee:target.name, title:title, date: date||'без срока'};
          });
        }
      },
      {
        name: 'find_contact',
        description: 'Ищет контакт в визитнице АКК по имени, компании, должности или телефону. Возвращает до 5 совпадений с id, именем и email.',
        inputSchema: { type:'object', properties:{ query:{type:'string'} }, required:['query'] },
        execute: function(input){
          var q = String(input.query||'').trim().toLowerCase();
          if(!q) return [];
          return contacts.filter(function(c){
            return [c.name,c.company,c.position,c.phone].some(function(v){ return v && String(v).toLowerCase().indexOf(q)!==-1; });
          }).slice(0,5).map(function(c){
            return {id:c.id, name:c.name||'', email:c.email||'', phone:c.phone||'', company:c.company||'', position:c.position||''};
          });
        }
      },
      {
        name: 'draft_email',
        description: 'Готовит письмо контакту (тема и текст) и возвращает ссылку для открытия в почтовой программе собеседника. Письмо НЕ отправляется автоматически — только готовится, отправляет человек сам. Сначала найди контакт через find_contact.',
        inputSchema: {
          type:'object',
          properties:{ contact_id:{type:'string'}, contact_name:{type:'string'}, subject:{type:'string'}, body:{type:'string'} },
          required:['subject','body']
        },
        execute: function(input){
          var c = null;
          if(input.contact_id) c = contacts.find(function(x){ return x.id===String(input.contact_id); });
          if(!c && input.contact_name){
            var q = String(input.contact_name).toLowerCase();
            c = contacts.find(function(x){ return x.name && x.name.toLowerCase().indexOf(q)!==-1; });
          }
          if(!c) throw new Error('Контакт не найден — сначала вызови find_contact.');
          if(!c.email) throw new Error('У контакта «'+c.name+'» не указан email.');
          var href = 'mailto:'+encodeURIComponent(c.email)+'?subject='+encodeURIComponent(String(input.subject||''))+'&body='+encodeURIComponent(String(input.body||''));
          pendingActions.push({type:'mailto', href:href, name:c.name});
          return {ok:true, contact:c.name, email:c.email};
        }
      },
      {
        name: 'set_contact_event',
        description: 'Отмечает мероприятие (форум, конференция, встреча), с которого контакт в визитнице — то, что нельзя распознать с фото визитки, а нужно услышать от человека. Если id контакта неизвестен — сначала вызови find_contact.',
        inputSchema: {
          type:'object',
          properties:{ contact_id:{type:'string'}, contact_name:{type:'string'}, event:{type:'string', description:'Название мероприятия'} },
          required:['event']
        },
        execute: function(input){
          var c = null;
          if(input.contact_id) c = contacts.find(function(x){ return x.id===String(input.contact_id); });
          if(!c && input.contact_name){
            var q2 = String(input.contact_name).toLowerCase();
            c = contacts.find(function(x){ return x.name && x.name.toLowerCase().indexOf(q2)!==-1; });
          }
          if(!c) throw new Error('Контакт не найден — сначала вызови find_contact.');
          if(!dbNs || !canWrite) throw new Error('Нет прав на запись в этом окне.');
          var ev = String(input.event||'').trim();
          if(!ev) throw new Error('Не указано название мероприятия.');
          return dbNs.doc('contacts/'+c.id).update({event:ev}).then(function(){
            pendingActions.push({type:'event', contact:c.name, event:ev});
            return {ok:true, contact:c.name, event:ev};
          });
        }
      }
    ];

    return sampleNs.limits().catch(function(){ return null; }).then(function(limits){
      var canUseTools = !!(limits && limits.tools);
      var context = 'Ты — голосовой помощник внутри корпоративного приложения задач и контактов АКК (Ассоциация корейцев Казахстана). ' +
        'Сегодняшняя дата: '+todayISO+'. Сотрудники: '+(empList||'(пока никого)')+'. ' +
        (me ? 'Собеседник — сотрудник «'+me.name+'»; если просит "мне"/"я" — это он/она. '
             : 'Собеседник не выбрал свой профиль — если просит "мне", сначала уточни текстом, кто он, не вызывая инструмент. ') +
        'Текст приходит через голосовую диктовку устройства — могут быть неточности распознавания, ориентируйся на смысл. ' +
        (canUseTools
          ? 'Чтобы поставить задачу — вызови create_task. Чтобы найти контакт — find_contact. Чтобы подготовить письмо контакту — сначала find_contact, затем draft_email (письмо не отправляется само, только готовится). Чтобы отметить, с какого мероприятия контакт (форум, конференция, встреча) — сначала find_contact, затем set_contact_event. Относительные даты ("завтра", "в пятницу", "через неделю") переводи в YYYY-MM-DD от сегодняшней даты.'
          : 'В этом окне выполнять действия нельзя — только отвечай советом текстом.') +
        ' Отвечай кратко и по-русски.';

      var turns = [{role:'user', content:context}, {role:'assistant', content:'Понял, готов помогать.'}];
      var history = chatHistory.slice(0, -1).slice(-6);
      history.forEach(function(m){ turns.push({role:m.role, content:m.text}); });
      turns.push({role:'user', content:text});

      var opts = {modelTier:'default', cache:false};
      if(canUseTools) opts.tools = tools;
      return sampleNs(turns, opts);
    }).then(function(res){
      return {role:'assistant', text:res.text, actions:pendingActions};
    });
  }

  // add contact flow
  var addOverlay = document.getElementById('addOverlay');
  var photoStep = document.getElementById('photoStep');
  var photoInputCamera = document.getElementById('photoInputCamera');
  var photoInputGallery = document.getElementById('photoInputGallery');
  var photoPreviewWrap = document.getElementById('photoPreviewWrap');
  var photoPreviewImg = document.getElementById('photoPreviewImg');
  var recognizeStatus = document.getElementById('recognizeStatus');
  var formFields = document.getElementById('formFields');
  var retakeBtn = document.getElementById('retakeBtn');
  var saveContactBtn = document.getElementById('saveContactBtn');
  var fEventChips = document.getElementById('fEventChips');

  function renderEventChips(){
    var counts = {};
    contacts.forEach(function(c){
      var v = (c.event||'').trim();
      if(!v) return;
      var key = v.toLowerCase();
      if(!counts[key]) counts[key] = {label:v, n:0, last:c.created_at||''};
      counts[key].n++;
      if((c.created_at||'') > counts[key].last) counts[key].last = c.created_at||'';
    });
    var list = Object.keys(counts).map(function(k){ return counts[k]; });
    list.sort(function(a,b){ return b.n-a.n || (b.last||'').localeCompare(a.last||''); });
    list = list.slice(0,6);
    fEventChips.innerHTML = '';
    list.forEach(function(item){
      var chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'event-chip';
      chip.textContent = item.label;
      chip.addEventListener('click', function(){ document.getElementById('fEvent').value = item.label; });
      fEventChips.appendChild(chip);
    });
  }

  var contactFormMode = 'add';   // 'add' | 'edit'
  var contactFormEditId = null;
  var CONTACT_STAGES = [['new','Новый'],['talks','Переговоры'],['partner','Партнёр']];
  var CONTACT_STAGE_LABEL = {new:'Новый', talks:'Переговоры', partner:'Партнёр'};
  var CONTACT_STAGE_COLOR = {new:'var(--ink-dim)', talks:'var(--accent)', partner:'var(--good)'};
  function contactStageOf(c){
    if(c && c.stage && CONTACT_STAGE_LABEL[c.stage]) return c.stage;
    return 'new';
  }
  function setFStage(stage){
    document.querySelectorAll('#fStageSeg .stage-btn').forEach(function(b){
      b.classList.toggle('active', b.getAttribute('data-stage')===stage);
    });
  }
  document.querySelectorAll('#fStageSeg .stage-btn').forEach(function(b){
    b.addEventListener('click', function(){ setFStage(b.getAttribute('data-stage')); });
  });
  function getFStage(){
    var active = document.querySelector('#fStageSeg .stage-btn.active');
    return active ? active.getAttribute('data-stage') : 'new';
  }

  function openAddContact(){
    contactFormMode = 'add'; contactFormEditId = null;
    addOverlay.querySelector('.sheet-head h2').textContent = 'Новый контакт';
    selectedContactFile = null;
    photoInputCamera.value = ''; photoInputGallery.value = '';
    photoStep.hidden = false; photoPreviewWrap.hidden = true; recognizeStatus.hidden = true;
    formFields.hidden = true; retakeBtn.hidden = true; saveContactBtn.hidden = true;
    saveContactBtn.textContent = 'Сохранить контакт';
    ['fName','fPosition','fCompany','fPhone','fEmail','fNote','fEvent','fNextStep','fNextDate'].forEach(function(id){ document.getElementById(id).value=''; });
    setFStage('new');
    renderEventChips();
    addOverlay.hidden = false;

  function openEditContact(c){
    contactFormMode = 'edit'; contactFormEditId = c.id;
    addOverlay.querySelector('.sheet-head h2').textContent = 'Редактировать контакт';
    selectedContactFile = null;
    photoInputCamera.value = ''; photoInputGallery.value = '';
    photoStep.hidden = true;
    if(c.photo_id){ photoPreviewWrap.hidden = false; photoPreviewImg.src = ''+c.photo_id; }
    else photoPreviewWrap.hidden = true;
    recognizeStatus.hidden = true;
    formFields.hidden = false; retakeBtn.hidden = false; saveContactBtn.hidden = false; saveContactBtn.disabled = false;
    saveContactBtn.textContent = 'Сохранить изменения';
    document.getElementById('fName').value = c.name||'';
    document.getElementById('fPosition').value = c.position||'';
    document.getElementById('fCompany').value = c.company||'';
    document.getElementById('fPhone').value = c.phone||'';
    document.getElementById('fEmail').value = c.email||'';
    document.getElementById('fNote').value = c.notes||'';
    document.getElementById('fEvent').value = c.event||'';
    document.getElementById('fNextStep').value = c.next_step||'';
    document.getElementById('fNextDate').value = c.next_step_date||'';
    setFStage(contactStageOf(c));
    renderEventChips();
    detailOverlay.hidden = true;
    addOverlay.hidden = false;
  }
  document.getElementById('addClose').addEventListener('click', function(){ addOverlay.hidden = true; });
  addOverlay.addEventListener('click', function(e){ if(e.target===addOverlay) addOverlay.hidden = true; });

  function onContactPhotoPicked(ev){
    var input = ev.target;
    var file = input.files && input.files[0];
    if(!file) return;
    selectedContactFile = file;
    photoPreviewImg.src = URL.createObjectURL(file);
    photoStep.hidden = true; photoPreviewWrap.hidden = false; formFields.hidden = false;
    retakeBtn.hidden = false; saveContactBtn.hidden = false; saveContactBtn.disabled = false;
    tryRecognizeContact(file);
  }
  photoInputCamera.addEventListener('change', onContactPhotoPicked);
  photoInputGallery.addEventListener('change', onContactPhotoPicked);
  retakeBtn.addEventListener('click', function(){
    selectedContactFile = null; photoInputCamera.value=''; photoInputGallery.value='';
    photoStep.hidden = false; photoPreviewWrap.hidden = true; recognizeStatus.hidden = true;
  });
  function setContactStatus(kind, html){
    recognizeStatus.hidden = false;
    recognizeStatus.className = 'status-line'+(kind?' '+kind:'');
    recognizeStatus.innerHTML = html;
  }
  function tryRecognizeContact(file){
    if(!sampleNs){ setContactStatus('', 'Автораспознавание недоступно — заполните поля вручную.'); return; }
    sampleNs.limits().then(function(limits){
      if(!limits.images){ setContactStatus('', 'Автораспознавание фото недоступно здесь — заполните поля вручную.'); return; }
      setContactStatus('', '<span class="spinner"></span> Распознаю визитку…');
      var prompt = 'Это фотография деловой визитки (может быть на русском, казахском, корейском или английском). '
        + 'Прочитай с неё данные и верни ТОЛЬКО JSON-объект без пояснений, строго такого вида: '
        + '{"name": "Имя Фамилия", "position": "должность", "company": "название компании/организации", "phone": "телефон как на визитке", "email": "email"}. '
        + 'Если какого-то поля на визитке нет — поставь пустую строку "". Не выдумывай данные.';
      sampleNs.json(prompt, {images:[file], modelTier:'quick'}).then(function(data){
        document.getElementById('fName').value = data.name||'';
        document.getElementById('fPosition').value = data.position||'';
        document.getElementById('fCompany').value = data.company||'';
        document.getElementById('fPhone').value = data.phone||'';
        document.getElementById('fEmail').value = data.email||'';
        setContactStatus('good', 'Распознано — проверьте поля и сохраните.');
      }).catch(function(e){
        if(e.code==='not_granted') setContactStatus('', 'Автораспознавание не разрешено — заполните поля вручную.');
        else if(e.code==='rate_limited') setContactStatus('warn', 'Сейчас перегружено — заполните поля вручную или попробуйте позже.');
        else setContactStatus('warn', 'Не удалось распознать автоматически — заполните поля вручную.');
      });
    }).catch(function(){ setContactStatus('', 'Автораспознавание недоступно — заполните поля вручную.'); });
  }
  saveContactBtn.addEventListener('click', function(){
    var name = document.getElementById('fName').value.trim();
    if(!name){ setContactStatus('warn', 'Укажите хотя бы имя.'); return; }
    if(!dbNs){ setContactStatus('warn', 'База недоступна.'); return; }
    var isEdit = contactFormMode==='edit';
    var savingLabel = isEdit ? 'Сохранить изменения' : 'Сохранить контакт';
    saveContactBtn.disabled = true; saveContactBtn.textContent = 'Сохраняю…';
    var record = {
      name:name, position:document.getElementById('fPosition').value.trim(), company:document.getElementById('fCompany').value.trim(),
      phone:document.getElementById('fPhone').value.trim(), email:document.getElementById('fEmail').value.trim(),
      notes:document.getElementById('fNote').value.trim(),
      event:document.getElementById('fEvent').value.trim(),
      stage:getFStage(),
      next_step:document.getElementById('fNextStep').value.trim(),
      next_step_date:document.getElementById('fNextDate').value.trim()
    };
    if(!isEdit) record.created_at = new Date().toISOString();
    function finishSave(photoId){
      if(photoId) record.photo_id = photoId;
      if(isEdit){
        dbNs.doc('contacts/'+contactFormEditId).update(record).then(function(){
          saveContactBtn.disabled = false; saveContactBtn.textContent = savingLabel;
          addOverlay.hidden = true;
        }).catch(function(){
          saveContactBtn.disabled = false; saveContactBtn.textContent = savingLabel;
          setContactStatus('warn', 'Не удалось сохранить. Попробуйте ещё раз.');
        });
        return;
      }
      var afterUser = userNs ? userNs.id().catch(function(){return null;}) : Promise.resolve(null);
      afterUser.then(function(uid){
        if(uid) record.added_by = uid;
        return dbNs.collection('contacts').add(record);
      }).then(function(){
        saveContactBtn.disabled = false; saveContactBtn.textContent = savingLabel;
        addOverlay.hidden = true;
      }).catch(function(e){
        saveContactBtn.disabled = false; saveContactBtn.textContent = savingLabel;
        setContactStatus('warn', 'Не удалось сохранить. Попробуйте ещё раз.');
      });
    }
    if(selectedContactFile && assetsNs){
      assetsNs.upload(selectedContactFile).then(function(res){ finishSave(res.id); }).catch(function(){ finishSave(null); });
    } else { finishSave(null); }
  });

  // contact detail
  var detailOverlay = document.getElementById('detailOverlay');
  var detailName = document.getElementById('detailName');
  var detailPhotoWrap = document.getElementById('detailPhotoWrap');
  var detailPhotoImg = document.getElementById('detailPhotoImg');
  var detailRows = document.getElementById('detailRows');
  var deleteContactBtn = document.getElementById('deleteContactBtn');
  var editContactBtn = document.getElementById('editContactBtn');

  function detailRow(label, value, mailto){
    if(!value) return '';
    var action = mailto ? '<a href="mailto:'+esc(value)+'" class="copy-btn" style="text-decoration:none;">написать</a>' : '';
    return '<div class="detail-row"><span class="detail-label">'+esc(label)+'</span>' +
      '<span class="detail-value-wrap"><span class="detail-value">'+esc(value)+'</span>'+action+'</span></div>';
  }
  var detailCrm = document.getElementById('detailCrm');
  function openContactDetail(id){
    var c = contacts.find(function(x){return x.id===id;});
    if(!c) return;
    editingContactId = id;
    detailName.textContent = c.name || 'Без имени';
    if(c.photo_id){ detailPhotoWrap.hidden = false; detailPhotoImg.src = ''+c.photo_id; }
    else detailPhotoWrap.hidden = true;

    var stage = contactStageOf(c);
    var nextOverdue = c.next_step_date && c.next_step_date < todayISO;
    detailCrm.innerHTML =
      (c.event ? '<div class="event-banner">📌 '+esc(c.event)+'</div>' : '') +
      '<span class="stage-pill" style="--pill-c:'+CONTACT_STAGE_COLOR[stage]+'">'+esc(CONTACT_STAGE_LABEL[stage])+'</span>' +
      '<div class="crm-box" style="margin-top:7px;">' +
        '<div class="crm-line"><span>Последний контакт</span><b>'+(c.last_contact_at ? fmtHuman(c.last_contact_at) : '—')+'</b></div>' +
        (canWrite ? '<button class="crm-touch-btn" id="markContactedBtn" style="align-self:flex-start;">✓ Связались сегодня</button>' : '') +
        (c.next_step ? '<div class="crm-line'+(nextOverdue?' overdue':'')+'"><span>Следующий шаг</span><b>'+esc(c.next_step)+(c.next_step_date?' · '+fmtHuman(c.next_step_date):'')+'</b></div>' : '') +
      '</div>';
    var markBtn = document.getElementById('markContactedBtn');
    if(markBtn) markBtn.addEventListener('click', function(){
      markBtn.disabled = true; markBtn.textContent = '…';
      dbNs.doc('contacts/'+id).update({last_contact_at:todayISO}).catch(function(){}).then(function(){
        markBtn.disabled = false; markBtn.textContent = '✓ Связались сегодня';
      });
    });

    detailRows.innerHTML =
      detailRow('Должность', c.position) + detailRow('Компания', c.company) +
      detailRow('Телефон', c.phone) + detailRow('Email', c.email, true) +
      detailRow('Заметка', c.notes) +
      detailRow('Добавлен', c.created_at ? fmtAtHuman(c.created_at) : '') +
      (c.email ? '<p class="mailto-note">Ссылка «написать» открывает вашу почтовую программу — работает не в каждом браузере/окне, адрес выше можно скопировать вручную.</p>' : '');
    deleteContactBtn.hidden = !canWrite;
    editContactBtn.hidden = !canWrite;
    detailOverlay.hidden = false;
  }
  document.getElementById('detailClose').addEventListener('click', function(){ detailOverlay.hidden = true; });
  detailOverlay.addEventListener('click', function(e){ if(e.target===detailOverlay) detailOverlay.hidden = true; });
  editContactBtn.addEventListener('click', function(){
    var c = contacts.find(function(x){return x.id===editingContactId;});
    if(c) openEditContact(c);
  });
  deleteContactBtn.addEventListener('click', function(){
    if(!editingContactId || !dbNs) return;
    deleteContactBtn.disabled = true; deleteContactBtn.textContent = 'Удаляю…';
    dbNs.doc('contacts/'+editingContactId).delete().then(function(){
      detailOverlay.hidden = true; deleteContactBtn.disabled = false; deleteContactBtn.textContent = 'Удалить';
    }).catch(function(){ deleteContactBtn.disabled = false; deleteContactBtn.textContent = 'Удалить'; });
  });

  // ===================================================================
  // BOOT
  // ===================================================================
  function subscribeEmployee(id){
    if(subscribed[id] || !dbNs) return;
    subscribed[id] = true;
    tasksBySlug[id] = tasksBySlug[id] || [];
    dayNotesBySlug[id] = dayNotesBySlug[id] || {};
    dbNs.collection('employees/'+id+'/tasks').onSnapshot(function(snap){
      tasksBySlug[id] = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      renderAll();
    }, function(){});
    dbNs.collection('employees/'+id+'/day_notes').onSnapshot(function(snap){
      var map = {};
      snap.docs.forEach(function(d){ map[d.id] = (d.data()||{}).entries || []; });
      dayNotesBySlug[id] = map;
      renderAll();
    }, function(){});
  }

  function bootDb(){
    if(!dbNs){ document.getElementById('main').innerHTML = '<div class="empty">База недоступна в этом окне.</div>'; return; }
    dbNs.collection('employees').onSnapshot(function(snap){
      employees = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      employees.forEach(function(e){ subscribeEmployee(e.id); });
      if(activeTab==='summary' && !employees.length){ /* fine, summary renders empty state */ }
      if(activeTab!=='summary' && activeTab!=='contacts' && !employees.find(function(e){return e.id===activeTab;})){
        // keep tab selection even if not yet loaded; once it loads it will render
      }
      renderAll();
    }, function(){});
    dbNs.collection('contacts').onSnapshot(function(snap){
      contacts = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      if(activeTab==='contacts') renderAll();
    }, function(){});
  }

  function boot(){
    var w = (window.claude && window.claude.use) ? window.claude : null;
    var uses = w ? [
      w.use('db').catch(function(){return null;}),
      w.use('assets').catch(function(){return null;}),
      w.use('sample').catch(function(){return null;}),
      w.use('user').catch(function(){return null;})
    ] : [Promise.resolve(null),Promise.resolve(null),Promise.resolve(null),Promise.resolve(null)];
    Promise.all(uses).then(function(res){
      dbNs=res[0]; assetsNs=res[1]; sampleNs=res[2]; userNs=res[3];
      canWrite = !!assetsNs;
      renderAll();
      bootDb();
    });
  }
  renderAll();
  boot();
})();
</script>
