<style>
  :root {
    color-scheme: light;
    --surface-0: #f4f5f7;
    --surface-1: #ffffff;
    --surface-2: #eceef2;
    --border: #dde1e8;
    --text-primary: #14192b;
    --text-secondary: #59617a;
    --text-muted: #8891a6;
    --navy: #16213e;
    --navy-ink: #0d1428;
    --accent: #2a78d6;
    --good: #0ca30c;
    --warning: #b8790a;
    --warning-bg: #fdf1d9;
    --serious: #c05a2f;
    --critical: #d03b3b;
    --critical-bg: #fbe4e4;
    --warning-chip-bg: #fdf1d9;
    --info-bg: #e8eefb;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-0: #14161c;
      --surface-1: #1b1e26;
      --surface-2: #23272f;
      --border: #323744;
      --text-primary: #f2f3f6;
      --text-secondary: #aab0c0;
      --text-muted: #7c8394;
      --navy: #1d2b4f;
      --navy-ink: #101a33;
      --accent: #5b9ce8;
      --good: #3fc93f;
      --warning: #f0b23a;
      --warning-bg: #3a2f14;
      --serious: #e58657;
      --critical: #e66767;
      --critical-bg: #3a1c1c;
      --warning-chip-bg: #3a2f14;
      --info-bg: #172236;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-0: #14161c;
    --surface-1: #1b1e26;
    --surface-2: #23272f;
    --border: #323744;
    --text-primary: #f2f3f6;
    --text-secondary: #aab0c0;
    --text-muted: #7c8394;
    --navy: #1d2b4f;
    --navy-ink: #101a33;
    --accent: #5b9ce8;
    --good: #3fc93f;
    --warning: #f0b23a;
    --warning-bg: #3a2f14;
    --serious: #e58657;
    --critical: #e66767;
    --critical-bg: #3a1c1c;
    --warning-chip-bg: #3a2f14;
    --info-bg: #172236;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--surface-0);
    color: var(--text-primary);
    font-family: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
    padding-inline: 20px;
    padding-block: 20px 48px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }

  header.top {
    background: linear-gradient(155deg, var(--navy), var(--navy-ink));
    color: #f4f6fb;
    border-radius: 14px;
    padding: 22px 26px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: flex-end;
    gap: 14px;
  }
  header.top .title-block h1 {
    margin: 0 0 4px;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.2px;
  }
  header.top .title-block p {
    margin: 0;
    color: #c3cbe0;
    font-size: 13px;
  }
  header.top .meta {
    text-align: right;
    font-size: 12px;
    color: #aab4d0;
  }
  header.top .meta .run-date {
    font-size: 14px;
    color: #f4f6fb;
    font-weight: 600;
  }

  .kpi-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
  }
  .kpi {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .kpi .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-muted);
  }
  .kpi .value { font-size: 26px; font-weight: 700; }
  .kpi.critical .value { color: var(--critical); }
  .kpi.warning .value { color: var(--warning); }
  .kpi.good .value { color: var(--good); }
  .kpi .sub { font-size: 12px; color: var(--text-secondary); }

  .panel {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px;
  }
  .panel h2 {
    margin: 0 0 4px;
    font-size: 15px;
    font-weight: 600;
  }
  .panel .panel-sub {
    margin: 0 0 14px;
    font-size: 12.5px;
    color: var(--text-secondary);
  }

  .grid-2 {
    display: grid;
    grid-template-columns: 1.3fr 1fr;
    gap: 16px;
  }
  @media (max-width: 760px) {
    .grid-2 { grid-template-columns: 1fr; }
  }

  .issue {
    border: 1px solid var(--border);
    border-left: 4px solid var(--critical);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 10px;
    background: var(--surface-2);
  }
  .issue:last-child { margin-bottom: 0; }
  .issue.warning { border-left-color: var(--warning); }
  .issue .issue-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.3px;
    padding: 3px 9px;
    border-radius: 999px;
    text-transform: uppercase;
  }
  .chip.critical { background: var(--critical-bg); color: var(--critical); }
  .chip.warning { background: var(--warning-chip-bg); color: var(--warning); }
  .chip.info { background: var(--info-bg); color: var(--accent); }
  .chip.good { background: #e2f6e2; color: var(--good); }

  .view-toggle-row { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
  .big-btn {
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 13.5px;
    font-weight: 600;
    padding: 11px 19px;
    border-radius: 11px;
    border: 1.5px solid var(--border);
    background: var(--surface-2);
    color: var(--text-secondary);
    cursor: pointer;
    transition: background 0.12s, color 0.12s, border-color 0.12s, transform 0.06s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .big-btn:hover { border-color: var(--accent); color: var(--text-primary); transform: translateY(-1px); }
  .big-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .big-btn .icon { font-size: 16px; }

  .metric-toggle-row { display: flex; gap: 9px; flex-wrap: wrap; margin-bottom: 20px; }

  .date-picker {
    display: flex;
    gap: 9px;
    overflow-x: auto;
    padding: 4px 4px 14px;
    margin-bottom: 6px;
  }
  .date-chip {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    min-width: 74px;
    padding: 10px 12px;
    border-radius: 13px;
    border: 1.5px solid var(--border);
    background: var(--surface-2);
    cursor: pointer;
    transition: all 0.12s;
  }
  .date-chip:hover { border-color: var(--accent); }
  .date-chip.active { background: var(--navy); border-color: var(--navy); }
  .date-chip.active .dc-date, .date-chip.active .dc-type { color: #f4f6fb; }
  .date-chip .dc-period { font-size: 8.5px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-muted); font-weight: 700; }
  .date-chip.active .dc-period { color: #c3cbe0; }
  .date-chip .dc-date { font-family: "IBM Plex Mono", monospace; font-weight: 700; font-size: 14px; color: var(--text-primary); }
  .date-chip .dc-type { font-size: 10px; color: var(--text-muted); }

  .post-detail-card {
    border: 1.5px solid var(--border);
    border-radius: 16px;
    background: var(--surface-2);
    padding: 22px 24px 24px;
    margin-top: 6px;
  }
  .post-detail-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .post-detail-head .pd-title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .post-detail-head .pd-date { font-size: 21px; font-weight: 700; }
  .nav-arrow-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    background: var(--surface-1);
    color: var(--text-primary);
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.12s;
    flex: 0 0 auto;
  }
  .nav-arrow-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); background: var(--info-bg); }
  .nav-arrow-btn:disabled { opacity: 0.3; cursor: default; }

  .big-stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(165px, 1fr));
    gap: 14px;
  }
  .big-stat-tile {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 14px;
    text-align: center;
  }
  .big-stat-tile .bs-icon { font-size: 24px; margin-bottom: 8px; }
  .big-stat-tile .bs-value { font-size: 32px; font-weight: 700; color: var(--text-primary); line-height: 1.1; }
  .big-stat-tile .bs-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.4px; margin-top: 7px; }
  .big-stat-tile .bs-delta { display: inline-block; margin-top: 9px; font-size: 11.5px; font-weight: 700; padding: 3px 10px; border-radius: 999px; }
  .big-stat-tile .bs-delta.good { background: #e2f6e2; color: var(--good); }
  .big-stat-tile .bs-delta.bad { background: var(--critical-bg); color: var(--critical); }
  .big-stat-tile .bs-delta.neutral { background: var(--surface-2); color: var(--text-muted); }
  .big-stat-tile .bs-avg { font-size: 10.5px; color: var(--text-muted); margin-top: 5px; }

  .ig-group-posts { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .ig-group-post-chip { font-size: 11.5px; padding: 4px 10px; border-radius: 999px; background: var(--surface-1); border: 1px solid var(--border); color: var(--text-secondary); }

  .post-link { color: inherit; text-decoration: none; }
  .post-link:hover { text-decoration: underline; }
  .post-link-icon { font-size: 0.72em; opacity: 0.35; margin-left: 3px; transition: opacity 0.15s; display: inline-block; }
  .post-link:hover .post-link-icon { opacity: 0.9; }

  .ig-animated {
    transition: opacity 0.45s ease, transform 0.45s ease;
  }
  .ig-animated.fading {
    opacity: 0;
    transform: translateY(6px);
    pointer-events: none;
  }

  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 12px;
  }
  .filter-btn {
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 11.5px;
    font-weight: 600;
    padding: 5px 11px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text-secondary);
    cursor: pointer;
    transition: background 0.12s, color 0.12s, border-color 0.12s;
  }
  .filter-btn:hover { border-color: var(--accent); color: var(--text-primary); }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .issue .source-tag {
    font-size: 11.5px;
    color: var(--text-muted);
  }
  .issue blockquote {
    margin: 0 0 6px;
    padding: 8px 10px;
    background: var(--surface-1);
    border-radius: 6px;
    font-size: 13px;
    font-style: italic;
    color: var(--text-primary);
    border: 1px dashed var(--border);
  }
  .issue p.desc {
    margin: 0;
    font-size: 12.5px;
    color: var(--text-secondary);
  }

  .verif-item {
    display: flex;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .verif-item:last-child { border-bottom: none; }
  .verif-dot {
    flex: 0 0 8px;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--warning);
    margin-top: 6px;
  }
  .verif-item .who {
    font-weight: 600;
    font-size: 13.5px;
  }
  .verif-item .what {
    font-size: 12.5px;
    color: var(--text-secondary);
    margin-top: 2px;
  }
  .verif-item .added {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 3px;
  }

  .source-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 9px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .source-row:last-child { border-bottom: none; }
  .source-row .label { color: var(--text-primary); }
  .source-row .note { color: var(--text-muted); font-size: 11.5px; }
  .status-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .status-badge.ok { background: #e2f6e2; color: var(--good); }
  .status-badge.limited { background: var(--warning-chip-bg); color: var(--warning); }
  .status-badge.pending { background: var(--surface-2); color: var(--text-muted); }

  .placeholder-card {
    border: 1.5px dashed var(--border);
    border-radius: 12px;
    padding: 22px 18px;
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
    background: var(--surface-2);
  }
  .placeholder-card strong {
    display: block;
    color: var(--text-secondary);
    font-size: 13.5px;
    margin-bottom: 4px;
  }

  .social-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 14px;
  }
  .social-card {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    background: var(--surface-2);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .social-card-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .social-card-head .platform {
    font-weight: 600;
    font-size: 13.5px;
  }
  .social-stats {
    display: flex;
    gap: 16px;
  }
  .social-stat .n { font-size: 17px; font-weight: 700; }
  .social-stat .l { font-size: 10.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.4px; }
  .social-latest {
    font-size: 12.5px;
    color: var(--text-secondary);
    background: var(--surface-1);
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 8px 10px;
  }
  .social-latest .when { color: var(--text-muted); font-size: 11px; margin-bottom: 3px; }
  .social-flag {
    font-size: 12px;
    color: var(--warning);
    display: flex;
    gap: 6px;
  }

  .chart-wrap {
    display: flex;
    align-items: flex-end;
    gap: 12px;
    height: 220px;
    padding: 4px 4px 0;
    margin-bottom: 8px;
  }
  .chart-bar-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    height: 100%;
    gap: 7px;
    cursor: pointer;
    border-radius: 8px;
    padding: 6px 3px 4px;
    transition: background 0.12s;
  }
  .chart-bar-col:hover { background: var(--surface-2); }
  .chart-bar-col.selected .chart-bar { outline: 3px solid var(--accent); outline-offset: 1px; }
  .chart-bar-col.selected .chart-bar-label { color: var(--text-primary); font-weight: 700; }
  .chart-bar-value {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-primary);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
  }
  .chart-bar {
    width: 100%;
    max-width: 48px;
    background: var(--accent);
    border-radius: 5px 5px 0 0;
    min-height: 4px;
  }
  .chart-bar.current { background: var(--good); }
  .chart-bar-label {
    font-size: 10.5px;
    color: var(--text-muted);
    text-align: center;
    line-height: 1.25;
  }
  .chart-bar.before { background: var(--text-muted); opacity: 0.55; }
  .chart-divider {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    height: 100%;
    padding: 0 2px;
  }
  .chart-divider .line {
    width: 2px;
    flex: 1;
    background: var(--accent);
    border-radius: 2px;
    margin-bottom: 6px;
  }
  .chart-divider .divider-label {
    font-size: 9.5px;
    color: var(--accent);
    font-weight: 600;
    text-align: center;
    line-height: 1.2;
    max-width: 54px;
  }
  .chart-legend {
    display: flex;
    gap: 16px;
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 10px;
  }
  .chart-legend .dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 5px;
  }
  .history-compare {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin: 12px 0 4px;
  }
  @media (max-width: 600px) {
    .history-compare { grid-template-columns: 1fr; }
  }
  .compare-card {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    background: var(--surface-2);
  }
  .compare-card .cc-label {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-bottom: 4px;
  }
  .compare-card .cc-value {
    font-size: 13px;
    color: var(--text-primary);
    line-height: 1.4;
  }
  .compare-card.after { border-color: var(--good); }
  .traffic-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px;
    margin-bottom: 12px;
  }
  .traffic-stat {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    background: var(--surface-2);
  }
  .traffic-stat .t-label {
    font-size: 10.5px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-bottom: 3px;
  }
  .traffic-stat .t-value {
    font-size: 17px;
    font-weight: 700;
    color: var(--text-primary);
  }
  .traffic-note {
    font-size: 12px;
    color: var(--text-secondary);
    background: var(--warning-bg);
    border: 1px dashed var(--warning);
    border-radius: 8px;
    padding: 9px 11px;
    margin-top: 4px;
  }

  .data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12.5px;
  }
  .data-table th {
    text-align: right;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    color: var(--text-muted);
    font-weight: 600;
    padding: 0 8px 8px;
    border-bottom: 1px solid var(--border);
  }
  .data-table th:first-child, .data-table td:first-child { text-align: left; }
  .data-table td {
    padding: 7px 8px;
    text-align: right;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    border-bottom: 1px solid var(--border);
    color: var(--text-primary);
  }
  .data-table tbody tr:last-child td { border-bottom: none; }
  .data-table tr.divider-row td {
    border-bottom: 2px solid var(--accent);
  }
  .data-table tr.avg-row td {
    font-weight: 700;
    background: var(--surface-2);
    border-bottom: none;
  }
  .data-table td.rowlabel { font-family: "IBM Plex Sans", sans-serif; color: var(--text-secondary); }
  .data-table th.sortable { cursor: pointer; user-select: none; }
  .data-table th.sortable:hover { color: var(--text-primary); }
  .data-table th .sort-arrow { margin-left: 3px; opacity: 0.7; }

  function fmtRunDate(iso) {
    try {
      const [y, m, d] = iso.split("-");
      return `${d}.${m}.${y}`;
    } catch (e) { return iso; }
  }

  function renderKPIs() {
    const critical = REPORT.issues.filter(i => i.severity === "CRITICAL").length;
    const warning = REPORT.issues.filter(i => i.severity === "WARNING").length;
    const verif = REPORT.verification.length;
    const checked = REPORT.sources.filter(s => s.status === "ok").length;

    const tiles = [
      { label: "Критично", value: critical, cls: "critical", sub: "нарушений редстандарта" },
      { label: "Предупреждения", value: warning, cls: "warning", sub: "формулировок на проверку" },
      { label: "На верификации", value: verif, cls: "", sub: "фактов/должностей" },
      { label: "Источников проверено", value: `${checked}/${REPORT.sources.length}`, cls: "good", sub: "полностью сегодня" }
    ];

    const row = document.getElementById("kpi-row");
    row.innerHTML = tiles.map(t => `
      <div class="kpi ${t.cls}">
        <div class="label">${t.label}</div>
        <div class="value mono">${t.value}</div>
        <div class="sub">${t.sub}</div>
      </div>
    `).join("");
  }

  function renderIssues() {
    const counts = {
      all: REPORT.issues.length,
      critical: REPORT.issues.filter(i => i.severity === "CRITICAL").length,
      warning: REPORT.issues.filter(i => i.severity === "WARNING").length
    };
    const filterDefs = [
      { key: "all", label: `Все (${counts.all})` },
      { key: "critical", label: `Критично (${counts.critical})` },
      { key: "warning", label: `Проверить (${counts.warning})` }
    ];
    const filterBar = document.getElementById("issues-filter");
    filterBar.innerHTML = filterDefs.map(f => `<button type="button" class="filter-btn ${issuesFilter === f.key ? 'active' : ''}" data-filter="${f.key}">${f.label}</button>`).join("");
    filterBar.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        if (issuesFilter === btn.dataset.filter) return;
        animateSwap(["issues-list"], () => { issuesFilter = btn.dataset.filter; renderIssues(); });
      });
    });

    const list = document.getElementById("issues-list");
    if (REPORT.issues.length === 0) {
      list.innerHTML = `<p class="panel-sub">Нарушений не найдено.</p>`;
      return;
    }
    const filtered = issuesFilter === "all" ? REPORT.issues : REPORT.issues.filter(i => i.severity.toLowerCase() === issuesFilter);
    if (filtered.length === 0) {
      list.innerHTML = `<p class="panel-sub">Нет нарушений в этой категории.</p>`;
      return;
    }
    list.innerHTML = filtered.map(i => `
      <div class="issue ${i.severity === 'WARNING' ? 'warning' : ''}">
        <div class="issue-head">
          <span class="chip ${i.severity === 'CRITICAL' ? 'critical' : 'warning'}">${i.severity === 'CRITICAL' ? 'Критично' : 'Проверить'}</span>
          <span class="source-tag">${i.rule} · источник: ${i.source}</span>
        </div>
        <blockquote>«${i.quote}»</blockquote>
        <p class="desc">${i.desc}</p>
      </div>
    `).join("");
  }

  function renderVerification() {
    const list = document.getElementById("verif-list");
    list.innerHTML = REPORT.verification.map(v => `
      <div class="verif-item">
        <div class="verif-dot"></div>
        <div>
          <div class="who">${v.person}</div>
          <div class="what">${v.issue}</div>
          <div class="added">добавлено ${v.added}</div>
        </div>
      </div>
    `).join("");
  }

  function renderSources() {
    const list = document.getElementById("sources-list");
    const statusMap = {
      ok: { cls: "ok", label: "проверено" },
      limited: { cls: "limited", label: "ограничено" },
      pending: { cls: "pending", label: "не в этом прогоне" }
    };
    list.innerHTML = REPORT.sources.map(s => {
      const st = statusMap[s.status] || statusMap.pending;
      return `
        <div class="source-row">
          <div>
            <div class="label">${s.label}</div>
            <div class="note">${s.url} — ${s.note}</div>
          </div>
          <span class="status-badge ${st.cls}">${st.label}</span>
        </div>
      `;
    }).join("");
  }

  function renderBoardMentions() {
    const bm = REPORT.board_mentions;
    if (!bm) return;
    document.getElementById("board-sub").textContent = bm.updated_note;
    const rows = [];
    (bm.found || []).forEach(f => {
      rows.push(`
        <div class="diff-item new">
          <span class="diff-text"><b>${f.person}</b> (${f.role}) — ${f.date}: ${f.headline}${f.extra_note ? ` <span style="color:var(--text-muted);">— ${f.extra_note}</span>` : ""} ${f.url ? `<a href="${f.url}" target="_blank" rel="noopener noreferrer" style="color:var(--accent);">источник ↗</a>` : ""}</span>
        </div>
      `);
    });
    (bm.not_found_today || []).forEach(n => {
      rows.push(`
        <div class="diff-item unchanged">
          <span class="diff-text"><b>${n.person}</b> (${n.role}) — новых упоминаний сегодня не найдено</span>
        </div>
      `);
    });
    const list = document.getElementById("board-list");
    list.innerHTML = rows.join("") + (bm.not_checked_today && bm.not_checked_today.length
      ? `<p class="desc" style="margin-top:10px;">Сегодня не проверялись (полный обход всех 12 имён пока не в ежедневном автопрогоне): ${bm.not_checked_today.join(", ")}.</p>`
      : "");
  }

  function renderDiff() {
    const d = REPORT.diff;
    document.getElementById("diff-sub").textContent = `Сравнение с прогоном от ${d.compared_to}`;
    const allRows = [];
    d.fixed.forEach(t => allRows.push({ cls: "fixed", label: "Исправлено", text: t, cat: "new" }));
    d.new.forEach(t => allRows.push({ cls: "new", label: "Новое", text: t, cat: "new" }));
    d.new_needs_review.forEach(t => allRows.push({ cls: "new", label: "Новое (на проверку)", text: t, cat: "new" }));
    d.unresolved.forEach(t => allRows.push({ cls: "unchanged", label: "Без изменений", text: t, cat: "unresolved" }));

    const counts = {
      all: allRows.length,
      new: allRows.filter(r => r.cat === "new").length,
      unresolved: allRows.filter(r => r.cat === "unresolved").length
    };
    const filterDefs = [
      { key: "all", label: `Все (${counts.all})` },
      { key: "new", label: `Новое (${counts.new})` },
      { key: "unresolved", label: `Без изменений (${counts.unresolved})` }
    ];
    const filterBar = document.getElementById("diff-filter");
    filterBar.innerHTML = filterDefs.map(f => `<button type="button" class="filter-btn ${diffFilter === f.key ? 'active' : ''}" data-filter="${f.key}">${f.label}</button>`).join("");
    filterBar.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        if (diffFilter === btn.dataset.filter) return;
        animateSwap(["diff-list"], () => { diffFilter = btn.dataset.filter; renderDiff(); });
      });
    });

    const list = document.getElementById("diff-list");
    const rows = diffFilter === "all" ? allRows : allRows.filter(r => r.cat === diffFilter);
    if (rows.length === 0) {
      list.innerHTML = `<p class="panel-sub">Нет данных для сравнения.</p>`;
      return;
    }
    list.innerHTML = rows.map(r => `
      <div class="diff-item ${r.cls}">
        <span class="diff-text"><b>${r.label}:</b> ${r.text}</span>
      </div>
    `).join("");
  }

  function pctClass(good) { return good ? "good" : "bad"; }

  const MONTHS_FULL = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
  const MONTHS_SHORT = ["янв", "фев", "мар", "апр", "мая", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];

  function parseIgDate(dateStr) {
    const [d, m] = dateStr.split(".").map(Number);
    return new Date(2026, m - 1, d);
  }

  function animateSwap(elIds, updateFn) {
    const els = elIds.map(id => document.getElementById(id)).filter(Boolean);
    els.forEach(el => el.classList.add("fading"));
    setTimeout(() => {
      updateFn();
      els.forEach(el => el.classList.remove("fading"));
    }, 220);
  }

  function postLinkHtml(post, label) {
    if (!post.url) return label;
    return `<a class="post-link" href="${post.url}" target="_blank" rel="noopener noreferrer" title="Открыть пост в Instagram">${label}<span class="post-link-icon">↗</span></a>`;
  }

  const IG_METRICS = [
    { key: "views", label: "Просмотры" },
    { key: "likes", label: "Лайки" },
    { key: "comments", label: "Комментарии" },
    { key: "profile_visits", label: "Визиты в профиль" },
    { key: "ext_clicks", label: "Переходы по ссылке" }
  ];

  const IG_GRANULARITIES = [
    { key: "day", label: "По дням" },
    { key: "week", label: "По неделям" },
    { key: "month", label: "По месяцам" }
  ];

  function getIgGroups(granularity) {
    const posts = [...REPORT.engagement.posts].sort((a, b) => parseIgDate(a.date) - parseIgDate(b.date));
    if (granularity === "day") {
      return posts.map(p => ({ key: p.date, label: p.date, posts: [p] }));
    }
    const map = new Map();
    posts.forEach(p => {
      const d = parseIgDate(p.date);
      let key, label;
      if (granularity === "week") {
        const day = d.getDay();
        const diffToMonday = (day + 6) % 7;
        const monday = new Date(d); monday.setDate(d.getDate() - diffToMonday);
        const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
        key = monday.toISOString().slice(0, 10);
        label = `${monday.getDate()}–${sunday.getDate()} ${MONTHS_SHORT[sunday.getMonth()]}`;
      } else {
        key = `${d.getFullYear()}-${d.getMonth()}`;
        label = MONTHS_FULL[d.getMonth()];
      }
      if (!map.has(key)) map.set(key, { key, label, posts: [] });
      map.get(key).posts.push(p);
    });
    return [...map.values()].sort((a, b) => parseIgDate(a.posts[0].date) - parseIgDate(b.posts[0].date));
  }

  function groupMetricSum(group, key) {
    return group.posts.reduce((s, p) => s + p[key], 0);
  }

  function renderEngagementViewToggle() {

      { key: "dashboard", label: "Дашборд по датам" },

    bar.querySelectorAll(".big-btn").forEach(btn => {

  function renderIgChart() {
    const groups = getIgGroups(igGranularity);
    const maxVal = Math.max(...groups.map(g => groupMetricSum(g, igMetric)));
    let html = "";
    groups.forEach((g, idx) => {
      const val = groupMetricSum(g, igMetric);
      const pct = maxVal > 0 ? Math.max((val / maxVal) * 100, 3) : 3;
      const displayVal = igMetric === "views" ? val.toLocaleString("ru-RU") : val;
      html += `
        <div class="chart-bar-col ${idx === igSelectedIndex ? 'selected' : ''}" data-idx="${idx}">
          <div class="chart-bar-value">${displayVal}</div>
          <div class="chart-bar" style="height:${pct}%"></div>
          <div class="chart-bar-label">${g.label}</div>
        </div>
      `;
    });
    const wrap = document.getElementById("ig-chart");
    wrap.innerHTML = html;
    wrap.querySelectorAll(".chart-bar-col").forEach(col => {
      col.addEventListener("click", () => {
        const idx = parseInt(col.dataset.idx, 10);
        if (idx === igSelectedIndex) return;
        animateSwap(["ig-chart", "ig-date-picker", "ig-detail"], () => {
          igSelectedIndex = idx;
          renderIgChart();
          renderIgDatePicker();
          renderIgDetail();
        });
      });
    });
  }

  function renderIgDatePicker() {
    const groups = getIgGroups(igGranularity);
    const picker = document.getElementById("ig-date-picker");
    picker.innerHTML = groups.map((g, idx) => {
      const singlePost = g.posts.length === 1 ? g.posts[0] : null;
      const dateHtml = singlePost ? postLinkHtml(singlePost, g.label) : g.label;
      const subLabel = g.posts.length > 1 ? `${g.posts.length} поста` : (singlePost.type === 'Reel*' ? 'Reel' : 'Пост');
      return `
        <div class="date-chip ${idx === igSelectedIndex ? 'active' : ''}" data-idx="${idx}">
          <div class="dc-date">${dateHtml}</div>
          <div class="dc-type">${subLabel}</div>
        </div>
      `;
    }).join("");
    picker.querySelectorAll(".date-chip").forEach(chip => {
      chip.addEventListener("click", (e) => {
        if (e.target.closest("a")) return;
        const idx = parseInt(chip.dataset.idx, 10);
        if (idx === igSelectedIndex) return;
        animateSwap(["ig-chart", "ig-date-picker", "ig-detail"], () => {
          igSelectedIndex = idx;
          renderIgChart();
          renderIgDatePicker();
          renderIgDetail();
        });
      });
    });
  }

  function renderIgDetail() {
    const groups = getIgGroups(igGranularity);
    const g = groups[igSelectedIndex];
    const prevGroup = igSelectedIndex > 0 ? groups[igSelectedIndex - 1] : null;
    const isSingle = g.posts.length === 1;

    const tiles = IG_METRICS.map(s => {
      const val = groupMetricSum(g, s.key);
      let deltaHtml;
      if (prevGroup) {
        const prevVal = groupMetricSum(prevGroup, s.key);
        if (prevVal > 0) {
          const deltaPct = Math.round((val - prevVal) / prevVal * 100);
          const cls = deltaPct >= 0 ? "good" : "bad";
          const prevLabel = igGranularity === "day" ? "к пред. посту" : (igGranularity === "week" ? "к пред. неделе" : "к пред. месяцу");
          deltaHtml = `<span class="bs-delta ${cls}">${deltaPct >= 0 ? '+' : ''}${deltaPct}% ${prevLabel}</span>`;
        } else {
          deltaHtml = `<span class="bs-delta neutral">нет данных для сравнения</span>`;
        }
      } else {
        deltaHtml = `<span class="bs-delta neutral">первый период в выборке</span>`;
      }
      const displayVal = s.key === "views" ? val.toLocaleString("ru-RU") : val;
      const avgNote = !isSingle ? `<div class="bs-avg">в среднем ${(val / g.posts.length).toFixed(1).replace(".", ",")} за пост</div>` : "";
      return `
        <div class="big-stat-tile">
          <div class="bs-value mono">${displayVal}</div>
          <div class="bs-label">${s.label}</div>
          ${avgNote}
          ${deltaHtml}
        </div>
      `;
    }).join("");

    const singlePost = isSingle ? g.posts[0] : null;
    const titleHtml = singlePost ? postLinkHtml(singlePost, `${g.label}.2026`) : g.label;
    const typeChip = singlePost
      ? `<span class="chip info">${singlePost.type === 'Reel*' ? 'Reel' : 'Публикация'}</span>`
      : `<span class="chip info">${g.posts.length} постов</span>`;
    const groupPostsHtml = !isSingle
      ? `<div class="ig-group-posts">${g.posts.map(p => `<span class="ig-group-post-chip">${postLinkHtml(p, p.date)}</span>`).join("")}</div>`
      : "";

    const detail = document.getElementById("ig-detail");
    detail.innerHTML = `
      <div class="post-detail-head">
        <button type="button" class="nav-arrow-btn" id="ig-prev" ${igSelectedIndex === 0 ? "disabled" : ""}>‹</button>
        <div class="pd-title">
          <span class="pd-date mono">${titleHtml}</span>
          ${typeChip}
        </div>
        <button type="button" class="nav-arrow-btn" id="ig-next" ${igSelectedIndex === groups.length - 1 ? "disabled" : ""}>›</button>
      </div>
      ${groupPostsHtml}
      <div class="big-stat-grid">${tiles}</div>
    `;

    document.getElementById("ig-prev").addEventListener("click", () => {
      if (igSelectedIndex > 0) {
        animateSwap(["ig-chart", "ig-date-picker", "ig-detail"], () => {
          igSelectedIndex--;
          renderIgChart(); renderIgDatePicker(); renderIgDetail();
        });
      }
    });
    document.getElementById("ig-next").addEventListener("click", () => {
      const groups2 = getIgGroups(igGranularity);
      if (igSelectedIndex < groups2.length - 1) {
        animateSwap(["ig-chart", "ig-date-picker", "ig-detail"], () => {
          igSelectedIndex++;
          renderIgChart(); renderIgDatePicker(); renderIgDetail();
        });
      }
    });
  }

  function renderEngagementTable() {
    const posts = [...REPORT.engagement.posts].sort((a, b) => parseIgDate(a.date) - parseIgDate(b.date));
    const sortCols = [
      { key: "views", label: "Просмотры" },
      { key: "likes", label: "Лайки" },
      { key: "comments", label: "Коммент." },
      { key: "profile_visits", label: "Визиты в профиль" },
      { key: "ext_clicks", label: "Внеш. ссылка" }
    ];
    const arrowFor = (key) => engagementState.sortKey === key ? `<span class="sort-arrow">${engagementState.sortDir === 1 ? "▲" : "▼"}</span>` : "";
    let rows = [...posts];
    if (engagementState.sortKey) {
      const k = engagementState.sortKey;
      rows.sort((a, b) => (a[k] - b[k]) * engagementState.sortDir);
    }

    const row = (p) => `
      <tr>
        <td class="rowlabel">${postLinkHtml(p, p.date)} <span style="color:var(--text-muted); font-size:10.5px;">${p.type === 'Reel*' ? 'Reel*' : ''}</span></td>
        <td>${p.views.toLocaleString('ru-RU')}</td>
        <td>${p.likes}</td>
        <td>${p.comments}</td>
        <td>${p.profile_visits}</td>
        <td>${p.ext_clicks}</td>
      </tr>
    `;

    const headRow = `<tr><th>Дата</th>${sortCols.map(c => `<th class="sortable" data-sort="${c.key}">${c.label}${arrowFor(c.key)}</th>`).join("")}</tr>`;
    const table = `
      <table class="data-table">
        <thead>${headRow}</thead>
        <tbody>${rows.map(row).join("")}</tbody>
      </table>
    `;
    document.getElementById("engagement-table").innerHTML = table;
    document.querySelectorAll("#engagement-table th.sortable").forEach(th => {
      th.addEventListener("click", () => {
        const key = th.dataset.sort;
        animateSwap(["engagement-table"], () => {
          if (engagementState.sortKey === key) {
            engagementState.sortDir *= -1;
          } else {
            engagementState.sortKey = key;
            engagementState.sortDir = -1;
          }
          renderEngagementTable();
        });
      });
    });
  }

  // ---- Режим ТВ: крупный шрифт + медленная авто-прокрутка с зацикливанием ----
  // Эта копия дашборда (на Netlify) сделана специально для показа на ТВ,
  // поэтому режим включён ПО УМОЛЧАНИЮ — чтобы отключить его на этой копии
  // (например, для отладки с ноутбука), открыть с ?tv=0.
  (function initTvMode() {
    const params = new URLSearchParams(window.location.search);
    if (params.get("tv") === "0") return;

    document.body.classList.add("tv-mode");

    const SCROLL_SPEED_PX_PER_SEC = 38;   // скорость прокрутки вниз
    const PAUSE_AT_BOTTOM_MS = 7000;      // пауза внизу перед возвратом наверх
    const PAUSE_AT_TOP_MS = 4000;         // пауза наверху перед стартом
    const SCROLL_TO_TOP_MS = 1600;        // длительность анимированного возврата наверх

    let programmatic = false;   // true пока скролл двигаем мы сами (чтобы не спутать с реальным вводом)
    let paused = false;         // true, если реальный пользователь взаимодействовал со страницей
    let phase = "pause-top";    // "pause-top" | "scroll-down" | "pause-bottom" | "scroll-up"
    let phaseStart = performance.now();
    let scrollStartY = 0;

    function maxScroll() {
      return Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
    }

    function onUserInteraction() {
      if (programmatic) return;
      // Реальное взаимодействие (пульт/тач/клавиатура/колесо) — приостанавливаем автопрокрутку насовсем,
      // чтобы не бороться с пользователем. Обычно на ТВ это взаимодействие не ожидается.
      paused = true;
    }
    ["wheel", "touchstart", "keydown", "pointerdown"].forEach(evt => {
      window.addEventListener(evt, onUserInteraction, { passive: true });
    });

    function setScroll(y) {
      programmatic = true;
      window.scrollTo(0, y);
      // сбрасываем флаг сразу после кадра, в котором произошёл скролл
      requestAnimationFrame(() => { programmatic = false; });
    }

    function tick(now) {
      if (paused) { requestAnimationFrame(tick); return; }
      const elapsed = now - phaseStart;
      const max = maxScroll();

      if (max <= 0) {
        // страница короче экрана — просто ничего не делаем
        requestAnimationFrame(tick);
        return;
      }

      if (phase === "pause-top") {
        if (elapsed >= PAUSE_AT_TOP_MS) {
          phase = "scroll-down";
          phaseStart = now;
        }
      } else if (phase === "scroll-down") {
        const y = Math.min(max, (elapsed / 1000) * SCROLL_SPEED_PX_PER_SEC);
        setScroll(y);
        if (y >= max) {
          phase = "pause-bottom";
          phaseStart = now;
        }
      } else if (phase === "pause-bottom") {
        if (elapsed >= PAUSE_AT_BOTTOM_MS) {
          phase = "scroll-up";
          phaseStart = now;
          scrollStartY = window.scrollY;
        }
      } else if (phase === "scroll-up") {
        const t = Math.min(1, elapsed / SCROLL_TO_TOP_MS);
        // плавное ease-out
        const eased = 1 - Math.pow(1 - t, 3);
        setScroll(scrollStartY * (1 - eased));
        if (t >= 1) {
          phase = "pause-top";
          phaseStart = now;
        }
      }

      requestAnimationFrame(tick);
    }

  /* Layout concept: one shared office binder — a tab for each person's own

  :root{

      --accent:#5B9CE8; --accent-ink:#0D1428;
      --good:#3FC93F; --good-bg:#17301A;
      --warn:#F0B23A; --warn-bg:#3A2F14;
      --gold:#D9B968;
      --shadow-1:0 1px 2px rgba(0,0,0,.25), 0 2px 10px rgba(0,0,0,.28);

  }
  :root[data-theme="dark"]{
    --bg:#14161C; --surface:#1B1E26; --surface-2:#23272F;

    --navy:#1D2B4F; --navy-ink:#101A33;
    --accent:#5B9CE8; --accent-ink:#0D1428;
    --good:#3FC93F; --good-bg:#17301A;
    --warn:#F0B23A; --warn-bg:#3A2F14;
    --gold:#D9B968;

<script>
(function(){

  var GEMINI_MODEL = 'gemini-flash-latest';

  firebase.initializeApp(FIREBASE_CONFIG);
  var dbInstance = firebase.firestore();

  function uploadToCloudinary(file){
    var fd = new FormData();
    fd.append('file', file);
    fd.append('upload_preset', CLOUDINARY.upload_preset);
    return fetch('https://api.cloudinary.com/v1_1/'+CLOUDINARY.cloud_name+'/image/upload', {method:'POST', body:fd})
      .then(function(r){ return r.json(); })
      .then(function(data){
        if(data.error) return Promise.reject(new Error(data.error.message||'upload failed'));
        return {id: data.secure_url, url: data.secure_url};
      });
  }

  function fileToBase64(file){
    return new Promise(function(resolve,reject){
      var reader = new FileReader();
      reader.onload = function(){ resolve(String(reader.result).split(',')[1]); };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function roleToGemini(r){ return r==='assistant' ? 'model' : 'user'; }

  function callGemini(body){
    return fetch('https://generativelanguage.googleapis.com/v1beta/models/'+GEMINI_MODEL+':generateContent?key='+GEMINI_API_KEY, {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
    }).then(function(r){ return r.json().then(function(j){ return {ok:r.ok, json:j}; }); })
      .then(function(res){
        if(!res.ok){
          var msg = (res.json && res.json.error && res.json.error.message) || 'Gemini error';
          var status = res.json && res.json.error && res.json.error.status;
          var e = new Error(msg);
          e.code = (status==='RESOURCE_EXHAUSTED') ? 'rate_limited' : 'error';
          throw e;
        }
        return res.json;
      });
  }

  function makeSample(){
    function sampleFn(turns, opts){
      opts = opts || {};
      var contents = (turns||[]).map(function(t){ return {role: roleToGemini(t.role), parts:[{text:String(t.content||'')}]}; });
      var body = {contents: contents};
      var toolsMap = {};
      if(opts.tools && opts.tools.length){
        body.tools = [{functionDeclarations: opts.tools.map(function(t){
          toolsMap[t.name] = t;
          return {name:t.name, description:t.description||'', parameters: t.inputSchema||{type:'object',properties:{}}};
        })}];
      }
      function step(iter){
        if(iter>6) return Promise.resolve({text:'Не получилось завершить действие — попробуйте ещё раз.'});
        return callGemini(body).then(function(json){
          var cand = json.candidates && json.candidates[0];
          var parts = (cand && cand.content && cand.content.parts) || [];
          var fnCall = parts.filter(function(p){ return p.functionCall; })[0];
          if(fnCall){
            var tool = toolsMap[fnCall.functionCall.name];
            body.contents.push({role:'model', parts:parts});
            if(!tool){
              body.contents.push({role:'user', parts:[{functionResponse:{name:fnCall.functionCall.name, response:{error:'unknown tool'}}}]});
              return step(iter+1);
            }
            var result;
            try { result = tool.execute(fnCall.functionCall.args||{}); } catch(e){ result = Promise.reject(e); }
            return Promise.resolve(result).then(function(r){
              body.contents.push({role:'user', parts:[{functionResponse:{name:fnCall.functionCall.name, response:{result:r===undefined?null:r}}}]});
              return step(iter+1);
            }).catch(function(e){
              body.contents.push({role:'user', parts:[{functionResponse:{name:fnCall.functionCall.name, response:{error:String((e&&e.message)||e)}}}]});
              return step(iter+1);
            });
          }
          var textPart = parts.filter(function(p){return typeof p.text==='string';}).map(function(p){return p.text;}).join('\n');
          return {text: textPart || '...'};
        });
      }
      return step(0);
    }
    sampleFn.limits = function(){ return Promise.resolve({tools:true, images:true}); };
    sampleFn.json = function(prompt, jopts){
      jopts = jopts || {};
      var parts = [{text:prompt}];
      var filePromise = Promise.resolve();
      if(jopts.images && jopts.images[0]){
        filePromise = fileToBase64(jopts.images[0]).then(function(b64){
          parts.push({inlineData:{mimeType: jopts.images[0].type||'image/jpeg', data:b64}});
        });
      }
      return filePromise.then(function(){
        var body = {contents:[{role:'user', parts:parts}], generationConfig:{responseMimeType:'application/json'}};
        return callGemini(body);
      }).then(function(json){
        var cand = json.candidates && json.candidates[0];
        var parts2 = (cand && cand.content && cand.content.parts) || [];
        var txt = parts2.map(function(p){return p.text||'';}).join('');
        try { return JSON.parse(txt); } catch(e){ var er = new Error('bad json from model'); er.code='bad_json'; throw er; }
      });
    };
    return sampleFn;
  }

  window.claude = {
    use: function(name){
      if(name==='db') return Promise.resolve(dbInstance);
      if(name==='assets') return Promise.resolve({upload: uploadToCloudinary});
      if(name==='sample') return Promise.resolve(makeSample());
      if(name==='user') return Promise.resolve({ id: function(){
        try {
          var k='akk_uid'; var v = localStorage.getItem(k);
          if(!v){ v = 'u_'+Math.random().toString(36).slice(2)+Date.now().toString(36); localStorage.setItem(k,v); }
          return Promise.resolve(v);
        } catch(e){ return Promise.resolve('u_anon'); }
      }});
      return Promise.reject(new Error('capability not available: '+name));
    }
  };
})();
</script>

  // ---------- state ----------
  var employees = [];              // [{id,name,position,order}]
  var tasksBySlug = {};            // id -> [task,...]
  var dayNotesBySlug = {};         // id -> {iso: entries[]}
  var subscribed = {};             // id -> true
  var contacts = [];
  var uiState = {};                // id -> {view, calY, calM, filter}
  var activeTab = 'summary';
  var dayModal = null;             // {slug, iso, mode}
  var taskModal = null;            // {slug, id}
  var selectedContactFile = null;
  var editingContactId = null;
  var contactsView = 'list';       // 'list' | 'assistant'
  var chatHistory = [];            // [{role:'user'|'assistant', text, actions?}]
  var chatBusy = false;

  var todayISO = isoDate(new Date());

  // ---------- helpers ----------
  function pad2(n){ return n<10 ? '0'+n : ''+n; }
  function isoDate(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
  function parseISO(s){ var p=s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
  function fmtHuman(iso){ if(!iso) return ''; var p=iso.split('-'); return p[2]+'.'+p[1]; }
  function fmtAtHuman(at){
    if(!at) return '';
    var d = new Date(at);
    return pad2(d.getDate())+'.'+pad2(d.getMonth()+1)+', '+pad2(d.getHours())+':'+pad2(d.getMinutes());
  }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function initials(name){
    var parts = String(name||'').trim().split(/\s+/).filter(Boolean);
    if(!parts.length) return '?';
    return (parts[0][0] + (parts[1]?parts[1][0]:'')).toUpperCase();
  }
  function pluralTasks(n){
    var n10=n%10, n100=n%100;
    if(n10===1 && n100!==11) return 'а';
    if(n10>=2 && n10<=4 && (n100<10||n100>=20)) return 'и';
    return '';
  }
  function uiFor(slug){
    if(!uiState[slug]) uiState[slug] = {view:'profile', calY:new Date().getFullYear(), calM:new Date().getMonth(), filter:'active'};
    return uiState[slug];
  }
  function isOverdue(t){
    if(t.status==='done') return false;
    var d = t.type==='range' ? t.end_date : t.date;
    return d && d < todayISO;
  }
  function empName(slug){ var e=employees.find(function(x){return x.id===slug;}); return e?e.name:slug; }
  function givenName(full){
    // Roster is "Фамилия Имя[ Отчество]" — the given name is the 2nd word; falls back to the full string.
    var parts = String(full||'').trim().split(/\s+/);
    return parts[1] || parts[0] || full;
  }
  function avatarHtml(e, sizeClass){
    if(e && e.photo_id) return '<img src="'+esc(e.photo_id)+'" alt="">';
    return esc(initials(e?e.name:''));
  }

  // ===================================================================
  // TAB BAR
  // ===================================================================
  function renderTabbar(){
    var bar = document.getElementById('tabbar');
    var html = '<button class="tab-btn'+(activeTab==='summary'?' active':'')+'" data-tab="summary">Сводка</button>';
    employees.slice().sort(function(a,b){return (a.order||0)-(b.order||0);}).forEach(function(e){
      html += '<button class="tab-btn'+(activeTab===e.id?' active':'')+'" data-tab="'+esc(e.id)+'" title="'+esc(e.name)+'">'+esc(givenName(e.name))+'</button>';
    });
    html += '<button class="tab-btn'+(activeTab==='contacts'?' active':'')+'" data-tab="contacts">Визитница</button>';
    if(canWrite) html += '<button class="tab-btn ghost-add" id="addEmpTabBtn" title="Добавить сотрудника">+</button>';
    bar.innerHTML = html;
    bar.querySelectorAll('.tab-btn[data-tab]').forEach(function(b){
      b.addEventListener('click', function(){ activeTab = b.getAttribute('data-tab'); renderAll(); });
    });
    var addBtn = document.getElementById('addEmpTabBtn');
    if(addBtn) addBtn.addEventListener('click', function(){ openEmpSheet(null); });
  }

  function renderAll(){
    renderTabbar();
    var main = document.getElementById('main');
    if(activeTab==='summary'){ main.innerHTML=''; main.appendChild(renderSummary()); }
    else if(activeTab==='contacts'){ main.innerHTML=''; main.appendChild(renderContactsTab()); }
    else { main.innerHTML=''; main.appendChild(renderEmployeeTab(activeTab)); }
  }

  // ===================================================================
  // SUMMARY TAB
  // ===================================================================
  function empCounts(slug){
    var list = tasksBySlug[slug]||[];
    var open=0, done=0, overdue=0;
    list.forEach(function(t){
      if(t.status==='done') done++; else open++;
      if(isOverdue(t)) overdue++;
    });
    return {open:open, done:done, overdue:overdue, total:list.length};
  }

  function renderHeroCover(){
    var box = document.createElement('div');
    var div = document.createElement('div');
    div.className = 'hero-cover';
    div.innerHTML = HERO_SVG;
    box.appendChild(div);
    var cap = document.createElement('div');
    cap.className = 'hero-caption';
    cap.textContent = 'K-Park · культурно-деловой центр АКК в Алатау';
    box.appendChild(cap);
    return box;
  }

  function renderSummary(){
    var wrap = document.createElement('div');
    wrap.className = 'panel';
    wrap.appendChild(renderHeroCover());
    if(!employees.length){
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'Сотрудники пока не добавлены. Нажмите «+» в строке вкладок.';
      wrap.appendChild(empty);
      return wrap;
    }
    var intro = document.createElement('p');
    intro.style.cssText = 'margin:0;color:var(--ink-dim);font-size:12.5px;';
    intro.textContent = 'Открыто / выполнено / просрочено — по каждому сотруднику. Нажмите на строку, чтобы открыть его дашборд.';
    wrap.appendChild(intro);

    employees.slice().sort(function(a,b){return (a.order||0)-(b.order||0);}).forEach(function(e){
      var c = empCounts(e.id);
      var total = c.open + c.done;
      var openPct = total ? Math.round(c.open/total*100) : 0;
      var row = document.createElement('button');
      row.className = 'sum-row';
      row.innerHTML =
        '<div class="sum-avatar">'+avatarHtml(e)+'</div>' +
        '<div class="sum-name"><b>'+esc(e.name)+'</b><span>'+esc(e.position||'')+'</span></div>' +
        '<div class="sum-bars"><div class="bar-track"><div class="bar-seg" style="width:'+openPct+'%;background:var(--accent)"></div><div class="bar-seg" style="width:'+(100-openPct)+'%;background:var(--good)"></div></div></div>' +
        '<div class="sum-nums"><span>'+c.open+' откр.</span><span class="'+(c.overdue?'bad':'')+'">'+c.overdue+' просроч.</span></div>';
      row.addEventListener('click', function(){ activeTab = e.id; renderAll(); });
      wrap.appendChild(row);
    });
    return wrap;
  }

  // ===================================================================
  // EMPLOYEE TAB (calendar / list / dashboard)
  // ===================================================================
  function renderEmployeeTab(slug){
    var e = employees.find(function(x){return x.id===slug;});
    var ui = uiFor(slug);
    var wrap = document.createElement('div');
    wrap.className = 'panel';
    if(!e){ wrap.innerHTML = '<div class="empty">Сотрудник не найден.</div>'; return wrap; }

    var head = document.createElement('div');
    head.className = 'emp-head';
    head.innerHTML = '<div style="display:flex;align-items:center;gap:10px;">' +
        '<div class="avatar" style="width:38px;height:38px;font-size:13px;">'+avatarHtml(e)+'</div>' +
        '<div><h2>'+esc(e.name)+'</h2><span class="pos">'+esc(e.position||'')+'</span></div>' +
      '</div>' +
      (canWrite ? '<button class="btn sm ghost" id="empEditBtn" title="Изменить сотрудника">✎</button>' : '');
    wrap.appendChild(head);
    var empEditBtn = head.querySelector('#empEditBtn');
    if(empEditBtn) empEditBtn.addEventListener('click', function(){ openEmpSheet(e); });

    var subnav = document.createElement('div');
    subnav.className = 'subnav';
    [['profile','Профиль'],['calendar','Календарь'],['list','Список'],['board','Доска']].forEach(function(pair){
      var b = document.createElement('button');
      b.textContent = pair[1];
      if(ui.view===pair[0]) b.className='active';
      b.addEventListener('click', function(){ ui.view=pair[0]; renderAll(); });
      subnav.appendChild(b);
    });
    wrap.appendChild(subnav);

    if(ui.view==='calendar') wrap.appendChild(renderCalendar(slug));
    else if(ui.view==='list') wrap.appendChild(renderList(slug));
    else if(ui.view==='board') wrap.appendChild(renderBoard(slug));
    else wrap.appendChild(renderProfile(slug));

    return wrap;
  }

  // ===================================================================
  // PROFILE (mini-profile per person — separate from tasks)
  // ===================================================================
  function renderProfile(slug){
    var e = employees.find(function(x){return x.id===slug;});
    var wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;flex-direction:column;gap:14px;';
    if(!e) return wrap;

    var top = document.createElement('div');
    top.style.cssText = 'display:flex;gap:14px;align-items:center;';
    var photoBig = document.createElement('div');
    photoBig.style.cssText = 'flex:none;width:84px;height:84px;border-radius:18px;overflow:hidden;background:var(--surface-2);color:var(--ink-dim);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:26px;';
    photoBig.innerHTML = e.photo_id ? '<img src="'+esc(e.photo_id)+'" alt="" style="width:100%;height:100%;object-fit:cover;display:block;">' : esc(initials(e.name));
    var info = document.createElement('div');
    info.style.cssText = 'flex:1;min-width:0;';
    info.innerHTML = '<div style="font-size:17px;font-weight:700;line-height:1.25;">'+esc(e.name)+'</div>' +
      '<div style="color:var(--ink-dim);font-size:13px;margin-top:3px;">'+esc(e.position||'')+'</div>';
    top.appendChild(photoBig); top.appendChild(info);
    wrap.appendChild(top);

    var hasContact = e.phone || e.email || e.telegram;

      contactBox.innerHTML =

        (e.email ? '<p class="mailto-note">Ссылка «написать» открывает вашу почтовую программу — работает не в каждом браузере, адрес выше можно скопировать вручную.</p>' : '');
    } else {
      contactBox.innerHTML = '<div class="empty" style="padding:4px 0;">Контакты пока не заполнены'+(canWrite?' — нажмите ✎ наверху.':'.')+'</div>';
    }
    wrap.appendChild(contactBox);

    if(e.bio){
      var bioBox = document.createElement('div');
      bioBox.className = 'box';
      bioBox.innerHTML = '<div class="detail-label" style="margin-bottom:5px;">О себе</div><div style="font-size:13.5px;line-height:1.45;white-space:pre-wrap;">'+esc(e.bio)+'</div>';
      wrap.appendChild(bioBox);
    }

    var c = empCounts(slug);
    var statsHead = document.createElement('div');
    statsHead.style.cssText = 'color:var(--ink-dim);font-size:12.5px;';
    statsHead.textContent = 'Задачи';
    wrap.appendChild(statsHead);
    var stats = document.createElement('div');
    stats.className = 'stat-row';
    stats.innerHTML =
      '<div class="stat-tile"><b>'+c.total+'</b><span>всего</span></div>' +
      '<div class="stat-tile"><b>'+c.open+'</b><span>открыто</span></div>' +
      '<div class="stat-tile"><b>'+c.done+'</b><span>выполнено</span></div>' +
      '<div class="stat-tile"><b style="color:'+(c.overdue?'var(--accent)':'inherit')+'">'+c.overdue+'</b><span>просрочено</span></div>';
    wrap.appendChild(stats);

    var list = tasksBySlug[slug]||[];
    if(list.length){
      var total = list.length;
      function bar(title, segs){
        var b = document.createElement('div'); b.className='bar-wrap';
        var track = segs.map(function(s){ return '<div class="bar-seg" style="width:'+(s.pct)+'%;background:'+s.color+'"></div>'; }).join('');
        var legend = segs.map(function(s){ return '<span><i style="background:'+s.color+'"></i>'+s.label+' ('+s.n+')</span>'; }).join('');
        b.innerHTML = '<div class="bar-label"><span>'+title+'</span></div><div class="bar-track">'+track+'</div><div class="legend">'+legend+'</div>';
        return b;
      }
      var stageCounts = {todo:0, doing:0, done:0};
      list.forEach(function(t){ stageCounts[stageOf(t)]++; });
      wrap.appendChild(bar('По этапу', [
        {pct: stageCounts.todo/total*100, color:'var(--ink-dim)', label:'новое', n:stageCounts.todo},
        {pct: stageCounts.doing/total*100, color:'var(--accent)', label:'в работе', n:stageCounts.doing},
        {pct: stageCounts.done/total*100, color:'var(--good)', label:'готово', n:stageCounts.done}
      ]));
    }

    var goRow = document.createElement('div');
    goRow.style.cssText = 'display:flex; gap:8px;';
    var goBoard = document.createElement('button');
    goBoard.className = 'btn sm ghost'; goBoard.style.flex = '1';
    goBoard.textContent = 'Доска →';
    goBoard.addEventListener('click', function(){ uiFor(slug).view = 'board'; renderAll(); });

    goList.className = 'btn sm ghost'; goList.style.flex = '1';
    goList.textContent = 'Список →';
    goList.addEventListener('click', function(){ uiFor(slug).view = 'list'; renderAll(); });
    goRow.appendChild(goBoard); goRow.appendChild(goList);
    wrap.appendChild(goRow);

    return wrap;
  }

  // ===================================================================
  // BOARD (Kanban view — Новое / В работе / Готово)
  //   `stage` is a lightweight extra field layered on top of the existing
  //   status:'open'|'done' so Calendar/List/Dashboard keep working unchanged.
  //   Missing stage is inferred from status for tasks created before this.
  // ===================================================================
  var TASK_STAGES = [['todo','Новое'],['doing','В работе'],['done','Готово']];
  var STAGE_COLOR = {todo:'var(--ink-dim)', doing:'var(--accent)', done:'var(--good)'};
  function stageOf(t){
    if(t.stage && TASK_STAGES.some(function(c){return c[0]===t.stage;})) return t.stage;
    return t.status==='done' ? 'done' : 'todo';
  }
  function moveStage(slug, t, newStage){
    if(!dbNs || !canWrite) return;
    dbNs.doc('employees/'+slug+'/tasks/'+t.id).update({
      stage:newStage, status: newStage==='done'?'done':'open', updated_at:new Date().toISOString()
    });
  }

  function renderBoard(slug){
    var ui = uiFor(slug);
    if(!ui.boardStage || !TASK_STAGES.some(function(c){return c[0]===ui.boardStage;})) ui.boardStage = 'todo';
    var outer = document.createElement('div');
    var tasks = (tasksBySlug[slug]||[]).slice();
    tasks.sort(function(a,b){ return (a.date||a.start_date||a.created_at||'').localeCompare(b.date||b.start_date||b.created_at||''); });

    var hint = document.createElement('p');
    hint.style.cssText = 'margin:0 0 9px;color:var(--ink-dim);font-size:12px;';
    hint.textContent = 'Переключайте этап кнопками ниже. Стрелки на карточке передвигают задачу между этапами.';
    outer.appendChild(hint);

    // Stage switcher replaces side-scrolling columns — one full-width list at a time, nothing to swipe.
    var seg = document.createElement('div');
    seg.className = 'stage-seg';
    TASK_STAGES.forEach(function(c){
      var n = tasks.filter(function(t){ return stageOf(t)===c[0]; }).length;
      var b = document.createElement('button');
      b.className = 'stage-btn'+(ui.boardStage===c[0]?' active':'');
      b.style.setProperty('--stage-c', STAGE_COLOR[c[0]]);
      b.textContent = c[1]+' ('+n+')';
      b.addEventListener('click', function(){ ui.boardStage = c[0]; renderAll(); });
      seg.appendChild(b);
    });
    outer.appendChild(seg);

    var ci = TASK_STAGES.findIndex(function(c){ return c[0]===ui.boardStage; });
    var col = document.createElement('div');
    col.className = 'board-col';
    col.style.cssText = 'width:100%; max-width:none; margin-top:10px;';
    col.style.setProperty('--stage-c', STAGE_COLOR[ui.boardStage]);
    var colTasks = tasks.filter(function(t){ return stageOf(t)===ui.boardStage; });
    if(!colTasks.length){
      var emp = document.createElement('div'); emp.className='board-empty'; emp.style.padding='22px 2px'; emp.textContent='Пусто';
      col.appendChild(emp);
    }
    colTasks.forEach(function(t){
      var card = document.createElement('div');
      card.className = 'board-card';
      var dateLabel = t.type==='point' ? (t.date?fmtHuman(t.date)+(t.time?' '+t.time:''):'') :
                      t.type==='range' ? (fmtHuman(t.start_date)+'–'+fmtHuman(t.end_date)) : '';
      var overdue = isOverdue(t);
      var navHtml = canWrite ? (
        '<div class="bc-nav">' +
          (ci>0 ? '<button class="bc-move" data-dir="-1" title="Назад">← '+esc(TASK_STAGES[ci-1][1])+'</button>' : '<span></span>') +
          (ci<TASK_STAGES.length-1 ? '<button class="bc-move" data-dir="1" title="Дальше">'+esc(TASK_STAGES[ci+1][1])+' →</button>' : '<span></span>') +
        '</div>'
      ) : '';
      card.innerHTML =
        '<span class="bc-title">'+esc(t.title)+'</span>' +
        '<span class="bc-meta'+(overdue?' overdue':'')+'">'+(dateLabel?esc(dateLabel):'без срока')+(t.from_person?' · '+esc(t.from_person):'')+'</span>' +
        navHtml;
      card.addEventListener('click', function(ev){
        if(ev.target.closest('.bc-move')) return;
        openTaskModal(slug, t.id);
      });
      card.querySelectorAll('.bc-move').forEach(function(btn){
        btn.addEventListener('click', function(ev){
          ev.stopPropagation();
          var dir = +btn.getAttribute('data-dir');
          var dest = TASK_STAGES[ci+dir][0];
          moveStage(slug, t, dest);
          ui.boardStage = dest; // follow the card so it doesn't just vanish from view
          renderAll();
        });
      });
      col.appendChild(card);
    });
    outer.appendChild(col);
    return outer;
  }

  var DOW = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  var MONTHS = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];

  function renderCalendar(slug){
    var ui = uiFor(slug);
    var box = document.createElement('div');
    box.className = 'box';
    var nav = document.createElement('div');
    nav.className = 'cal-nav';
    nav.innerHTML = '<button id="calPrev">‹</button><span class="cal-title">'+MONTHS[ui.calM]+' '+ui.calY+'</span><button id="calNext">›</button>';
    box.appendChild(nav);
    nav.querySelector('#calPrev').addEventListener('click', function(){ ui.calM--; if(ui.calM<0){ui.calM=11; ui.calY--;} renderAll(); });
    nav.querySelector('#calNext').addEventListener('click', function(){ ui.calM++; if(ui.calM>11){ui.calM=0; ui.calY++;} renderAll(); });

    var grid = document.createElement('div');
    grid.className = 'cal-grid';
    grid.style.marginTop = '8px';
    DOW.forEach(function(d){ var el=document.createElement('div'); el.className='cal-dow'; el.textContent=d; grid.appendChild(el); });

    var first = new Date(ui.calY, ui.calM, 1);
    var startOffset = (first.getDay()+6)%7; // Monday=0
    var startCell = new Date(ui.calY, ui.calM, 1-startOffset);
    var tasks = tasksBySlug[slug]||[];
    var notes = dayNotesBySlug[slug]||{};

    for(var i=0;i<42;i++){
      var d = new Date(startCell.getFullYear(), startCell.getMonth(), startCell.getDate()+i);
      var iso = isoDate(d);
      var cell = document.createElement('div');
      cell.className = 'cal-cell' + (d.getMonth()!==ui.calM?' outside':'') + (iso===todayISO?' today':'');
      var dayTasks = tasks.filter(function(t){
        if(t.type==='point') return t.date===iso;
        if(t.type==='range') return t.start_date<=iso && iso<=t.end_date;
        return false;
      });
      var html = '<span class="cal-daynum">'+d.getDate()+'</span>';
      dayTasks.slice(0,3).forEach(function(t){
        html += '<div class="cal-chip'+(t.status==='done'?' done':'')+'" data-task="'+esc(t.id)+'">'+esc(t.title)+'</div>';
      });
      if(dayTasks.length>3) html += '<div class="cal-chip">+'+(dayTasks.length-3)+'</div>';
      if(notes[iso] && notes[iso].length) html += '<span class="cal-note-dot"></span>';
      cell.innerHTML = html;
      cell.addEventListener('click', function(ev){
        var chip = ev.target.closest('[data-task]');
        if(chip){ ev.stopPropagation(); openTaskModal(slug, chip.getAttribute('data-task')); return; }
      });
      cell.addEventListener('click', (function(iso){ return function(ev){
        if(ev.target.closest('[data-task]')) return;
        openDayModal(slug, iso);
      };})(iso));
      grid.appendChild(cell);
    }
    box.appendChild(grid);
    return box;
  }

  function renderList(slug){
    var ui = uiFor(slug);
    var wrap = document.createElement('div');
    wrap.style.cssText='display:flex;flex-direction:column;gap:10px;';

    var filters = document.createElement('div');
    filters.className = 'filters';
    [['active','Активные'],['all','Все'],['done','Выполненные']].forEach(function(p){
      var b=document.createElement('button');
      b.textContent=p[1];
      if(ui.filter===p[0]) b.className='active';
      b.addEventListener('click', function(){ ui.filter=p[0]; renderAll(); });
      filters.appendChild(b);
    });
    wrap.appendChild(filters);

    var tasks = (tasksBySlug[slug]||[]).slice();
    var dated = tasks.filter(function(t){ return t.type!=='ongoing'; });
    var ongoing = tasks.filter(function(t){ return t.type==='ongoing'; });
    dated.sort(function(a,b){ return (a.date||a.start_date||'').localeCompare(b.date||b.start_date||''); });

    function applyFilter(list){
      if(ui.filter==='active') return list.filter(function(t){return t.status!=='done';});
      if(ui.filter==='done') return list.filter(function(t){return t.status==='done';});
      return list;
    }

    var listEl = document.createElement('div');
    listEl.style.cssText='display:flex;flex-direction:column;gap:7px;';
    var shown = applyFilter(dated);
    if(!shown.length){
      var e1=document.createElement('div'); e1.className='empty'; e1.style.marginTop='10px';
      e1.textContent='Нет задач по этому фильтру.'; listEl.appendChild(e1);
    }
    shown.forEach(function(t){ listEl.appendChild(taskRow(slug,t)); });
    wrap.appendChild(listEl);

    var ongoingShown = applyFilter(ongoing);
    if(ongoingShown.length){
      var h = document.createElement('div');
      h.style.cssText='font-size:12px;color:var(--ink-dim);font-weight:600;margin-top:6px;';
      h.textContent = 'БЕЗ СРОКА';
      wrap.appendChild(h);
      var ol = document.createElement('div');
      ol.style.cssText='display:flex;flex-direction:column;gap:7px;';
      ongoingShown.forEach(function(t){ ol.appendChild(taskRow(slug,t)); });
      wrap.appendChild(ol);
    }

    var qa = document.createElement('div');
    qa.className = 'quickadd';
    qa.innerHTML = '<input type="text" placeholder="Добавить заметку-задачу без срока…" id="qaInput"><button id="qaBtn">+</button>';
    wrap.appendChild(qa);
    function submitQa(){
      var inp = qa.querySelector('#qaInput');
      var v = inp.value.trim();
      if(!v || !dbNs || !canWrite) return;
      dbNs.collection('employees/'+slug+'/tasks').add({
        title:v, type:'ongoing', status:'open', date:'', time:'', start_date:'', end_date:'',
        from_person:'', location:'', description:'', notes:'', notes_log:[], checklist:[], attachments:[],
        created_at:new Date().toISOString(), updated_at:new Date().toISOString()
      }).then(function(){ inp.value=''; });
    }
    qa.querySelector('#qaBtn').addEventListener('click', submitQa);
    qa.querySelector('#qaInput').addEventListener('keydown', function(ev){ if(ev.key==='Enter') submitQa(); });

    return wrap;
  }

  function taskRow(slug, t){
    var row = document.createElement('button');
    row.className = 'task-row'+(t.status==='done'?' done':'');
    var dateLabel = t.type==='point' ? (t.date?fmtHuman(t.date)+(t.time?' '+t.time:''):'') :
                    t.type==='range' ? (fmtHuman(t.start_date)+'–'+fmtHuman(t.end_date)) : '';
    var overdue = isOverdue(t);
    row.innerHTML =
      '<span class="task-dot '+(t.status==='done'?'done':'open')+'"></span>' +
      '<span class="t-body"><span class="t-title">'+esc(t.title)+'</span>' +
      (t.from_person?'<span class="t-meta"> от '+esc(t.from_person)+'</span>':'') + '</span>' +
      '<span class="t-date tabular'+(overdue?' overdue':'')+'">'+esc(dateLabel)+'</span>';
    row.addEventListener('click', function(){ openTaskModal(slug, t.id); });
    return row;
  }
