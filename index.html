  function renderEventChips(){
    var counts = {};
    contacts.forEach(function(c){
      var v = (c.event||'').trim();
      if(!v) return;
      var key = v.toLowerCase();
      if(!counts[key]) counts[key] = {label:v, n:0, last:c.created_at||''};
      counts[key].n++;
      if((c.created_at||'') > counts[key].last) counts[key].last = c.created_at||'';
    });
    var list = Object.keys(counts).map(function(k){ return counts[k]; });
    list.sort(function(a,b){ return b.n-a.n || (b.last||'').localeCompare(a.last||''); });
    list = list.slice(0,6);
    fEventChips.innerHTML = '';
    list.forEach(function(item){
      var chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'event-chip';
      chip.textContent = item.label;
      chip.addEventListener('click', function(){ document.getElementById('fEvent').value = item.label; });
      fEventChips.appendChild(chip);
    });
  }

  function downscaleImageFile(file, maxDim){
    return new Promise(function(resolve){
      try{
        var url = URL.createObjectURL(file);
        var img = new Image();
        img.onload = function(){
          try{
            var w = img.naturalWidth, h = img.naturalHeight;
            if(!w || !h || (w<=maxDim && h<=maxDim)){ URL.revokeObjectURL(url); resolve(file); return; }
            var scale = Math.min(1, maxDim/Math.max(w,h));
            var cw = Math.max(1, Math.round(w*scale)), ch = Math.max(1, Math.round(h*scale));
            var canvas = document.createElement('canvas');
            canvas.width = cw; canvas.height = ch;
            var ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, cw, ch);
            canvas.toBlob(function(blob){
              URL.revokeObjectURL(url);
              if(!blob){ resolve(file); return; }
              resolve(new File([blob], (file.name||'photo').replace(/\.[^.]+$/,'')+'.jpg', {type:'image/jpeg'}));
            }, 'image/jpeg', 0.85);
          }catch(e){ URL.revokeObjectURL(url); resolve(file); }
        };
        // Some formats (e.g. HEIC in non-Safari browsers) can't be decoded
        // into an <img> — fall back to the original file untouched.
        img.onerror = function(){ URL.revokeObjectURL(url); resolve(file); };
        img.src = url;
      }catch(e){ resolve(file); }
    });
  }

  function onContactPhotoPicked(ev){
    var input = ev.target;
    var file = input.files && input.files[0];
    if(!file) return;
    photoStep.hidden = true; photoPreviewWrap.hidden = false; formFields.hidden = false;
    retakeBtn.hidden = false; saveContactBtn.hidden = false; saveContactBtn.disabled = false;
    setContactStatus('', '<span class="spinner"></span> Готовлю фото…');
    // Phone photos can be very large (multiple MB, 4000px+) — shrink to a
    // size that's plenty for OCR and much less likely to time out or hit
    // a request-size limit.
    downscaleImageFile(file, 1600).then(function(optimized){
      selectedContactFile = optimized;
      photoPreviewImg.src = URL.createObjectURL(optimized);
      tryRecognizeContact(optimized);
    });
  }

  function renderVisitCardImage(fields){
    return new Promise(function(resolve){
      var W = 1050, H = 580;
      var canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = '#F4F5F7'; ctx.fillRect(0,0,W,H);
      var grad = ctx.createLinearGradient(0,0,W,0);
      grad.addColorStop(0,'#16213E'); grad.addColorStop(1,'#0D1428');
      ctx.fillStyle = grad; ctx.fillRect(0,0,W,140);
      ctx.fillStyle = '#C9A14A'; ctx.fillRect(0,138,W,3);
      ctx.fillStyle = '#ffffff'; ctx.font = '600 24px "IBM Plex Sans", Arial, sans-serif';
      ctx.fillText('Ассоциация корейцев Казахстана', 40, 56);
      ctx.fillStyle = '#C9A14A'; ctx.font = '600 14px "IBM Plex Sans", Arial, sans-serif';
      ctx.fillText('ВИЗИТНАЯ КАРТОЧКА · ЦИФРОВАЯ КОПИЯ', 40, 86);

      var y = 210;
      ctx.fillStyle = '#14192B'; ctx.font = '700 36px "IBM Plex Sans", Arial, sans-serif';
      ctx.fillText(fields.name || 'Без имени', 40, y); y += 50;
      ctx.fillStyle = '#59617A'; ctx.font = '500 21px "IBM Plex Sans", Arial, sans-serif';
      if(fields.position){ ctx.fillText(fields.position, 40, y); y += 32; }
      if(fields.company){ ctx.font = '600 21px "IBM Plex Sans", Arial, sans-serif'; ctx.fillStyle = '#14192B'; ctx.fillText(fields.company, 40, y); y += 32; }
      y += 18;
      ctx.strokeStyle = '#DDE1E8'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(40,y); ctx.lineTo(W-40,y); ctx.stroke(); y += 36;
      ctx.font = '500 20px "IBM Plex Mono", monospace'; ctx.fillStyle = '#2A78D6';
      if(fields.phone){ ctx.fillText('☎  '+fields.phone, 40, y); y += 34; }
      if(fields.email){ ctx.fillText('✉  '+fields.email, 40, y); y += 34; }
      ctx.fillStyle = '#AAB0C0'; ctx.font = '400 13px "IBM Plex Sans", Arial, sans-serif';
      ctx.fillText('Добавлено через визитницу АКК · '+new Date().toLocaleDateString('ru-RU'), 40, H-24);
      canvas.toBlob(function(blob){ resolve(blob); }, 'image/png', 0.95);
    });
  }

  // ---------------------------------------------------------------------
  // One-time, in-browser Gemini key entry. No key is ever committed to the
  // repo (that's what got the previous one auto-revoked by Google after
  // GitHub's secret scanner flagged it) — instead each device saves its own
  // copy to localStorage, pasted once right here.
  // ---------------------------------------------------------------------
  function hasGeminiKey(){ return !!(window.AKK_GEMINI_KEY && window.AKK_GEMINI_KEY.get()); }
  function showGeminiKeyPrompt(reasonHtml, onSaved){
    recognizeStatus.hidden = false;
    recognizeStatus.className = 'status-line warn';
    recognizeStatus.innerHTML =
      '<div style="display:flex;flex-direction:column;gap:8px;width:100%;">' +
      '<div>'+reasonHtml+' Вставьте бесплатный ключ Gemini (один раз на это устройство) — получить: ' +
      '<a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a></div>' +
      '<div style="display:flex;gap:8px;">' +
      '<input id="geminiKeyInput" type="text" placeholder="Вставьте ключ сюда" style="flex:1;min-width:0;font:inherit;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);">' +
      '<button type="button" id="geminiKeySave" class="btn primary sm">Сохранить</button>' +
      '</div></div>';
    document.getElementById('geminiKeySave').addEventListener('click', function(){
      var v = document.getElementById('geminiKeyInput').value.trim();
      if(!v) return;
      window.AKK_GEMINI_KEY.set(v);
      onSaved();
    });
  }

  function tryRecognizeContact(file){
    if(!sampleNs){ setContactStatus('', 'Автораспознавание недоступно — заполните поля вручную.'); return; }
    sampleNs.limits().then(function(limits){
      if(!limits.images){ setContactStatus('', 'Автораспознавание фото недоступно здесь — заполните поля вручную.'); return; }
      setContactStatus('', '<span class="spinner"></span> Распознаю визитку…');
      var prompt = 'Это фотография деловой визитки (может быть на русском, казахском, корейском или английском). '
        + 'Прочитай с неё данные и верни ТОЛЬКО JSON-объект без пояснений, строго такого вида: '
        + '{"name": "Имя Фамилия", "position": "должность", "company": "название компании/организации", "phone": "телефон как на визитке", "email": "email"}. '
        + 'Если какого-то поля на визитке нет — поставь пустую строку "". Не выдумывай данные.';
      sampleNs.json(prompt, {images:[file], modelTier:'quick'}).then(function(data){
        document.getElementById('fName').value = data.name||'';
        document.getElementById('fPosition').value = data.position||'';
        document.getElementById('fCompany').value = data.company||'';
        document.getElementById('fPhone').value = data.phone||'';
        document.getElementById('fEmail').value = data.email||'';
        setContactStatus('good', '<span class="spinner"></span> Распознано — формирую карточку и сверяю с интернетом…');

        // Replace the raw photo with a clean generated card file (not the
        // cluttered original photo) as what actually gets uploaded.
        renderVisitCardImage(data).then(function(cardBlob){
          if(cardBlob){
            var cardFile = new File([cardBlob], 'visitka.png', {type:'image/png'});
            selectedContactFile = cardFile;
            photoPreviewImg.src = URL.createObjectURL(cardBlob);
          }
        });

        // Cross-check name/company against the open internet (best-effort;
        // silently skipped if the model/tooling doesn't support it here).
        var canVerify = sampleNs && typeof sampleNs.verify === 'function' && (data.name || data.company);
        var verifyP = canVerify ? sampleNs.verify(data).catch(function(){ return ''; }) : Promise.resolve('');
        verifyP.then(function(note){
          if(note){
            var noteField = document.getElementById('fNote');
            noteField.value = (noteField.value ? noteField.value + '\n' : '') + note;
          }
          setContactStatus('good', 'Распознано — проверьте поля и сохраните.');
        });
      }).catch(function(e){
        if(e.code==='no_key'){
          showGeminiKeyPrompt('Автораспознавание ещё не настроено на этом устройстве.', function(){ tryRecognizeContact(file); });
        } else if(e.code==='bad_key'){
          showGeminiKeyPrompt('Сохранённый ключ Gemini не работает (устарел или отозван) — вставьте новый.', function(){ tryRecognizeContact(file); });
        } else if(e.code==='not_granted'){
          setContactStatus('', 'Автораспознавание не разрешено — заполните поля вручную.');
        } else if(e.code==='rate_limited'){
          setContactStatus('warn', 'Сейчас перегружено — заполните поля вручную или попробуйте позже.');
        } else if(e.code==='overloaded'){
          setContactStatus('warn', 'Gemini сейчас перегружен — заполните поля вручную или попробуйте через минуту.');
        } else {
          var detail = (e && e.message) ? String(e.message).slice(0,200) : '';
          setContactStatus('warn', 'Не удалось распознать автоматически — заполните поля вручную.' +
            (detail ? '<div style="margin-top:4px;font-size:11px;opacity:.7;word-break:break-word;">'+esc(detail)+'</div>' : ''));
        }
      });
    }).catch(function(){ setContactStatus('', 'Автораспознавание недоступно — заполните поля вручную.'); });
  }
  saveContactBtn.addEventListener('click', function(){
    var name = document.getElementById('fName').value.trim();
    if(!name){ setContactStatus('warn', 'Укажите хотя бы имя.'); return; }
    if(!dbNs){ setContactStatus('warn', 'База недоступна.'); return; }
    var isEdit = contactFormMode==='edit';
    var savingLabel = isEdit ? 'Сохранить изменения' : 'Сохранить контакт';
    saveContactBtn.disabled = true; saveContactBtn.textContent = 'Сохраняю…';
    var record = {
      name:name, position:document.getElementById('fPosition').value.trim(), company:document.getElementById('fCompany').value.trim(),
      phone:document.getElementById('fPhone').value.trim(), email:document.getElementById('fEmail').value.trim(),
      notes:document.getElementById('fNote').value.trim(),
      event:document.getElementById('fEvent').value.trim(),
      stage:getFStage(),
      next_step:document.getElementById('fNextStep').value.trim(),
      next_step_date:document.getElementById('fNextDate').value.trim()
    };
    if(!isEdit) record.created_at = new Date().toISOString();
    function finishSave(photoId){
      if(photoId) record.photo_id = photoId;
      if(isEdit){
        dbNs.doc('contacts/'+contactFormEditId).update(record).then(function(){
          saveContactBtn.disabled = false; saveContactBtn.textContent = savingLabel;
          addOverlay.hidden = true;
        }).catch(function(){
          saveContactBtn.disabled = false; saveContactBtn.textContent = savingLabel;
          setContactStatus('warn', 'Не удалось сохранить. Попробуйте ещё раз.');
        });
        return;
      }
      var afterUser = userNs ? userNs.id().catch(function(){return null;}) : Promise.resolve(null);
      afterUser.then(function(uid){
        if(uid) record.added_by = uid;
        return dbNs.collection('contacts').add(record);
      }).then(function(){
        saveContactBtn.disabled = false; saveContactBtn.textContent = savingLabel;
        addOverlay.hidden = true;
      }).catch(function(e){
        saveContactBtn.disabled = false; saveContactBtn.textContent = savingLabel;
        setContactStatus('warn', 'Не удалось сохранить. Попробуйте ещё раз.');
      });
    }
    if(selectedContactFile && assetsNs){
      assetsNs.upload(selectedContactFile).then(function(res){ finishSave(res.id); }).catch(function(){ finishSave(null); });
    } else { finishSave(null); }
  });

  // contact detail
  var detailOverlay = document.getElementById('detailOverlay');
  var detailName = document.getElementById('detailName');
  var detailPhotoWrap = document.getElementById('detailPhotoWrap');
  var detailPhotoImg = document.getElementById('detailPhotoImg');
  var detailRows = document.getElementById('detailRows');
  var deleteContactBtn = document.getElementById('deleteContactBtn');
  var editContactBtn = document.getElementById('editContactBtn');

  function detailRow(label, value, mailto){
    if(!value) return '';
    var action = mailto ? '<a href="mailto:'+esc(value)+'" class="copy-btn" style="text-decoration:none;">написать</a>' : '';
    return '<div class="detail-row"><span class="detail-label">'+esc(label)+'</span>' +
      '<span class="detail-value-wrap"><span class="detail-value">'+esc(value)+'</span>'+action+'</span></div>';
  }
  var detailCrm = document.getElementById('detailCrm');
  function openContactDetail(id){
    var c = contacts.find(function(x){return x.id===id;});
    if(!c) return;
    editingContactId = id;
    detailName.textContent = c.name || 'Без имени';
    if(c.photo_id){ detailPhotoWrap.hidden = false; detailPhotoImg.src = ''+c.photo_id; }
    else detailPhotoWrap.hidden = true;

    var stage = contactStageOf(c);
    var nextOverdue = c.next_step_date && c.next_step_date < todayISO;
    detailCrm.innerHTML =
      (c.event ? '<div class="event-banner">📌 '+esc(c.event)+'</div>' : '') +
      '<span class="stage-pill" style="--pill-c:'+CONTACT_STAGE_COLOR[stage]+'">'+esc(CONTACT_STAGE_LABEL[stage])+'</span>' +
      '<div class="crm-box" style="margin-top:7px;">' +
        '<div class="crm-line"><span>Последний контакт</span><b>'+(c.last_contact_at ? fmtHuman(c.last_contact_at) : '—')+'</b></div>' +
        (canWrite ? '<button class="crm-touch-btn" id="markContactedBtn" style="align-self:flex-start;">✓ Связались сегодня</button>' : '') +
        (c.next_step ? '<div class="crm-line'+(nextOverdue?' overdue':'')+'"><span>Следующий шаг</span><b>'+esc(c.next_step)+(c.next_step_date?' · '+fmtHuman(c.next_step_date):'')+'</b></div>' : '') +
      '</div>';
    var markBtn = document.getElementById('markContactedBtn');
    if(markBtn) markBtn.addEventListener('click', function(){
      markBtn.disabled = true; markBtn.textContent = '…';
      dbNs.doc('contacts/'+id).update({last_contact_at:todayISO}).catch(function(){}).then(function(){
        markBtn.disabled = false; markBtn.textContent = '✓ Связались сегодня';
      });
    });

    detailRows.innerHTML =
      detailRow('Должность', c.position) + detailRow('Компания', c.company) +
      detailRow('Телефон', c.phone) + detailRow('Email', c.email, true) +
      detailRow('Заметка', c.notes) +
      detailRow('Добавлен', c.created_at ? fmtAtHuman(c.created_at) : '') +
      (c.email ? '<p class="mailto-note">Ссылка «написать» открывает вашу почтовую программу — работает не в каждом браузере/окне, адрес выше можно скопировать вручную.</p>' : '');
    deleteContactBtn.hidden = !canWrite;
    editContactBtn.hidden = !canWrite;
    detailOverlay.hidden = false;
  }
  document.getElementById('detailClose').addEventListener('click', function(){ detailOverlay.hidden = true; });
  detailOverlay.addEventListener('click', function(e){ if(e.target===detailOverlay) detailOverlay.hidden = true; });
  editContactBtn.addEventListener('click', function(){
    var c = contacts.find(function(x){return x.id===editingContactId;});
    if(c) openEditContact(c);
  });
  deleteContactBtn.addEventListener('click', function(){
    if(!editingContactId || !dbNs) return;
    deleteContactBtn.disabled = true; deleteContactBtn.textContent = 'Удаляю…';
    dbNs.doc('contacts/'+editingContactId).delete().then(function(){
      detailOverlay.hidden = true; deleteContactBtn.disabled = false; deleteContactBtn.textContent = 'Удалить';
    }).catch(function(){ deleteContactBtn.disabled = false; deleteContactBtn.textContent = 'Удалить'; });
  });

  // ===================================================================
  // BOOT
  // ===================================================================
  function subscribeEmployee(id){
    if(subscribed[id] || !dbNs) return;
    subscribed[id] = true;
    tasksBySlug[id] = tasksBySlug[id] || [];
    dayNotesBySlug[id] = dayNotesBySlug[id] || {};
    dbNs.collection('employees/'+id+'/tasks').onSnapshot(function(snap){
      tasksBySlug[id] = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      renderAll();
    }, function(){});
    dbNs.collection('employees/'+id+'/day_notes').onSnapshot(function(snap){
      var map = {};
      snap.docs.forEach(function(d){ map[d.id] = (d.data()||{}).entries || []; });
      dayNotesBySlug[id] = map;
      renderAll();
    }, function(){});
  }

  function bootDb(){
    if(!dbNs){ document.getElementById('main').innerHTML = '<div class="empty">База недоступна в этом окне.</div>'; return; }
    dbNs.collection('employees').onSnapshot(function(snap){
      employees = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      employees.forEach(function(e){ subscribeEmployee(e.id); });
      if(activeTab==='summary' && !employees.length){ /* fine, summary renders empty state */ }
      if(activeTab!=='summary' && activeTab!=='contacts' && !employees.find(function(e){return e.id===activeTab;})){
        // keep tab selection even if not yet loaded; once it loads it will render
      }
      renderAll();
    }, function(){});
    dbNs.collection('contacts').onSnapshot(function(snap){
      contacts = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      if(activeTab==='contacts') renderAll();
    }, function(){});
    dbNs.collection('automation_rules').onSnapshot(function(snap){
      automationRules = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      if(activeTab==='automation') renderAll();
    }, function(){});
    dbNs.collection('approval_requests').onSnapshot(function(snap){
      approvalRequests = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      if(activeTab==='approvals') renderAll();
      var apprDetailOv = document.getElementById('apprDetailOverlay');
      if(apprDetailOv && !apprDetailOv.hidden) renderApprovalDetail();
    }, function(){});
  }

  function boot(){
    var w = (window.claude && window.claude.use) ? window.claude : null;
    var uses = w ? [
      w.use('db').catch(function(){return null;}),
      w.use('assets').catch(function(){return null;}),
      w.use('sample').catch(function(){return null;}),
      w.use('user').catch(function(){return null;})
    ] : [Promise.resolve(null),Promise.resolve(null),Promise.resolve(null),Promise.resolve(null)];
    Promise.all(uses).then(function(res){
      dbNs=res[0]; assetsNs=res[1]; sampleNs=res[2]; userNs=res[3];
      canWrite = !!assetsNs;
      renderAll();
      bootDb();
    });
  }
  renderAll();
  boot();
})();
</script>
